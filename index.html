  current = k;
  document.body.classList.toggle('viz-floral', isFloral(k));
  document.body.classList.toggle('viz-kaleido', isKaleido(k) || isCosmos(k));
  if (isFloral(k) && !curPic && pics.length) showPicture(pickPic());
  if (viz && k === DUO_PRESET) startDuo();
  else if (isFloral(k) && curPic && slots[0].pic !== curPic) loadSlot(0, curPic);
  paintVizBar();
  markNowVisual();
  if (!viz) return;                 // remembered; loads once playback starts
  hot = 0;
  settled = performance.now() + CFG.settle;
  viz.loadPreset(presets[k], blend);
  restartCycle();
  wakeBar();
}
const roll = blend => showPreset(pickPreset(), blend);

function startVisualizer() {
  if (viz || !canViz || !presetKeys.length) return false;

  const [w, h] = vizSize();
  canvas.width = w; canvas.height = h;
  viz = butterchurn.createVisualizer(audioCtx, canvas, {
    width: w, height: h,
    pixelRatio: 1,      // dpr is already baked into width/height
    textureRatio: 1
  });
  uploadPic();

  // Butterchurn runs ~0.26s behind the audio it analyses, so delay the
  // audible path to match.
  tap = audioCtx.createDelay();
  tap.delayTime.value = 0.26;
  tap.connect(audioCtx.destination);

  // The visualizer hears a quieter copy: calmer visuals, same sound.
  drive = audioCtx.createGain();
  drive.gain.value = CFG.drive;
  tap.connect(drive);
  viz.connectAudio(drive);

  showPreset(current && presets[current] ? current : pickPreset(), 0);

  cancelAnimationFrame(fallbackRAF);
  fb.hidden = true;
  $('viz-bar').hidden = false;
  rendering = true;
  runLoop();
  return true;
}

/* ─── brightness governor ─────────────────────────────────────────
   Sample the frame down to 8×8; if a preset sits over the ceiling twice
   running, drop it for good. A visual you've liked is never dropped.
------------------------------------------------------------------ */
const probe = Object.assign(document.createElement('canvas'), { width: 8, height: 8 });
const pctx  = probe.getContext('2d', { willReadFrequently: true });

function brightness() {
  try {
    pctx.drawImage(canvas, 0, 0, 8, 8);
    const d = pctx.getImageData(0, 0, 8, 8).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4)
      sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    return sum / (d.length / 4) / 255;
  } catch { return 0; }
}

function runLoop() {
  let last = 0, checked = 0;
  (function loop(now) {
    if (!rendering) return;
    requestAnimationFrame(loop);

    // half rate while the drawer covers it
    const gap = document.body.classList.contains('drawer-open') ? 42 : 0;
    if (now - last < gap) return;
    last = now;

    viz.render();

    if (now < settled || now - checked < CFG.checkEvery) return;
    checked = now;

    // Florals and kaleidos are exempt: they're built to be bright, and tone themselves.
    if (brightness() * 0.72 > CFG.maxBrightness && vVoteOf(current) <= 0 && typeOf(current) === 'classic') {
      if (++hot >= 2) {
        banned.add(current); saveBans();
        console.info('nightdeck: too bright —', current);
        toast('Too bright · dropped');
        roll(2.5);
        refreshVisuals();
      }
    } else hot = 0;
  })(0);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { rendering = false; }
  else if (viz && !rendering) { rendering = true; runLoop(); }
});

/* ─── visual rating bar + gestures ────────────────────────────────
   Tap the visualizer to bring up its bar: name, 👍, 👎, next.
   Double-tap: next visual. Press and hold: thumbs down.
   Keyboard: → next visual, X thumbs down.
------------------------------------------------------------------ */
const vbar = $('viz-bar');
function paintVizBar() {
  $('vb-name').textContent = current || '';
  paintPicBar();
  const v = vVoteOf(current);
  $('vviz-up').setAttribute('aria-pressed', String(v > 0));
  $('vviz-down').setAttribute('aria-pressed', String(v < 0));
}
function wakeBar() {
  if (vbar.hidden) return;
  vbar.classList.remove('idle');
  clearTimeout(wakeBar._t);
  wakeBar._t = setTimeout(() => vbar.classList.add('idle'), 4500);
}

function vizVote(k, v) {
  if (!k) return;
  if (vVoteOf(k) === v) { delete vvotes[k]; toast('Visual vote removed'); }
  else {
    vvotes[k] = { v, at: new Date().toISOString() };
    toast(v > 0 ? 'Visual · thumbs up' : 'Visual · thumbs down');
  }
  store.set('nd.vizvotes', vvotes);
  navigator.vibrate?.(12);
  paintVizBar();
  if (k === current && v < 0 && vVoteOf(k) < 0 && !vfilter.down) roll(2.5);
  refreshVisuals();
}

$('vviz-up').addEventListener('click', () => { vizVote(current, 1); wakeBar(); });
$('vviz-down').addEventListener('click', () => { vizVote(current, -1); wakeBar(); });
$('vviz-next').addEventListener('click', () => { roll(2.5); });
$('vpic-up').addEventListener('click', () => { picVote(curPic, 1); wakeBar(); });
$('vpic-down').addEventListener('click', () => { picVote(curPic, -1); wakeBar(); });
$('vpic-next').addEventListener('click', () => { showPicture(pickPic()); wakeBar(); });

const onViz = e => !e.target.closest('#transport, #drawer, #viz-bar');
let held = null, lastTap = 0, lastX = 0, lastY = 0;

document.addEventListener('pointerdown', e => {
  if (!viz || !onViz(e)) return;
  wakeBar();
  const now = performance.now();
  const near = Math.hypot(e.clientX - lastX, e.clientY - lastY) < 32;
  if (now - lastTap < 320 && near) {
    if (held) { clearTimeout(held); held = null; }
    lastTap = 0;
    roll(2.5); toast('Next visual');
    return;
  }
  lastTap = now; lastX = e.clientX; lastY = e.clientY;
  held = setTimeout(() => { held = null; lastTap = 0; vizVote(current, -1); }, 650);
});
const release = () => { if (held) { clearTimeout(held); held = null; } };
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('pointermove', e => {
  if (viz && e.pointerType === 'mouse' && onViz(e)) wakeBar();
  if (held && Math.hypot(e.clientX - lastX, e.clientY - lastY) > 12) release();
});
document.addEventListener('contextmenu', e => { if (viz && onViz(e)) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); togglePlay(); }
  if (!viz) return;
  if (e.key === 'ArrowRight') { roll(2.5); toast('Next visual'); }
  if (e.key === 'x' || e.key === 'X') vizVote(current, -1);
});

/* Fallback: no WebGL2, or reduced motion. Soft drifting smoke on its own
   canvas (a canvas is bound to the first context type it's asked for). */
(function fallback() {
  if (viz) return;
  const ctx = fb.getContext('2d');
  if (!ctx) return;
  let W, H, dpr;
  const fit = () => { dpr = Math.min(devicePixelRatio||1,1.5);
    W = fb.clientWidth; H = fb.clientHeight;
    fb.width = W*dpr; fb.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  fit(); addEventListener('resize', fit);

  const TINTS = [[111,179,184],[232,163,61],[86,96,140],[198,120,150]];
  const puffs = Array.from({length:18},(_,i)=>({
    x:Math.random(), y:Math.random(), r:130+Math.random()*250,
    vx:(Math.random()-.5)*0.00016, vy:-0.00006-Math.random()*0.00012,
    t:TINTS[i%TINTS.length], a:.05+Math.random()*.07, ph:Math.random()*6.28 }));

  if (reduce) { ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H); return; }

  (function draw(now) {
    if (viz) return;
    fallbackRAF = requestAnimationFrame(draw);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of puffs) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -.3) { p.y = 1.3; p.x = Math.random(); }
      if (p.x < -.3) p.x = 1.3; if (p.x > 1.3) p.x = -.3;
      const r = p.r * (1 + Math.sin(now*0.00022 + p.ph)*0.14);
      const cx = p.x*W, cy = p.y*H;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      const [cr,cg,cb] = p.t;
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${p.a})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,6.284); ctx.fill();
    }
  })(0);
})();


/* ═══════════════════════════════════════════════════════════════════
   Pictures: the Floral Deck papers, full colour and sun print.
   The Floral visuals melt whichever one is current into the feedback
   loop (texture "flora"). Same voting and filters as tracks and visuals.
   ═══════════════════════════════════════════════════════════════════ */

const PICS_URL = new URL(CFG.pictures, location.href).href;
let pics = [], picById = new Map(), curPic = null, picCycle = null;
const pvotes  = store.get('nd.picvotes', {});
const pfilter = Object.assign({ up: true, none: true, down: false }, store.get('nd.pfilter', {}));
const ptype   = Object.assign({ color: true, sun: true }, store.get('nd.ptype', {}));
let picAuto   = store.get('nd.pauto', true);
const pVoteOf  = p => (p && pvotes[p.id]?.v) || 0;
const pAllowed = p => ptype[p.kind] && pfilter[catOf(pVoteOf(p))];
const PTYPE = { color: 'Full colour', sun: 'Sun print' };
const picLabel = p => p.kind === 'sun' ? `sun print${p.ink ? ' · ' + p.ink : ''}` : 'full colour';

async function loadPictures() {
  try {
    const r = await fetch(PICS_URL, { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    pics = (j.pictures || []).map(p => ({ ...p,
      url: new URL(p.file, PICS_URL).href, thumbUrl: new URL(p.thumb || p.file, PICS_URL).href }));
    picById = new Map(pics.map(p => [p.id, p]));
  } catch (e) { console.warn('pictures:', e); pics = []; }
}

function pickPic() {
  let live = pics.filter(p => p !== curPic && pAllowed(p));
  if (!live.length) live = pics.filter(pAllowed);
  if (!live.length) live = pics.filter(p => pVoteOf(p) >= 0);
  if (!live.length) live = pics;
  return live[Math.floor(Math.random() * live.length)];
}

/* Two picture slots, textures "flora" and "flora2". Most florals read only
   slot 0. Bloom Chintz reads both and melts from one into the other on its
   own DUO_PERIOD clock, so the slot that isn't on screen is kept loaded
   with the next paper. */
const slots = [
  { tex: 'flora',  pic: null, img: null, cycle: -1, canvas: document.createElement('canvas') },
  { tex: 'flora2', pic: null, img: null, cycle: -1, canvas: document.createElement('canvas') }
];

// Cover-fit a paper to the screen's shape, so the shaders can sample it 1:1.
function cropInto(sl) {
  const img = sl.img;
  if (!img) return false;
  const [w, h] = vizSize();
  const s = Math.min(1, 1024 / Math.max(w, h));
  const W = Math.max(2, Math.round(w * s)), H = Math.max(2, Math.round(h * s));
  sl.canvas.width = W; sl.canvas.height = H;
  const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
  sl.canvas.getContext('2d').drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  return true;
}
const cropPic = () => slots.map(cropInto).some(Boolean);

// Butterchurn only adds named textures once, so swap the pixels in place.
function uploadSlot(sl) {
  if (!viz || !sl.img) return;
  try {
    const I = viz.renderer.image;
    if (!I.samplers[sl.tex]) I.samplers[sl.tex] = I.gl.createTexture();
    I.bindTexture(I.samplers[sl.tex], sl.canvas, sl.canvas.width, sl.canvas.height);
  } catch (e) { console.warn('picture upload:', e); }
}
const uploadPic = () => slots.forEach(uploadSlot);

function loadSlot(i, p, cycle = -1) {
  const sl = slots[i];
  if (!p) return;
  sl.pic = p; sl.cycle = cycle;
  const img = new Image();
  img.onload = () => { if (sl.pic !== p) return; sl.img = img; cropInto(sl); uploadSlot(sl); };
  img.onerror = () => console.warn('picture failed:', p.url);
  img.src = p.url;
}

// Where Bloom Chintz is in its cycle: which slot is on screen, how far along.
// It reads the visualizer's own clock, the same `time` the preset sees.
function duoClock() {
  const t = viz?.renderer?.time ?? 0;
  const cyc = Math.floor(t / DUO_PERIOD);
  return { cyc, s: cyc % 2, ph: t / DUO_PERIOD - cyc };
}

function showPicture(p) {
  if (!p) return;
  curPic = p;
  paintPicBar(); markNowPic();
  if (viz && current === DUO_PRESET) { const { cyc, s } = duoClock(); loadSlot(s, p, cyc); }
  else loadSlot(0, p);
  restartPicCycle();
}

function restartPicCycle() {
  clearInterval(picCycle); picCycle = null;
  if (picAuto) picCycle = setInterval(() => {
    if (viz && isFloral(current) && current !== DUO_PRESET && !document.hidden) showPicture(pickPic());
  }, CFG.picHold);
}

// Bloom Chintz keeper: the on-screen slot holds this cycle's paper, the
// hidden slot the next one, and the bar follows whichever is showing.
function startDuo() {
  if (!viz) return;
  const { cyc, s } = duoClock();
  if (slots[s].pic !== curPic || !slots[s].img) loadSlot(s, curPic || pickPic(), cyc);
  else slots[s].cycle = cyc;
  loadSlot(1 - s, picAuto ? pickPic() : (curPic || pickPic()), cyc + 1);
}
setInterval(() => {
  if (!viz || current !== DUO_PRESET || document.hidden || !pics.length) return;
  const { cyc, s, ph } = duoClock();
  const vis = slots[s], hid = slots[1 - s];
  if (!vis.pic) loadSlot(s, curPic || pickPic(), cyc);
  if (hid.cycle !== cyc + 1 && (ph < 0.55 || !hid.img)) {
    loadSlot(1 - s, picAuto ? pickPic() : (vis.pic || curPic), cyc + 1);
  }
  const showing = ph > 0.82 ? hid.pic : vis.pic;
  if (showing && showing !== curPic) { curPic = showing; paintPicBar(); markNowPic(); }
}, 400);

function paintPicBar() {
  const row = $('vb-pic-row');
  const on = isFloral(current) && !!curPic;
  row.hidden = !on;
  if (!on) return;
  if ($('vb-thumb').getAttribute('src') !== curPic.thumbUrl) $('vb-thumb').src = curPic.thumbUrl;
  $('vb-pic').textContent = `${curPic.title} · ${picLabel(curPic)}`;
  const v = pVoteOf(curPic);
  $('vpic-up').setAttribute('aria-pressed', String(v > 0));
  $('vpic-down').setAttribute('aria-pressed', String(v < 0));
}

function picVote(p, v) {
  if (!p) return;
  if (pVoteOf(p) === v) { delete pvotes[p.id]; toast('Picture vote removed'); }
  else {
    pvotes[p.id] = { v, title: p.title, kind: p.kind, at: new Date().toISOString() };
    toast(v > 0 ? 'Picture · thumbs up' : 'Picture · thumbs down');
  }
  store.set('nd.picvotes', pvotes);
  navigator.vibrate?.(12);
  paintPicBar();
  if (p === curPic && pVoteOf(p) < 0 && !pfilter.down) showPicture(pickPic());
  refreshVisuals();
}

// Picking a picture from the list puts a Floral visual up if one isn't already.
function showPictureNow(p) {
  showPicture(p);
  if (!isFloral(current)) {
    const fl = presetKeys.filter(k => isFloral(k) && vVoteOf(k) >= 0);
    const k = fl.filter(k => vfilter[catOf(vVoteOf(k))]);
    const pool = k.length ? k : fl.length ? fl : presetKeys.filter(isFloral);
    showPreset(pool[Math.floor(Math.random() * pool.length)], 2.5);
  }
  toast(viz ? 'Showing it now' : 'Picked · shows when you press play');
}

/* ═══════════════════════════════════════════════════════════════════
   Audio
   ═══════════════════════════════════════════════════════════════════ */

const au       = $('au');
const playBtn  = $('play');
const trackEl  = $('track');
const artistEl = $('artist');
const voteUp   = $('vote-up');
const voteDn   = $('vote-down');
const prevBtn  = $('prev');
const nextBtn  = $('next');
const seek     = $('seek');
const shufBtn  = $('shuffle');

let allTracks = [], byId = new Map();
let queue = [], qi = 0, ready = false, nowT = null;
const hist = [];

/* ─── track votes + play filter ───────────────────────────────────
   Votes live in localStorage on this device. The play filter decides
   which groups the station draws from; tapping a track in a list plays
   it regardless, then the station carries on from the filter.
------------------------------------------------------------------ */
const votes   = store.get('nd.votes', {});
const tfilter = Object.assign({ up: true, none: true, down: false }, store.get('nd.filter', {}));
let shuffleOn = store.get('nd.shuffle', true);
const voteOf   = t => (t && votes[t.id]?.v) || 0;
const tAllowed = t => tfilter[catOf(voteOf(t))];

const shuffle = a => { for (let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const byName = (a, b) =>
  (a.artist || '').localeCompare(b.artist || '', undefined, { sensitivity: 'base' }) ||
  (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' });

function rebuildQueue(front) {
  const pool = allTracks.filter(tAllowed);
  if (shuffleOn) {
    queue = shuffle(pool.filter(t => t !== front));
    if (front) queue.unshift(front);
  } else {
    const sorted = pool.sort(byName);
    const i = front ? sorted.indexOf(front) : -1;
    queue = i >= 0 ? sorted.slice(i).concat(sorted.slice(0, i))
          : front ? [front, ...sorted] : sorted;
  }
  qi = 0;
}

// Track URLs in a manifest are relative to that manifest.
async function loadOne(lib) {
  const res = await fetch(lib.manifest, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${lib.name} library returned ${res.status}`);
  const raw = await res.json();
  const list = Array.isArray(raw) ? raw : (raw.tracks || []);
  return list.map(t => {
    if (typeof t === 'string') {
      const url = new URL(t, lib.manifest).href;
      const name = decodeURIComponent(t.split('/').pop().replace(/\.\w+$/, ''));
      return { id: url, url, title: name, artist: '', library: lib.name };
    }
    const url = new URL(t.url || t.src || t.file || t.path, lib.manifest).href;
    return { ...t, id: t.id || url, url, library: t.library || lib.name };
  });
}

async function loadLibrary() {
  try {
    const got = await Promise.allSettled(CFG.libraries.map(loadOne));
    allTracks = got.flatMap(r => r.status === 'fulfilled' ? r.value : []);
    if (!allTracks.length) {
      const why = got.find(r => r.status === 'rejected');
      throw new Error(why ? why.reason.message : 'the libraries have no tracks');
    }
    byId = new Map(allTracks.map(t => [t.id, t]));
    rebuildQueue();
    ready = true;
    prevBtn.disabled = nextBtn.disabled = false;
    trackEl.textContent = 'Ready';
    artistEl.textContent = `${queue.length} of ${allTracks.length} tracks`;
  } catch (e) {
    console.error('library:', e);
    trackEl.textContent = e.message;       // the console isn't reachable on a phone
    artistEl.textContent = 'library';
    playBtn.disabled = true;
  }
  renderTracks();
}

function paintVotes() {
  const v = voteOf(nowT);
  voteUp.disabled = voteDn.disabled = !nowT;
  voteUp.setAttribute('aria-pressed', String(v > 0));
  voteDn.setAttribute('aria-pressed', String(v < 0));
}

function show(t) {
  nowT = t;
  paintVotes();
  trackEl.textContent = t.title || 'Untitled';
  artistEl.textContent = t.artist || 'nightdeck';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || 'Untitled', artist: t.artist || 'NIGHTDECK', album: 'NIGHTDECK'
    });
  }
  markNowTrack();
}

// A second, silent element warms the next track into the HTTP cache.
const pre = new Audio();
pre.crossOrigin = 'anonymous';
pre.preload = 'auto';
pre.muted = true;

function cueTrack(t, record = true) {
  au.src = t.url;
  show(t);
  setTime(0, t.seconds || 0);
  seek.disabled = false;
  if (record && hist[hist.length - 1] !== t) { hist.push(t); if (hist.length > 200) hist.shift(); }
  const next = queue[qi + 1];
  if (next && next.url !== t.url) { pre.src = next.url; pre.load(); }
}

function ensureAudio() {
  if (audioCtx) return;
  // Must be created inside a tap; mobile browsers refuse otherwise.
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  srcNode = audioCtx.createMediaElementSource(au);
  if (startVisualizer()) srcNode.connect(tap);   // tap already goes to destination
  else srcNode.connect(audioCtx.destination);
}

async function playNow() {
  try {
    ensureAudio();
    await audioCtx.resume();
    await au.play();
  } catch (e) {
    console.error('playback:', e);
    trackEl.textContent = "That track wouldn't play";
  }
}

async function togglePlay() {
  if (!ready) return;
  if (!au.getAttribute('src')) {
    if (!queue.length) rebuildQueue();
    if (!queue.length) { toast('Nothing matches the play filter'); return; }
    qi = 0; cueTrack(queue[0]);
  }
  if (au.paused) await playNow(); else au.pause();
}
playBtn.addEventListener('click', togglePlay);

function nextTrack() {
  if (!ready) return;
  let guard = queue.length + 2;
  do {
    qi++;
    if (qi >= queue.length) {               // end of the run: reshuffle and go again
      const last = nowT;
      rebuildQueue();
      if (queue.length > 1 && queue[0] === last) qi = 1;
    }
  } while (queue.length && !tAllowed(queue[qi]) && --guard > 0);
  const t = queue[qi];
  if (!t || !tAllowed(t)) { toast('Nothing matches the play filter'); return; }
  cueTrack(t);
  if (audioCtx) playNow();
}

function prevTrack() {
  if (!ready) return;
  if (au.currentTime > 3 || hist.length < 2) { au.currentTime = 0; return; }
  hist.pop();
  const t = hist[hist.length - 1];
  const i = queue.indexOf(t);
  if (i >= 0) qi = i; else queue.splice(qi, 0, t);
  cueTrack(t, false);
  if (audioCtx) playNow();
}

// Play this track now, then carry on with the filter.
function playTrack(t) {
  if (!t) return;
  rebuildQueue(t);
  cueTrack(t);
  playNow();
}

nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);

function paintShuffle() {
  shufBtn.setAttribute('aria-pressed', String(shuffleOn));
  shufBtn.setAttribute('aria-label', shuffleOn ? 'Shuffle on' : 'Shuffle off (A to Z by artist)');
}
shufBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  store.set('nd.shuffle', shuffleOn);
  rebuildQueue(nowT);
  paintShuffle();
  toast(shuffleOn ? 'Shuffle on' : 'Shuffle off · A to Z by artist');
});
paintShuffle();

au.addEventListener('play',  () => {
  playBtn.setAttribute('aria-pressed','true');
  playBtn.setAttribute('aria-label','Pause');
  document.body.classList.add('is-playing');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
au.addEventListener('pause', () => {
  playBtn.setAttribute('aria-pressed','false');
  playBtn.setAttribute('aria-label','Play');
  document.body.classList.remove('is-playing');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});

let errors = 0;
au.addEventListener('ended', () => { errors = 0; nextTrack(); });
au.addEventListener('playing', () => { errors = 0; });
au.addEventListener('error', () => {
  if (!au.getAttribute('src')) return;
  if (++errors > 5) { trackEl.textContent = 'Tracks are failing to load'; return; }
  nextTrack();
});

/* ─── seek bar ───────────────────────────────────────────────────── */
const clock = s => {
  s = Math.max(0, Math.floor(s || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
let dragging = false;
function setTime(now, len) {
  $('t-now').textContent = clock(now);
  $('t-len').textContent = clock(len);
  const p = len ? Math.min(1, now / len) : 0;
  if (!dragging) seek.value = Math.round(p * 1000);
  seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
}
const duration = () => (isFinite(au.duration) && au.duration) || nowT?.seconds || 0;
au.addEventListener('timeupdate', () => {
  setTime(au.currentTime, duration());
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && duration()) {
    try { navigator.mediaSession.setPositionState({ duration: duration(), position: Math.min(au.currentTime, duration()), playbackRate: 1 }); } catch {}
  }
});
au.addEventListener('loadedmetadata', () => setTime(au.currentTime, duration()));
seek.addEventListener('input', () => {
  dragging = true;
  const len = duration();
  $('t-now').textContent = clock(seek.value / 1000 * len);
  seek.style.setProperty('--p', (seek.value / 10) + '%');
});
seek.addEventListener('change', () => {
  dragging = false;
  const len = duration();
  if (len) au.currentTime = seek.value / 1000 * len;
});

/* ─── lock screen / headset / media keys ─────────────────────────── */
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const on = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  on('play', () => togglePlay());
  on('pause', () => au.pause());
  on('nexttrack', nextTrack);
  on('previoustrack', prevTrack);
  on('seekto', d => { if (d.seekTime != null) au.currentTime = d.seekTime; });
  on('seekbackward', d => { au.currentTime = Math.max(0, au.currentTime - (d.seekOffset || 10)); });
  on('seekforward', d => { au.currentTime = Math.min(duration(), au.currentTime + (d.seekOffset || 10)); });
}

/* ─── voting ─────────────────────────────────────────────────────── */
function vote(t, v) {
  if (!t) return;
  if (voteOf(t) === v) {                  // the same thumb again takes it back
    delete votes[t.id];
    toast('Vote removed');
  } else {
    votes[t.id] = { v, title: t.title || '', artist: t.artist || '', library: t.library || '', at: new Date().toISOString() };
    const skip = v < 0 && t === nowT && !tfilter.down;
    toast(v > 0 ? 'Thumbs up · saved' : skip ? 'Thumbs down · skipping' : 'Thumbs down · saved');
  }
  store.set('nd.votes', votes);
  navigator.vibrate?.(12);
  if (t === nowT) paintVotes();
  refreshTracks();
  if (t === nowT && voteOf(t) < 0 && !tfilter.down && au.getAttribute('src')) nextTrack();
}
voteUp.addEventListener('click', () => vote(nowT, 1));
voteDn.addEventListener('click', () => vote(nowT, -1));

/* ═══════════════════════════════════════════════════════════════════
   Export: one file with every track and every visual, grouped
   up / down / unrated, for re-curation.
   ═══════════════════════════════════════════════════════════════════ */

function exportAll() {
  const T = { up: [], down: [], unrated: [] };
  for (const t of allTracks) {
    const v = voteOf(t);
    const e = { id: t.id, title: t.title || '', artist: t.artist || '', library: t.library || '',
                license: t.license || '', page: t.page || '', seconds: t.seconds ?? null };
    if (v) e.voted_at = votes[t.id].at;
    T[v > 0 ? 'up' : v < 0 ? 'down' : 'unrated'].push(e);
  }
  // votes for tracks that have since left the library
  for (const [id, x] of Object.entries(votes)) if (!byId.has(id))
    T[x.v > 0 ? 'up' : 'down'].push({ id, title: x.title, artist: x.artist, library: x.library, voted_at: x.at, in_library: false });

  const V = { up: [], down: [], unrated: [], too_bright: [...banned].sort() };
  for (const k of presetKeys) {
    const v = vVoteOf(k);
    if (v) V[v > 0 ? 'up' : 'down'].push({ preset: k, voted_at: vvotes[k].at });
    else V.unrated.push(k);
  }
  for (const [k, x] of Object.entries(vvotes)) if (!presets[k])
    V[x.v > 0 ? 'up' : 'down'].push({ preset: k, voted_at: x.at, in_pool: false });

  const P = { up: [], down: [], unrated: [] };
  for (const p of pics) {
    const v = pVoteOf(p);
    const e = { id: p.id, title: p.title, kind: p.kind === 'sun' ? 'sun print' : 'full colour', ink: p.ink || null,
                source: p.source || '', page: p.page || '' };
    if (v) e.voted_at = pvotes[p.id].at;
    P[v > 0 ? 'up' : v < 0 ? 'down' : 'unrated'].push(e);
  }
  for (const [id, x] of Object.entries(pvotes)) if (!picById.has(id))
    P[x.v > 0 ? 'up' : 'down'].push({ id, title: x.title, voted_at: x.at, in_set: false });

  const name = c => c === 'none' ? 'unrated' : c;
  const exported_at = new Date().toISOString();
  const data = {
    app: 'nightdeck', kind: 'curation', version: 2, exported_at,
    tracks: { counts: { total: allTracks.length, up: T.up.length, down: T.down.length, unrated: T.unrated.length }, ...T },
    visuals: { counts: { total: presetKeys.length, up: V.up.length, down: V.down.length, unrated: V.unrated.length, too_bright: V.too_bright.length }, ...V },
    pictures: { counts: { total: pics.length, up: P.up.length, down: P.down.length, unrated: P.unrated.length }, ...P },
    settings: {
      play_filter: CATS.filter(c => tfilter[c]).map(name),
      visual_filter: CATS.filter(c => vfilter[c]).map(name),
      visual_kinds: Object.keys(vtype).filter(k => vtype[k]),
      picture_filter: CATS.filter(c => pfilter[c]).map(name),
      picture_kinds: Object.keys(ptype).filter(k => ptype[k]).map(k => PTYPE[k].toLowerCase()),
      picture_auto_change: picAuto,
      shuffle: shuffleOn, auto_cycle: autoCycle
    }
  };
  download(`nightdeck-curation-${exported_at.slice(0, 10)}.json`, data);
  toast(`Exported ${plural(allTracks.length, 'track')} · ${plural(presetKeys.length, 'visual')} · ${plural(pics.length, 'picture')}`);
}

/* ═══════════════════════════════════════════════════════════════════
   Menu panes: Tracks and Visuals
   ═══════════════════════════════════════════════════════════════════ */

const paneT = $('pane-tracks');
const paneV = $('pane-visuals');

function countBy(keys, voteFn) {
  const c = { all: keys.length, up: 0, none: 0, down: 0 };
  for (const k of keys) c[catOf(voteFn(k))]++;
  return c;
}
const chips = (keys, attr, isOn, c) => keys.map(k =>
  `<button class="chip" ${attr}="${k}" aria-pressed="${isOn(k)}">${LABEL[k]}<span class="n">${c[k] ?? ''}</span></button>`).join('');

// Re-render a pane without losing your place in it.
function keepScroll(pane, fn) {
  const y = pane.scrollTop;
  const focused = document.activeElement?.matches?.('[data-search]') && pane.contains(document.activeElement);
  fn();
  pane.scrollTop = y;
  if (focused) { const s = pane.querySelector('[data-search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ─── Tracks ─────────────────────────────────────────────────────── */
let tView = store.get('nd.tview', 'all'), tQuery = '';

function renderTracks() {
  if (!ready) {
    paneT.innerHTML = `<p class="nd-msg">${esc(trackEl.textContent === 'Nothing playing' ? 'Loading the library…' : trackEl.textContent)}</p>`;
    return;
  }
  const c = countBy(allTracks, voteOf);
  const playing = allTracks.filter(tAllowed).length;
  const listName = tView === 'all' ? 'everything' : LABEL[tView].toLowerCase();
  paneT.innerHTML = `<div class="lb">
    <div class="lb-sec">
      <span class="lb-label">Play from</span>
      <div class="lb-row">${chips(CATS, 'data-tf', k => tfilter[k], c)}</div>
      <p class="lb-help">The station plays ${plural(playing, 'track')} from the groups you turn on. Tap any track below to play it anyway.</p>
    </div>
    <div class="lb-sec">
      <span class="lb-label">Browse</span>
      <div class="lb-row">${chips(['all', ...CATS], 'data-tv', k => tView === k, c)}</div>
      <input class="lb-search" type="search" placeholder="Search title or artist" value="${esc(tQuery)}" data-search>
      <div class="lb-row" style="margin-top:.6rem">
        <button class="lb-btn" data-tplay ${c[tView] ? '' : 'disabled'}>Play ${tView === 'all' ? 'everything' : listName + ' only'}</button>
      </div>
      <ol class="lb-list" data-list></ol>
    </div>
    <div class="lb-foot">
      <span class="lb-label">Export</span>
      <p class="lb-help">One JSON file with every track and every visual, grouped liked / disliked / unrated. Upload it to Claude to re-curate the library.</p>
      <div class="lb-row" style="margin-top:.75rem">
        <button class="lb-btn lb-btn--hi" data-export>Export JSON</button>
        ${Object.keys(votes).length ? '<button class="lb-btn" data-clear>Clear track votes</button>' : ''}
      </div>
    </div>
  </div>`;
  fillTracks();
  armed(paneT.querySelector('[data-clear]'), 'Clear track votes', () => {
    for (const k of Object.keys(votes)) delete votes[k];
    store.set('nd.votes', votes); paintVotes(); toast('Track votes cleared'); refreshTracks();
  });
}

function fillTracks() {
  const ol = paneT.querySelector('[data-list]');
  if (!ol) return;
  const q = tQuery.trim().toLowerCase();
  const list = allTracks
    .filter(t => (tView === 'all' || catOf(voteOf(t)) === tView) &&
                 (!q || `${t.title} ${t.artist}`.toLowerCase().includes(q)))
    .sort(byName);
  ol.innerHTML = list.length ? list.map(t => `
    <li class="lb-item${t === nowT ? ' is-now' : ''}" data-id="${esc(t.id)}">
      <button class="lb-play" data-play>
        <span class="lb-dot" aria-hidden="true"></span>
        <span class="lb-txt"><span class="lb-t">${esc(t.title || 'Untitled')}</span>
          <span class="lb-a">${esc(t.artist || '')}<span class="lb-tag">${esc(t.library || '')}</span></span></span>
        <span class="lb-dur">${t.seconds ? clock(t.seconds) : ''}</span>
      </button>
      ${voteButtons(voteOf(t), 'data-tvote', t.title)}
    </li>`).join('')
    : `<li class="lb-empty">${q ? 'No matches.' : `No ${LABEL[tView].toLowerCase()} tracks yet.`}</li>`;
}

const refreshTracks = () => keepScroll(paneT, renderTracks);
function markNowTrack() {
  paneT.querySelectorAll('.lb-item.is-now').forEach(li => li.classList.remove('is-now'));
  if (nowT) paneT.querySelector(`.lb-item[data-id="${CSS.escape(nowT.id)}"]`)?.classList.add('is-now');
}

paneT.addEventListener('click', e => {
  const tf = e.target.closest('[data-tf]');
  if (tf) {
    const k = tf.dataset.tf;
    if (tfilter[k] && CATS.filter(c => tfilter[c]).length === 1) { toast('Keep at least one group on'); return; }
    tfilter[k] = !tfilter[k];
    store.set('nd.filter', tfilter);
    rebuildQueue(nowT);
    refreshTracks();
    return;
  }
  const tv = e.target.closest('[data-tv]');
  if (tv) { tView = tv.dataset.tv; store.set('nd.tview', tView); refreshTracks(); return; }
  if (e.target.closest('[data-tplay]')) {
    for (const c of CATS) tfilter[c] = tView === 'all' || c === tView;
    store.set('nd.filter', tfilter);
    rebuildQueue();
    if (!queue.length) return;
    qi = 0; cueTrack(queue[0]); playNow();
    refreshTracks();
    toast(tView === 'all' ? 'Playing everything' : `Playing ${LABEL[tView].toLowerCase()} only`);
    return;
  }
  if (e.target.closest('[data-export]')) { exportAll(); return; }
  const li = e.target.closest('.lb-item');
  if (!li) return;
  const t = byId.get(li.dataset.id);
  const vb = e.target.closest('[data-tvote]');
  if (vb) { vote(t, Number(vb.dataset.tvote)); return; }
  if (e.target.closest('[data-play]')) playTrack(t);
});
paneT.addEventListener('input', e => {
  if (e.target.matches('[data-search]')) { tQuery = e.target.value; fillTracks(); }
});

/* ─── Visuals tab: two lists, Visuals and Pictures ───────────────── */
let vSub = store.get('nd.vsub', 'visuals');
let vView = store.get('nd.vview', 'all'), vQuery = '';
let pView = store.get('nd.pview', 'all'), pQuery = '';

function renderVisuals() {
  if (!canViz || !presetKeys.length) {
    paneV.innerHTML = `<p class="nd-msg">${!presetKeys.length ? "The visuals didn't load." :
      reduce ? 'Visuals are off because this device asks for reduced motion.' :
               "This browser can't run the visualizer (it needs WebGL 2)."}</p>`;
    return;
  }
  const sub = `<div class="lb-sec"><div class="lb-row">
      <button class="chip" data-vsub="visuals" aria-pressed="${vSub === 'visuals'}">Visuals<span class="n">${presetKeys.length}</span></button>
      <button class="chip" data-vsub="pictures" aria-pressed="${vSub === 'pictures'}" ${pics.length ? '' : 'disabled'}>Pictures<span class="n">${pics.length}</span></button>
    </div></div>`;
  const foot = (clearAttr, clearLabel, extra = '') => `
    <div class="lb-foot">
      <span class="lb-label">Export</span>
      <p class="lb-help">One file for everything: tracks, visuals and pictures, each grouped liked / disliked / unrated.</p>
      <div class="lb-row" style="margin-top:.75rem">
        <button class="lb-btn lb-btn--hi" data-export>Export JSON</button>
        ${clearAttr ? `<button class="lb-btn" ${clearAttr}>${clearLabel}</button>` : ''}${extra}
      </div>
    </div>`;

  if (vSub === 'pictures' && pics.length) {
    const c = countBy(pics, pVoteOf);
    const tc = { color: pics.filter(p => p.kind === 'color').length, sun: pics.filter(p => p.kind === 'sun').length };
    const showing = pics.filter(pAllowed).length;
    paneV.innerHTML = `<div class="lb">${sub}
      <div class="lb-sec">
        <span class="lb-label">Show from</span>
        <div class="lb-row">${chips(CATS, 'data-pf', k => pfilter[k], c)}</div>
        <div class="lb-row" style="margin-top:.4rem">
          ${['color', 'sun'].map(k => `<button class="chip" data-pt="${k}" aria-pressed="${ptype[k]}">${PTYPE[k]}<span class="n">${tc[k]}</span></button>`).join('')}
          <button class="chip" data-pauto aria-pressed="${picAuto}">Auto-change</button>
        </div>
        <p class="lb-help">The Floral visuals melt these papers into the music. ${plural(showing, 'picture')} in rotation${picAuto ? `, a new one every ${Math.round(CFG.picHold / 1000)}s` : '; auto-change is off, so the current one stays'}. Tap one to see it now.</p>
      </div>
      <div class="lb-sec">
        <span class="lb-label">Browse</span>
        <div class="lb-row">${chips(['all', ...CATS], 'data-pv', k => pView === k, c)}</div>
        <input class="lb-search" type="search" placeholder="Search pictures" value="${esc(pQuery)}" data-search>
        <ol class="lb-list" data-list></ol>
      </div>
      ${foot(Object.keys(pvotes).length ? 'data-pclear' : '', 'Clear picture votes')}
    </div>`;
    fillPictures();
    armed(paneV.querySelector('[data-pclear]'), 'Clear picture votes', () => {
      for (const k of Object.keys(pvotes)) delete pvotes[k];
      store.set('nd.picvotes', pvotes); paintPicBar(); toast('Picture votes cleared'); refreshVisuals();
    });
    return;
  }

  const c = countBy(presetKeys, vVoteOf);
  c.bright = banned.size;
  const tc = Object.fromEntries(VKINDS.map(t => [t, presetKeys.filter(k => typeOf(k) === t).length]));
  const showing = presetKeys.filter(vAllowed).length;
  paneV.innerHTML = `<div class="lb">${sub}
    <div class="lb-sec">
      <span class="lb-label">Show from</span>
      <div class="lb-row">${chips(CATS, 'data-vf', k => vfilter[k], c)}</div>
      <div class="lb-row" style="margin-top:.4rem">
        ${VKINDS.map(t => `<button class="chip" data-vt="${t}" aria-pressed="${vtype[t]}">${VKIND_LABEL[t]}<span class="n">${tc[t]}</span></button>`).join('')}
        <button class="chip" data-cycle aria-pressed="${autoCycle}">Auto-change</button>
      </div>
      <p class="lb-help">Rotating through ${plural(showing, 'visual')}${autoCycle ? `, a new one every ${Math.round(CFG.presetHold / 1000)}s` : '; auto-change is off, so the current one stays'}${VKINDS.filter(t => vtype[t]).length > 1 ? '; each kind you have on gets an equal share' : ''}. Tap the visualizer for its rating bar; double-tap for the next one; press and hold for thumbs down.</p>
    </div>
    <div class="lb-sec">
      <span class="lb-label">Browse</span>
      <div class="lb-row">${chips(['all', ...CATS, ...(banned.size ? ['bright'] : [])], 'data-vv', k => vView === k, c)}</div>
      <input class="lb-search" type="search" placeholder="Search visuals" value="${esc(vQuery)}" data-search>
      <ol class="lb-list" data-list></ol>
    </div>
    ${foot(Object.keys(vvotes).length ? 'data-clear' : '', 'Clear visual votes',
      banned.size ? `<button class="lb-btn" data-unban>Restore ${plural(banned.size, 'too-bright visual')}</button>` : '')}
  </div>`;
  fillVisuals();
  armed(paneV.querySelector('[data-clear]'), 'Clear visual votes', () => {
    for (const k of Object.keys(vvotes)) delete vvotes[k];
    store.set('nd.vizvotes', vvotes); paintVizBar(); toast('Visual votes cleared'); refreshVisuals();
  });
}

function fillVisuals() {
  const ol = paneV.querySelector('[data-list]');
  if (!ol) return;
  const q = vQuery.trim().toLowerCase();
  const list = presetKeys.filter(k =>
    (vView === 'all' || (vView === 'bright' ? banned.has(k) : catOf(vVoteOf(k)) === vView)) &&
    (!q || k.toLowerCase().includes(q)));
  ol.innerHTML = list.length ? list.map(k => `
    <li class="lb-item${k === current ? ' is-now' : ''}" data-key="${esc(k)}">
      <button class="lb-play" data-show>
        <span class="lb-dot" aria-hidden="true"></span>
        <span class="lb-txt"><span class="lb-t">${esc(k)}</span>
          ${banned.has(k) ? '<span class="lb-a">dropped · too bright</span>' : isFloral(k) ? '<span class="lb-a"><span class="lb-tag" style="margin:0">floral · melts the pictures</span></span>'
          : isKaleido(k) ? '<span class="lb-a"><span class="lb-tag" style="margin:0">kaleido · dichroic glass</span></span>'
          : isCosmos(k) ? '<span class="lb-a"><span class="lb-tag" style="margin:0">cosmos · flight through iridescent clouds</span></span>' : ''}</span>
      </button>
      ${voteButtons(vVoteOf(k), 'data-vvote', k)}
    </li>`).join('')
    : `<li class="lb-empty">${q ? 'No matches.' : `No ${LABEL[vView].toLowerCase()} visuals yet.`}</li>`;
}

function fillPictures() {
  const ol = paneV.querySelector('[data-list]');
  if (!ol) return;
  const q = pQuery.trim().toLowerCase();
  const list = pics.filter(p => (pView === 'all' || catOf(pVoteOf(p)) === pView) &&
    (!q || `${p.title} ${p.source} ${picLabel(p)}`.toLowerCase().includes(q)));
  ol.innerHTML = list.length ? list.map(p => `
    <li class="lb-item${p === curPic ? ' is-now' : ''}" data-pid="${esc(p.id)}">
      <button class="lb-play" data-pshow>
        <span class="lb-dot" aria-hidden="true"></span>
        <img class="lb-thumb" src="${esc(p.thumbUrl)}" alt="" loading="lazy" decoding="async">
        <span class="lb-txt"><span class="lb-t">${esc(p.title)}</span>
          <span class="lb-a">${esc(p.source || '')}<span class="lb-tag">${esc(picLabel(p))}</span></span></span>
      </button>
      ${voteButtons(pVoteOf(p), 'data-pvote', p.title)}
    </li>`).join('')
    : `<li class="lb-empty">${q ? 'No matches.' : `No ${LABEL[pView].toLowerCase()} pictures yet.`}</li>`;
}

const refreshVisuals = () => keepScroll(paneV, renderVisuals);
function markNowVisual() {
  if (vSub !== 'visuals') return;
  paneV.querySelectorAll('.lb-item.is-now').forEach(li => li.classList.remove('is-now'));
  if (current) paneV.querySelector(`.lb-item[data-key="${CSS.escape(current)}"]`)?.classList.add('is-now');
}
function markNowPic() {
  if (vSub !== 'pictures') return;
  paneV.querySelectorAll('.lb-item.is-now').forEach(li => li.classList.remove('is-now'));
  if (curPic) paneV.querySelector(`.lb-item[data-pid="${CSS.escape(curPic.id)}"]`)?.classList.add('is-now');
}

// Turn one of a group of switches on/off, never all of them off.
function flip(obj, k, keys, key) {
  if (obj[k] && keys.filter(c => obj[c]).length === 1) { toast('Keep at least one on'); return false; }
  obj[k] = !obj[k]; store.set(key, obj); return true;
}

paneV.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.vsub) { vSub = d.vsub; store.set('nd.vsub', vSub); paneV.scrollTop = 0; renderVisuals(); return; }
  if ('export' in d) { exportAll(); return; }

  // visuals
  if (d.vf) { if (flip(vfilter, d.vf, CATS, 'nd.vfilter')) { if (viz && current && !vAllowed(current)) roll(2.5); refreshVisuals(); } return; }
  if (d.vt) { if (flip(vtype, d.vt, VKINDS, 'nd.vtype')) { if (viz && current && !vAllowed(current)) roll(2.5); refreshVisuals(); } return; }
  if ('cycle' in d) {
    autoCycle = !autoCycle; store.set('nd.vcycle', autoCycle);
    restartCycle(); refreshVisuals();
    toast(autoCycle ? 'Auto-change on' : 'Auto-change off · holding this visual');
    return;
  }
  if (d.vv) { vView = d.vv; store.set('nd.vview', vView); refreshVisuals(); return; }
  if ('unban' in d) {
    const n = banned.size; banned.clear(); saveBans();
    toast(`Restored ${plural(n, 'visual')}`); if (vView === 'bright') vView = 'all';
    refreshVisuals(); return;
  }

  // pictures
  if (d.pf) { if (flip(pfilter, d.pf, CATS, 'nd.pfilter')) { if (curPic && !pAllowed(curPic)) showPicture(pickPic()); refreshVisuals(); } return; }
  if (d.pt) { if (flip(ptype, d.pt, ['color', 'sun'], 'nd.ptype')) { if (curPic && !pAllowed(curPic)) showPicture(pickPic()); refreshVisuals(); } return; }
  if ('pauto' in d) {
    picAuto = !picAuto; store.set('nd.pauto', picAuto);
    restartPicCycle(); refreshVisuals();
    toast(picAuto ? 'Pictures change on their own' : 'Holding this picture');
    return;
  }
  if (d.pv) { pView = d.pv; store.set('nd.pview', pView); refreshVisuals(); return; }

  const li = t.closest('.lb-item');
  if (!li) return;
  if (li.dataset.pid) {
    const p = picById.get(li.dataset.pid);
    if (d.pvote) { picVote(p, Number(d.pvote)); return; }
    if ('pshow' in d) { showPictureNow(p); markNowPic(); }
    return;
  }
  const k = li.dataset.key;
  if (d.vvote) { vizVote(k, Number(d.vvote)); return; }
  if ('show' in d) {
    if (banned.has(k)) { banned.delete(k); saveBans(); }
    showPreset(k, 2.5);
    toast(viz ? 'Showing it now' : 'Picked · shows when you press play');
    refreshVisuals();
  }
});
paneV.addEventListener('input', e => {
  if (!e.target.matches('[data-search]')) return;
  if (vSub === 'pictures') { pQuery = e.target.value; fillPictures(); }
  else { vQuery = e.target.value; fillVisuals(); }
});

// For fixing things from the console later.
window.NIGHTDECK = {
  get preset() { return current; },
  get tooBright() { return [...banned]; },
  get queue() { return queue.map(t => t.title); },
  get picture() { return curPic?.id; },
  show: showPreset, next: () => roll(2.5), export: exportAll, showPicture: id => showPicture(picById.get(id)),
  unbanAll() { banned.clear(); saveBans(); refreshVisuals(); toast('Too-bright list cleared'); }
};

/* ═══════════════════════════════════════════════════════════════════
   Notes
   ═══════════════════════════════════════════════════════════════════ */

const drawer  = document.getElementById('drawer');
const toggle  = document.getElementById('posts-toggle');
const host    = document.getElementById('drawer-content');
const closeBt = document.getElementById('drawer-close');

/* --- source ------------------------------------------------------
   Buildless: ask GitHub what's in the posts folder. Filenames carry
   the date and the slug, so one call renders the whole timeline.

   Jekyll instead? Replace listNotes with:
     const r = await fetch('/notes.json');
     return (await r.json()).notes;
   and drop the front-matter parsing below — Jekyll already did it.
------------------------------------------------------------------ */

const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.dir}?ref=${CFG.branch}`;
const RAW = n => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dir}/${n}`;

let index = null;
const bodies = new Map();

async function listNotes() {
  if (index) return index;

  // Cache for an hour. Unauthenticated GitHub API is 60 requests/hour
  // per IP, and a returning listener shouldn't spend one.
  try {
    const hit = JSON.parse(localStorage.getItem('nd.index') || 'null');
    if (hit && Date.now() - hit.at < 3600e3) return (index = hit.notes);
  } catch {}

  const res = await fetch(API, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);

  index = (await res.json())
    .filter(f => f.type === 'file' && f.name.endsWith('.md') && !f.name.startsWith('_'))
    .map(f => {
      const m = f.name.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
      return {
        file: f.name,
        date: m ? m[1] : '1970-01-01',
        slug: m ? m[2] : f.name.replace(/\.md$/, ''),
        title: (m ? m[2] : f.name).replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())
      };
    })
    .sort((a, b) => b.date.localeCompare(a.date));

  try { localStorage.setItem('nd.index', JSON.stringify({ at: Date.now(), notes: index })); } catch {}
  return index;
}

/* --- markdown ---------------------------------------------------- */

function splitFrontMatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  for (const line of m[1].split(/\r?\n/)) {
    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, '');
  }
  return { meta, body: md.slice(m[0].length) };
}

/* GitHub alert syntax doubles as our callouts:
     > [!NOTE]  → digest      > [!TIP]  → your commentary
   Written this way the raw .md renders properly on github.com too. */
function styleCallouts(root) {
  root.querySelectorAll('blockquote').forEach(bq => {
    const first = bq.querySelector('p');
    if (!first) return;
    const tag = first.textContent.match(/^\[!(NOTE|TIP)\]\s*/i);
    if (!tag) return;
    bq.classList.add(tag[1].toUpperCase() === 'NOTE' ? 'nd-digest' : 'nd-note');
    first.innerHTML = first.innerHTML.replace(/^\[!(NOTE|TIP)\]\s*(<br\s*\/?>)?/i, '');
    if (!first.textContent.trim() && !first.querySelector('img')) first.remove();
  });
}

const fmt = iso => new Date(iso + 'T00:00:00')
  .toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toLowerCase();

/* --- views -------------------------------------------------------- */

function message(html) { host.innerHTML = `<p class="nd-msg">${html}</p>`; }

async function showTimeline() {
  message('Reading the log…');
  try {
    const notes = await listNotes();

    let out = [];
    if (!notes.length) {
      out.push('<p class="nd-msg">Nothing posted yet. The first note lands here.</p>');
    } else {
      let year = null;
      out.push('<ol class="nd-timeline">');
      for (const n of notes) {
        const y = n.date.slice(0, 4);
        if (y !== year) { year = y; out.push(`<li class="nd-timeline__year" aria-hidden="true">${y}</li>`); }
        out.push(`<li class="nd-timeline__item">
          <button class="nd-entry" data-file="${n.file}">
            <span class="nd-entry__rail" aria-hidden="true"></span>
            <span class="nd-entry__date">${fmt(n.date)}</span>
            <span class="nd-entry__title">${n.title}</span>
            <span class="nd-entry__blurb" data-blurb></span>
          </button></li>`);
      }
      out.push('</ol>');
    }

    host.innerHTML = out.join('');
    host.scrollTop = 0;
    location.hash = '';
  } catch (e) {
    console.error('timeline:', e);
    message("The log didn't load. <button data-retry>Try again</button>");
    host.querySelector('[data-retry]')?.addEventListener('click', () => {
      index = null; try { localStorage.removeItem('nd.index'); } catch {}; showTimeline();
    });
  }
}

async function openNote(file) {
  message('Loading…');
  try {
    let html = bodies.get(file);
    let meta = {};
    if (!html) {
      const res = await fetch(RAW(file), { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const parsed = splitFrontMatter(await res.text());
      meta = parsed.meta;
      html = marked.parse(parsed.body);
      bodies.set(file, html);
      bodies.set(file + ':meta', meta);
    } else {
      meta = bodies.get(file + ':meta') || {};
    }

    const entry = (index || []).find(n => n.file === file) || {};
    const slug  = meta.slug || entry.slug || file;

    host.innerHTML = `
      <button class="nd-back"><span aria-hidden="true">←</span> All posts</button>
      <article class="nd">
        <header class="nd-head">
          <h1 class="nd-head__title">${meta.title || entry.title || 'Untitled'}</h1>
          <p class="nd-head__stamp">${fmt(meta.date || entry.date)}</p>
        </header>
        <div class="nd-body"></div>
        <a class="nd-discuss" target="_blank" rel="noopener"
           href="${CFG.discussions}?discussions_q=${encodeURIComponent(slug)}">
          Reply on GitHub
        </a>
      </article>`;

    const body = host.querySelector('.nd-body');
    body.innerHTML = html;
    styleCallouts(body);

    host.querySelector('.nd-back').addEventListener('click', showTimeline);
    host.scrollTop = 0;
    location.hash = slug;
  } catch (e) {
    console.error('note:', e);
    message("That note didn't load. <button data-back>Back to the log</button>");
    host.querySelector('[data-back]')?.addEventListener('click', showTimeline);
  }
}

host.addEventListener('click', e => {
  const btn = e.target.closest('[data-file]');
  if (btn) openNote(btn.dataset.file);
});

/* --- drawer ------------------------------------------------------- */

const tabs = [...document.querySelectorAll('.dw-tab')];
function setTab(name) {
  if (!tabs.some(b => b.dataset.tab === name)) name = 'tracks';
  store.set('nd.tab', name);
  for (const b of tabs) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  for (const p of drawer.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== name;
}
tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
setTab(store.get('nd.tab', 'tracks'));

function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  open ? drawer.removeAttribute('inert') : drawer.setAttribute('inert','');
  if (open) { markNowTrack(); markNowVisual(); drawer.querySelector('.dw-tab[aria-selected="true"]')?.focus({ preventScroll:true }); }
  else toggle.focus({ preventScroll:true });
}

toggle.addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer-open')));
closeBt.addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) setDrawer(false);
});

/* --- boot --------------------------------------------------------- */

(async function boot() {
  // Escape hatch: szk5334.github.io/lofi-player/?unban
  if (/[?&]unban\b/.test(location.search)) {
    const n = banned.size;
    banned.clear(); saveBans();
    history.replaceState(null, '', location.pathname);
    setTimeout(() => toast(`Restored ${plural(n, 'visual')}`), 400);
  }
  renderTracks();
  loadLibrary();
  await loadPictures();
  if (pics.length) showPicture(pickPic());
  if (!current && presetKeys.length) current = pickPreset();
  paintVizBar();
  renderVisuals();
  await showTimeline();
  const want = decodeURIComponent(location.hash.slice(1));
  if (want) {
    const n = (index || []).find(x => x.slug === want);
    if (n) { setTab('posts'); setDrawer(true); openNote(n.file); }
  }
})();
</script>
