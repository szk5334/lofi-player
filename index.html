<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>NIGHTDECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════
   NIGHTDECK

     0   #viz        Butterchurn, full bleed
     20  #drawer     slides up from under the transport
     30  #transport  always on top
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --ink:#14161c; --panel:#1b1e26; --line:#2a2e39;
  --paper:#e6e3dc; --muted:#8a8f9c; --amber:#e8a33d; --glass:#6fb3b8;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --bar:3.5rem;
  --top:calc(var(--bar) + env(safe-area-inset-top, 0px));
  --drawer-veil:0.93;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ─── visualizer ─────────────────────────────────────────────────── */
/* The CSS filter is the hard ceiling: no preset can blow past it,
   because it's applied at composite time, after Butterchurn draws. */
#viz,#viz-fallback{position:fixed;inset:0;width:100%;height:100dvh;z-index:0;display:block;
  filter:brightness(.72) saturate(.82) contrast(1.06)}
#viz[hidden],#viz-fallback[hidden]{display:none}
.nd-viz-footer{max-width:34rem;margin:0 auto;padding:1.5rem 1.5rem 3rem;
  border-top:1px solid var(--line)}
.nd-viz-footer__label{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.nd-viz-footer__count{margin:.75rem 0 .35rem;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 78%,transparent)}
.nd-viz-footer__help{margin:0;font-family:var(--mono);font-size:.6875rem;line-height:1.6;
  color:var(--muted)}
.nd-viz-footer__clear{margin-top:1rem;padding:.6rem 1rem;background:none;
  border:1px solid var(--line);border-radius:2px;color:var(--muted);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:border-color 140ms,color 140ms}
.nd-viz-footer__clear:hover{border-color:var(--amber);color:var(--amber)}
.nd-viz-footer__clear:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:30rem){.nd-viz-footer{padding:1.5rem 1.125rem 2.5rem}}

#nd-toast{position:fixed;left:50%;bottom:calc(2rem + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,.5rem);z-index:40;padding:.6rem 1rem;
  background:rgba(20,22,28,.9);border:1px solid #2a2e39;border-radius:2px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);pointer-events:none;opacity:0;
  transition:opacity 200ms ease,transform 200ms ease}
#nd-toast.show{opacity:1;transform:translate(-50%,0)}

#viz-tone{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:rgba(20,22,28,.26)}
#viz-shade{position:fixed;inset:0 0 auto 0;height:calc(var(--top)*2.2);z-index:1;
  pointer-events:none;background:linear-gradient(to bottom,
    rgba(20,22,28,.88) 0%,rgba(20,22,28,.55) 45%,rgba(20,22,28,0) 100%)}

/* ─── transport ──────────────────────────────────────────────────── */
#transport{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--top);
  padding:0 .875rem;padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;gap:.875rem;
  border-bottom:1px solid rgba(230,227,220,.09);background:rgba(20,22,28,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}

.tp-btn{flex:0 0 auto;width:2.25rem;height:2.25rem;display:grid;place-items:center;
  background:none;border:1px solid var(--line);border-radius:50%;color:var(--paper);
  cursor:pointer;transition:border-color 140ms ease,color 140ms ease}
.tp-btn:hover{border-color:var(--amber);color:var(--amber)}
.tp-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tp-btn:disabled{opacity:.4;cursor:default}
.tp-btn svg{width:14px;height:14px;fill:currentColor}
.tp-btn .icon-pause{display:none}
.tp-btn[aria-pressed="true"] .icon-play{display:none}
.tp-btn[aria-pressed="true"] .icon-pause{display:block}

.tp-now{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.5rem}
.tp-lamp{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--line);
  align-self:center;transition:background-color 300ms ease,box-shadow 300ms ease}
body.is-playing .tp-lamp{background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.18);
  animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,163,61,.06)}}

.tp-track{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 550;
  font-size:.875rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-artist{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
@media (max-width:26rem){.tp-artist{display:none}}

.tp-posts{flex:0 0 auto;background:none;border:0;border-left:1px solid var(--line);
  padding:.5rem 0 .5rem .875rem;color:var(--muted);font-family:var(--mono);font-size:.625rem;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color 140ms ease}
.tp-posts:hover,body.drawer-open .tp-posts{color:var(--amber)}
.tp-posts:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ─── drawer ─────────────────────────────────────────────────────── */
#drawer{position:fixed;top:var(--top);left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;background:rgba(20,22,28,var(--drawer-veil));
  -webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15);
  border-top:1px solid rgba(230,227,220,.06);transform:translateY(100%);
  transition:transform 420ms cubic-bezier(.16,1,.3,1);will-change:transform}
body.drawer-open #drawer{transform:translateY(0)}
#drawer[inert]{pointer-events:none}
.dw-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-close{position:absolute;top:.5rem;right:.75rem;z-index:2;width:2rem;height:2rem;
  display:grid;place-items:center;background:rgba(20,22,28,.6);border:0;border-radius:50%;
  color:var(--muted);font-size:1rem;line-height:1;cursor:pointer}
.dw-close:hover{color:var(--amber)}
.dw-close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  #drawer{transition-duration:.01ms}
  body.is-playing .tp-lamp{animation:none}
}

/* ─── timeline ───────────────────────────────────────────────────── */
.nd-timeline{list-style:none;max-width:34rem;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nd-timeline__year{font-family:var(--mono);font-size:.625rem;letter-spacing:.22em;
  color:var(--muted);padding:2.25rem 0 .75rem 2.75rem}
.nd-timeline__year:first-child{padding-top:0}
.nd-entry{position:relative;display:grid;grid-template-columns:2.75rem 1fr;
  grid-template-areas:"rail date" "rail title" "rail blurb";gap:.2rem 0;
  padding:1rem 0 1.5rem;text-decoration:none;color:inherit;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;font:inherit}
.nd-entry:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.nd-entry__rail{grid-area:rail;position:relative}
.nd-entry__rail::before{content:"";position:absolute;left:3px;top:0;bottom:-1.5rem;
  width:1px;background:var(--line)}
.nd-entry__rail::after{content:"";position:absolute;left:0;top:.45rem;width:7px;height:7px;
  border:1.5px solid var(--muted);border-radius:50%;background:var(--ink);
  transition:background-color 140ms ease,border-color 140ms ease}
.nd-timeline__item:last-child .nd-entry__rail::before{bottom:auto;height:1.4rem}
.nd-entry:hover .nd-entry__rail::after{background:var(--amber);border-color:var(--amber)}
.nd-entry__date{grid-area:date;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nd-entry__title{grid-area:title;font-family:var(--display);
  font-variation-settings:"wdth" 108,"wght" 600;font-size:1.3125rem;line-height:1.15;
  letter-spacing:-.01em;margin-top:.15rem;transition:color 140ms ease}
.nd-entry:hover .nd-entry__title{color:var(--amber)}
.nd-entry__blurb{grid-area:blurb;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 72%,transparent);margin-top:.35rem;text-wrap:pretty}

/* ─── note view ──────────────────────────────────────────────────── */
.nd{max-width:34rem;margin:0 auto;padding:1rem 1.5rem 5rem;font-size:1.0625rem;line-height:1.65}
.nd-head{margin-bottom:2.5rem}
.nd-head__title{font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 620;
  font-size:clamp(1.875rem,7vw,2.75rem);line-height:1.03;letter-spacing:-.015em;
  margin:0 0 .75rem;text-wrap:balance}
.nd-head__stamp{font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;
  color:var(--muted);margin:0;padding-top:1rem;border-top:1px solid var(--line)}
.nd-body>*{margin-block:0 1.25rem}
.nd-body h2{font-family:var(--mono);font-size:.6875rem;font-weight:500;text-transform:uppercase;
  letter-spacing:.18em;color:var(--muted);margin-block:2.5rem 1rem}
.nd-body h3{font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 600;
  font-size:1.1875rem;margin-block:1.75rem .5rem}
.nd-body a{color:var(--paper);text-decoration-color:var(--amber);text-underline-offset:.2em}
.nd-body a:hover{color:var(--amber)}
.nd-body code{font-family:var(--mono);font-size:.8125em;background:var(--panel);
  padding:.1em .35em;border-radius:2px}
.nd-body pre{font-family:var(--mono);font-size:.8125rem;line-height:1.6;background:var(--panel);
  border-left:2px solid var(--line);padding:1rem 1.125rem;overflow-x:auto}
.nd-body pre code{background:none;padding:0}
.nd-body ul,.nd-body ol{padding-left:1.25rem}
.nd-body li{margin-bottom:.375rem}
.nd-body li::marker{color:var(--muted)}
.nd-body img{max-width:100%;height:auto;border-radius:2px}

/* callouts — written as > [!NOTE] / > [!TIP] so GitHub renders them too */
.nd-body blockquote.nd-note,.nd-body blockquote.nd-digest{
  position:relative;margin:2rem 0;padding:0 0 0 1.25rem;border:0}
.nd-body blockquote.nd-note::before,.nd-body blockquote.nd-digest::before{
  content:"";position:absolute;left:0;top:.4em;bottom:.2em;width:2px;border-radius:1px}
.nd-body blockquote.nd-note::after,.nd-body blockquote.nd-digest::after{
  font-family:var(--mono);font-size:.5625rem;text-transform:uppercase;letter-spacing:.2em;
  position:absolute;left:1.25rem;top:-1.35em}
.nd-body blockquote.nd-note::before{background:var(--amber)}
.nd-body blockquote.nd-note::after{content:"notes";color:var(--amber)}
.nd-body blockquote.nd-digest::before{background:var(--glass)}
.nd-body blockquote.nd-digest::after{content:"digest";color:var(--glass)}
.nd-body blockquote.nd-digest{font-size:.9875rem;line-height:1.6;
  color:color-mix(in srgb,var(--paper) 88%,transparent)}
.nd-body blockquote>*:last-child{margin-bottom:0}

.nd-discuss{display:inline-flex;align-items:center;gap:.5rem;margin-top:2.5rem;
  padding:.7rem 1rem;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;
  text-transform:uppercase;text-decoration:none;transition:border-color 140ms,color 140ms}
.nd-discuss:hover{border-color:var(--amber);color:var(--amber)}

.nd-back{display:block;width:100%;max-width:34rem;margin:0 auto;padding:1.25rem 1.5rem 0;
  background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.14em;text-transform:uppercase;text-align:left;cursor:pointer}
.nd-back:hover{color:var(--amber)}
.nd-back:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.nd-msg{max-width:34rem;margin:0 auto;padding:3rem 1.5rem;font-family:var(--mono);
  font-size:.75rem;line-height:1.7;color:var(--muted)}
.nd-msg button{background:none;border:0;border-bottom:1px solid var(--amber);
  color:var(--amber);font:inherit;padding:0;cursor:pointer}

@media (max-width:30rem){
  .nd-timeline{padding:2rem 1.125rem 3rem}
  .nd{padding:1rem 1.125rem 4rem;font-size:1rem}
  .nd-entry{grid-template-columns:2.25rem 1fr}
  .nd-entry__title{font-size:1.1875rem}
}
</style>

<!-- Butterchurn preset packs. They attach to window.base / window.extra.
     Mirror these two files into the repo if you'd rather not depend on unpkg. -->
<script src="https://unpkg.com/butterchurn-presets@3.0.0-beta.4/dist/base.min.js"></script>
</head>

<body>

<canvas id="viz" aria-hidden="true"></canvas>
<canvas id="viz-fallback" aria-hidden="true"></canvas>
<div id="viz-tone" aria-hidden="true"></div>
<div id="viz-shade" aria-hidden="true"></div>
<audio id="au" crossorigin="anonymous" preload="none"></audio>

<header id="transport">
  <button class="tp-btn" id="play" aria-pressed="false" aria-label="Play">
    <svg class="icon-play" viewBox="0 0 12 14"><path d="M0 0l12 7-12 7z"/></svg>
    <svg class="icon-pause" viewBox="0 0 12 14"><path d="M0 0h4v14H0zM8 0h4v14H8z"/></svg>
  </button>
  <div class="tp-now">
    <span class="tp-lamp" aria-hidden="true"></span>
    <span class="tp-track" id="track">Nothing playing</span>
    <span class="tp-artist" id="artist">nightdeck</span>
  </div>
  <button class="tp-posts" id="posts-toggle" aria-expanded="false" aria-controls="drawer">Posts</button>
</header>

<section id="drawer" aria-label="Posts" inert>
  <button class="dw-close" id="drawer-close" aria-label="Close posts">✕</button>
  <div class="dw-scroll" id="drawer-content"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script type="module">
import butterchurn from 'https://unpkg.com/butterchurn@3.0.0-beta.5/dist/butterchurn.js';

/* ═══════════════════════════════════════════════════════════════════
   Config — the only block you should need to edit
   ═══════════════════════════════════════════════════════════════════ */

const CFG = {
  // audio: a JSON array of { url, title, artist } (or plain URL strings)
  manifest: 'https://szk5334.github.io/lofi-library/manifest.json',

  // notes: where the markdown lives
  owner: 'szk5334',
  repo:  'lofi-player',
  dir:   'posts',
  branch:'main',

  discussions: 'https://github.com/szk5334/lofi-player/discussions',

  presetHold: 22000,   // ms before drifting to the next preset
  blend: 5.5,          // seconds of crossfade between presets

  // How hard the audio drives the visuals. Milkdrop reactivity scales
  // with amplitude, and most white-outs are just too much signal.
  // 1 = raw. Lower is calmer. 0.3 suits lofi.
  drive: 0.3,

  // If a preset stays brighter than this, ban it for good.
  // 0 = black, 1 = white. Measured after the CSS filter is applied.
  maxBrightness: 0.55,
  settle: 1800,        // ms to ignore after a preset loads (the crossfade)
  checkEvery: 700      // ms between brightness samples
};

/* ═══════════════════════════════════════════════════════════════════
   Visualizer
   ═══════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('viz');
const fb     = document.getElementById('viz-fallback');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let audioCtx = null, viz = null, srcNode = null, tap = null, drive = null;
let rendering = false, cycle = null, fallbackRAF = null;
let current = '', hot = 0, rollRef = null, settled = 0;

function webgl2() {
  try { return !!document.createElement('canvas').getContext('webgl2'); }
  catch { return false; }
}

function sizeRenderer() {
  if (!viz) return;
  // Don't touch canvas.width/height here — writing them resets the WebGL
  // drawing buffer and desyncs Butterchurn's feedback framebuffers.
  // setRendererSize resizes both together.
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  viz.setRendererSize(
    Math.round(canvas.clientWidth * dpr),
    Math.round(canvas.clientHeight * dpr)
  );
}
addEventListener('resize', sizeRenderer);

function presetPool() {
  const all = {};
  if (window.base?.default) Object.assign(all, window.base.default);
  if (window.extra?.default) Object.assign(all, window.extra.default);
  return all;
}

function startVisualizer() {
  if (viz || !webgl2() || reduce) return false;

  const presets = presetPool();
  const keys = Object.keys(presets);
  if (!keys.length) return false;

  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  viz = butterchurn.createVisualizer(audioCtx, canvas, {
    width:  Math.round(canvas.clientWidth * dpr),
    height: Math.round(canvas.clientHeight * dpr),
    pixelRatio: 1,      // we've already baked dpr into width/height
    textureRatio: 1
  });

  // Butterchurn runs ~0.26s behind the audio it analyses, so the demo
  // delays the *audible* path to match. Without this the visuals lag
  // the music by a noticeable beat.
  tap = audioCtx.createDelay();
  tap.delayTime.value = 0.26;
  tap.connect(audioCtx.destination);

  // The visualizer gets a quieter copy. This is the real white-out fix:
  // Milkdrop drives brightness and displacement from amplitude, so
  // attenuating here calms the visuals without touching what you hear.
  drive = audioCtx.createGain();
  drive.gain.value = CFG.drive;
  tap.connect(drive);
  viz.connectAudio(drive);

  const roll = (blend) => {
    const live = keys.filter(k => !banned.has(k));
    // Everything banned? Start over rather than show nothing.
    if (!live.length) { banned.clear(); saveBans(); return roll(blend); }
    const k = live[Math.floor(Math.random() * live.length)];
    current = k;
    hot = 0;
    settled = performance.now() + CFG.settle;
    viz.loadPreset(presets[k], blend);
  };
  roll(0);
  rollRef = roll;
  cycle = setInterval(() => roll(CFG.blend), CFG.presetHold);

  cancelAnimationFrame(fallbackRAF);
  fb.hidden = true;
  rendering = true;
  runLoop(roll);

  return true;
}

/* ─── brightness governor ─────────────────────────────────────────
   Some presets bloom to white regardless of how little signal they get.
   Sample the canvas down to 8×8, read average luminance, and if a preset
   sits over the ceiling twice running, ban it — permanently, in
   localStorage, so it never comes back.

   The sample has to happen in the same frame as render(), before the
   WebGL buffer is cleared: Butterchurn doesn't set preserveDrawingBuffer,
   so a read at any other time comes back blank.
------------------------------------------------------------------ */

const BANS = 'nd.banned';
const banned = new Set((() => {
  try { return JSON.parse(localStorage.getItem(BANS) || '[]'); } catch { return []; }
})());
const saveBans = () => {
  try { localStorage.setItem(BANS, JSON.stringify([...banned])); } catch {}
};

const probe  = Object.assign(document.createElement('canvas'), { width: 8, height: 8 });
const pctx   = probe.getContext('2d', { willReadFrequently: true });

function brightness() {
  try {
    pctx.drawImage(canvas, 0, 0, 8, 8);
    const d = pctx.getImageData(0, 0, 8, 8).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4)
      sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    return sum / (d.length / 4) / 255;
  } catch { return 0; }
}

function ban(key, why) {
  if (!key || banned.has(key)) return;
  banned.add(key);
  saveBans();
  console.info(`nightdeck: banned (${why}) — ${key}`);
}

function runLoop(roll) {
  let last = 0, checked = 0;
  (function loop(now) {
    if (!rendering) return;
    requestAnimationFrame(loop);

    // half rate while the drawer covers it — saves battery, still alive underneath
    const gap = document.body.classList.contains('drawer-open') ? 42 : 0;
    if (now - last < gap) return;
    last = now;

    viz.render();

    // Ignore the crossfade — a blend between two presets reads bright
    // for a moment even when neither one is.
    if (now < settled || now - checked < CFG.checkEvery) return;
    checked = now;

    // brightness() reads the raw canvas, so scale by the CSS filter
    // sitting on top of it before comparing.
    if (brightness() * 0.72 > CFG.maxBrightness) {
      if (++hot >= 2) { ban(current, 'too bright'); toast('Preset dropped'); roll(2.5); }
    } else hot = 0;
  })(0);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { rendering = false; }
  else if (viz && !rendering) { rendering = true; runLoop(rollRef); }
});

/* ─── manual control ──────────────────────────────────────────────
   Double-tap the visualizer for the next preset.
   Press and hold to ban the current one for good.
   Keyboard: → next, X ban.
------------------------------------------------------------------ */

function toast(msg) {
  let el = document.getElementById('nd-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'nd-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function nextPreset() { if (rollRef) { rollRef(2.5); toast('Next preset'); } }
function banCurrent() {
  if (!rollRef || !current) return;
  ban(current, 'by hand');
  toast('Banned · ' + banned.size + ' total');
  rollRef(2.5);
}

// Only respond on the visualizer itself, never through the UI.
const onViz = e => !e.target.closest('#transport, #drawer');

let held = null;
document.addEventListener('pointerdown', e => {
  if (!viz || !onViz(e)) return;
  held = setTimeout(() => { held = null; banCurrent(); }, 650);
});
const release = () => { if (held) { clearTimeout(held); held = null; } };
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('pointermove', release);

document.addEventListener('dblclick', e => { if (viz && onViz(e)) nextPreset(); });

document.addEventListener('keydown', e => {
  if (!viz || e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') nextPreset();
  if (e.key === 'x' || e.key === 'X') banCurrent();
});

// For fixing things from the console later.
window.NIGHTDECK = {
  get preset() { return current; },
  get banned() { return [...banned]; },
  next: nextPreset,
  ban: banCurrent,
  unbanAll() { banned.clear(); saveBans(); toast('Ban list cleared'); }
};

/* Fallback: no WebGL2, or reduced motion. Soft drifting smoke.
   It gets its own canvas — a canvas is permanently bound to the first
   context type requested, so taking a 2D context on #viz would make
   getContext('webgl2') return null there forever. */
(function fallback() {
  if (viz) return;
  const ctx = fb.getContext('2d');
  if (!ctx) return;
  let W, H, dpr;
  const fit = () => { dpr = Math.min(devicePixelRatio||1,1.5);
    W = fb.clientWidth; H = fb.clientHeight;
    fb.width = W*dpr; fb.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  fit(); addEventListener('resize', fit);

  const TINTS = [[111,179,184],[232,163,61],[86,96,140],[198,120,150]];
  const puffs = Array.from({length:18},(_,i)=>({
    x:Math.random(), y:Math.random(), r:130+Math.random()*250,
    vx:(Math.random()-.5)*0.00016, vy:-0.00006-Math.random()*0.00012,
    t:TINTS[i%TINTS.length], a:.05+Math.random()*.07, ph:Math.random()*6.28 }));

  if (reduce) { ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H); return; }

  (function draw(now) {
    if (viz) return;                       // butterchurn took over
    fallbackRAF = requestAnimationFrame(draw);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of puffs) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -.3) { p.y = 1.3; p.x = Math.random(); }
      if (p.x < -.3) p.x = 1.3; if (p.x > 1.3) p.x = -.3;
      const r = p.r * (1 + Math.sin(now*0.00022 + p.ph)*0.14);
      const cx = p.x*W, cy = p.y*H;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      const [cr,cg,cb] = p.t;
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${p.a})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,6.284); ctx.fill();
    }
  })(0);
})();

/* ═══════════════════════════════════════════════════════════════════
   Audio
   ═══════════════════════════════════════════════════════════════════ */

const au      = document.getElementById('au');
const playBtn = document.getElementById('play');
const trackEl = document.getElementById('track');
const artistEl= document.getElementById('artist');

let queue = [], qi = 0, ready = false;

const shuffle = a => { for (let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// Track URLs in the manifest are relative to the manifest itself, so the
// library keeps working if it ever moves to another host.
const resolve = u => new URL(u, CFG.manifest).href;

async function loadLibrary() {
  try {
    const res = await fetch(CFG.manifest, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`manifest returned ${res.status}`);

    const raw = await res.json();
    const list = Array.isArray(raw) ? raw : (raw.tracks || []);
    if (!list.length) throw new Error('manifest has no tracks');

    queue = shuffle(list.map(t => {
      if (typeof t === 'string') {
        const name = decodeURIComponent(t.split('/').pop().replace(/\.\w+$/, ''));
        return { url: resolve(t), title: name, artist: '' };
      }
      return { ...t, url: resolve(t.url || t.src || t.file || t.path) };
    }));

    ready = true;
    trackEl.textContent = 'Ready';
    artistEl.textContent = `${queue.length} tracks`;
  } catch (e) {
    console.error('library:', e);
    // Say what actually broke — the console isn't reachable on a phone.
    trackEl.textContent = e.message;
    artistEl.textContent = 'library';
    playBtn.disabled = true;
  }
}
loadLibrary();

function show(t) {
  trackEl.textContent = t.title || 'Untitled';
  artistEl.textContent = t.artist || 'nightdeck';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || 'Untitled', artist: t.artist || 'NIGHTDECK', album: 'NIGHTDECK'
    });
  }
}

// A second, silent audio element warms the next track into the HTTP cache.
// (An Image() won't do this — the browser rejects the decode and gives up.)
const pre = new Audio();
pre.crossOrigin = 'anonymous';
pre.preload = 'auto';
pre.muted = true;

function cue(i) {
  const t = queue[i % queue.length];
  au.src = t.url;
  show(t);

  const next = queue[(i + 1) % queue.length];
  if (next && next.url !== t.url) { pre.src = next.url; pre.load(); }
}

async function start() {
  if (!audioCtx) {
    // Must be created inside the tap — mobile browsers refuse otherwise.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode = audioCtx.createMediaElementSource(au);
    if (!startVisualizer()) srcNode.connect(audioCtx.destination);
    else srcNode.connect(tap);   // tap already goes to destination
    cue(qi);
  }
  await audioCtx.resume();
  await au.play();
}

playBtn.addEventListener('click', async () => {
  if (!ready) return;
  try {
    if (au.paused) { await start(); }
    else { au.pause(); }
  } catch (e) {
    console.error('playback:', e);
    trackEl.textContent = "That track wouldn't play";
  }
});

au.addEventListener('play',  () => {
  playBtn.setAttribute('aria-pressed','true');
  playBtn.setAttribute('aria-label','Pause');
  document.body.classList.add('is-playing');
});
au.addEventListener('pause', () => {
  playBtn.setAttribute('aria-pressed','false');
  playBtn.setAttribute('aria-label','Play');
  document.body.classList.remove('is-playing');
});
au.addEventListener('ended', () => { qi++; cue(qi); au.play().catch(()=>{}); });
au.addEventListener('error', () => { qi++; cue(qi); au.play().catch(()=>{}); });

/* ═══════════════════════════════════════════════════════════════════
   Notes
   ═══════════════════════════════════════════════════════════════════ */

const drawer  = document.getElementById('drawer');
const toggle  = document.getElementById('posts-toggle');
const host    = document.getElementById('drawer-content');
const closeBt = document.getElementById('drawer-close');

/* --- source ------------------------------------------------------
   Buildless: ask GitHub what's in the posts folder. Filenames carry
   the date and the slug, so one call renders the whole timeline.

   Jekyll instead? Replace listNotes with:
     const r = await fetch('/notes.json');
     return (await r.json()).notes;
   and drop the front-matter parsing below — Jekyll already did it.
------------------------------------------------------------------ */

const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.dir}?ref=${CFG.branch}`;
const RAW = n => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dir}/${n}`;

let index = null;
const bodies = new Map();

async function listNotes() {
  if (index) return index;

  // Cache for an hour. Unauthenticated GitHub API is 60 requests/hour
  // per IP, and a returning listener shouldn't spend one.
  try {
    const hit = JSON.parse(localStorage.getItem('nd.index') || 'null');
    if (hit && Date.now() - hit.at < 3600e3) return (index = hit.notes);
  } catch {}

  const res = await fetch(API, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);

  index = (await res.json())
    .filter(f => f.type === 'file' && f.name.endsWith('.md') && !f.name.startsWith('_'))
    .map(f => {
      const m = f.name.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
      return {
        file: f.name,
        date: m ? m[1] : '1970-01-01',
        slug: m ? m[2] : f.name.replace(/\.md$/, ''),
        title: (m ? m[2] : f.name).replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())
      };
    })
    .sort((a, b) => b.date.localeCompare(a.date));

  try { localStorage.setItem('nd.index', JSON.stringify({ at: Date.now(), notes: index })); } catch {}
  return index;
}

/* --- markdown ---------------------------------------------------- */

function splitFrontMatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  for (const line of m[1].split(/\r?\n/)) {
    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, '');
  }
  return { meta, body: md.slice(m[0].length) };
}

/* GitHub alert syntax doubles as our callouts:
     > [!NOTE]  → digest      > [!TIP]  → your commentary
   Written this way the raw .md renders properly on github.com too. */
function styleCallouts(root) {
  root.querySelectorAll('blockquote').forEach(bq => {
    const first = bq.querySelector('p');
    if (!first) return;
    const tag = first.textContent.match(/^\[!(NOTE|TIP)\]\s*/i);
    if (!tag) return;
    bq.classList.add(tag[1].toUpperCase() === 'NOTE' ? 'nd-digest' : 'nd-note');
    first.innerHTML = first.innerHTML.replace(/^\[!(NOTE|TIP)\]\s*(<br\s*\/?>)?/i, '');
    if (!first.textContent.trim() && !first.querySelector('img')) first.remove();
  });
}

const fmt = iso => new Date(iso + 'T00:00:00')
  .toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toLowerCase();

/* --- views -------------------------------------------------------- */

function message(html) { host.innerHTML = `<p class="nd-msg">${html}</p>`; }

async function showTimeline() {
  message('Reading the log…');
  try {
    const notes = await listNotes();

    let out = [];
    if (!notes.length) {
      out.push('<p class="nd-msg">Nothing posted yet. The first note lands here.</p>');
    } else {
      let year = null;
      out.push('<ol class="nd-timeline">');
      for (const n of notes) {
        const y = n.date.slice(0, 4);
        if (y !== year) { year = y; out.push(`<li class="nd-timeline__year" aria-hidden="true">${y}</li>`); }
        out.push(`<li class="nd-timeline__item">
          <button class="nd-entry" data-file="${n.file}">
            <span class="nd-entry__rail" aria-hidden="true"></span>
            <span class="nd-entry__date">${fmt(n.date)}</span>
            <span class="nd-entry__title">${n.title}</span>
            <span class="nd-entry__blurb" data-blurb></span>
          </button></li>`);
      }
      out.push('</ol>');
    }
    out.push(vizFooter());

    host.innerHTML = out.join('');
    wireVizFooter();
    host.scrollTop = 0;
    location.hash = '';
  } catch (e) {
    console.error('timeline:', e);
    message("The log didn't load. <button data-retry>Try again</button>");
    host.querySelector('[data-retry]')?.addEventListener('click', () => {
      index = null; try { localStorage.removeItem('nd.index'); } catch {}; showTimeline();
    });
  }
}

/* Visualizer housekeeping, parked at the bottom of the log — the only
   place in the UI with room for it, and where you'll go looking. */
function vizFooter() {
  const n = banned.size;
  return `<div class="nd-viz-footer">
    <span class="nd-viz-footer__label">Visualizer</span>
    <p class="nd-viz-footer__count">${
      n === 0 ? 'No presets hidden.'
              : `${n} preset${n === 1 ? '' : 's'} hidden — too bright, or you banned ${n === 1 ? 'it' : 'them'}.`
    }</p>
    <p class="nd-viz-footer__help">Double-tap the visualizer to skip. Press and hold to hide one.</p>
    ${n ? '<button class="nd-viz-footer__clear" data-unban>Restore all presets</button>' : ''}
  </div>`;
}

function wireVizFooter() {
  host.querySelector('[data-unban]')?.addEventListener('click', () => {
    const n = banned.size;
    banned.clear();
    saveBans();
    toast(`Restored ${n} preset${n === 1 ? '' : 's'}`);
    const box = host.querySelector('.nd-viz-footer');
    if (box) { box.outerHTML = vizFooter(); wireVizFooter(); }
  });
}

async function openNote(file) {
  message('Loading…');
  try {
    let html = bodies.get(file);
    let meta = {};
    if (!html) {
      const res = await fetch(RAW(file), { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const parsed = splitFrontMatter(await res.text());
      meta = parsed.meta;
      html = marked.parse(parsed.body);
      bodies.set(file, html);
      bodies.set(file + ':meta', meta);
    } else {
      meta = bodies.get(file + ':meta') || {};
    }

    const entry = (index || []).find(n => n.file === file) || {};
    const slug  = meta.slug || entry.slug || file;

    host.innerHTML = `
      <button class="nd-back"><span aria-hidden="true">←</span> All posts</button>
      <article class="nd">
        <header class="nd-head">
          <h1 class="nd-head__title">${meta.title || entry.title || 'Untitled'}</h1>
          <p class="nd-head__stamp">${fmt(meta.date || entry.date)}</p>
        </header>
        <div class="nd-body"></div>
        <a class="nd-discuss" target="_blank" rel="noopener"
           href="${CFG.discussions}?discussions_q=${encodeURIComponent(slug)}">
          Reply on GitHub
        </a>
      </article>`;

    const body = host.querySelector('.nd-body');
    body.innerHTML = html;
    styleCallouts(body);

    host.querySelector('.nd-back').addEventListener('click', showTimeline);
    host.scrollTop = 0;
    location.hash = slug;
  } catch (e) {
    console.error('note:', e);
    message("That note didn't load. <button data-back>Back to the log</button>");
    host.querySelector('[data-back]')?.addEventListener('click', showTimeline);
  }
}

host.addEventListener('click', e => {
  const btn = e.target.closest('[data-file]');
  if (btn) openNote(btn.dataset.file);
});

/* --- drawer ------------------------------------------------------- */

function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  open ? drawer.removeAttribute('inert') : drawer.setAttribute('inert','');
  if (open) host.querySelector('button, a')?.focus({ preventScroll:true });
  else toggle.focus({ preventScroll:true });
}

toggle.addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer-open')));
closeBt.addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) setDrawer(false);
});

/* --- boot --------------------------------------------------------- */

(async function boot() {
  // Escape hatch: szk5334.github.io/lofi-player/?unban
  // Works even if the drawer is broken or you've banned every preset.
  if (/[?&]unban\b/.test(location.search)) {
    const n = banned.size;
    banned.clear(); saveBans();
    history.replaceState(null, '', location.pathname);
    setTimeout(() => toast(`Restored ${n} preset${n === 1 ? '' : 's'}`), 400);
  }
  await showTimeline();
  const want = decodeURIComponent(location.hash.slice(1));
  if (want) {
    const n = (index || []).find(x => x.slug === want);
    if (n) { setDrawer(true); openNote(n.file); }
  }
})();
</script>
