<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>NIGHTDECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════
   NIGHTDECK

     0   #viz        Butterchurn, full bleed
     20  #drawer     slides up from under the transport
     30  #transport  always on top
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --ink:#14161c; --panel:#1b1e26; --line:#2a2e39;
  --paper:#e6e3dc; --muted:#8a8f9c; --amber:#e8a33d; --glass:#6fb3b8;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --bar:3.5rem;
  --deck:2.25rem;
  --top:calc(var(--bar) + var(--deck) + env(safe-area-inset-top, 0px));
  --drawer-veil:0.93;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;
  /* kills double-tap-to-zoom; pinch and pan still work */
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
/* text in the drawer stays selectable */
#drawer{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ─── visualizer ─────────────────────────────────────────────────── */
/* The CSS filter is the hard ceiling: no preset can blow past it,
   because it's applied at composite time, after Butterchurn draws. */
#viz,#viz-fallback{position:fixed;inset:0;width:100%;height:100dvh;z-index:0;display:block;
  filter:brightness(.72) saturate(.82) contrast(1.06)}
#viz[hidden],#viz-fallback[hidden]{display:none}
.nd-viz-footer{max-width:34rem;margin:0 auto;padding:1.5rem 1.5rem 3rem;
  border-top:1px solid var(--line)}
.nd-viz-footer__label{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.nd-viz-footer__count{margin:.75rem 0 .35rem;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 78%,transparent)}
.nd-viz-footer__help{margin:0;font-family:var(--mono);font-size:.6875rem;line-height:1.6;
  color:var(--muted)}
.nd-viz-footer__clear{margin-top:1rem;padding:.6rem 1rem;background:none;
  border:1px solid var(--line);border-radius:2px;color:var(--muted);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:border-color 140ms,color 140ms}
.nd-viz-footer__clear:hover{border-color:var(--amber);color:var(--amber)}
.nd-viz-footer__clear:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:30rem){.nd-viz-footer{padding:1.5rem 1.125rem 2.5rem}}
.nd-votes-footer{padding-bottom:1.5rem}
.nd-votes-footer + .nd-viz-footer{border-top-style:dashed}
.nd-viz-footer__row{display:flex;flex-wrap:wrap;gap:.5rem}
.nd-viz-footer__clear[data-armed]{border-color:#c4584a;color:#e08a7e}

#nd-toast{position:fixed;left:50%;bottom:calc(2rem + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,.5rem);z-index:40;padding:.6rem 1rem;
  background:rgba(20,22,28,.9);border:1px solid #2a2e39;border-radius:2px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);pointer-events:none;opacity:0;
  transition:opacity 200ms ease,transform 200ms ease}
#nd-toast.show{opacity:1;transform:translate(-50%,0)}

#viz-tone{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:rgba(20,22,28,.26)}
#viz-shade{position:fixed;inset:0 0 auto 0;height:calc(var(--top)*2.2);z-index:1;
  pointer-events:none;background:linear-gradient(to bottom,
    rgba(20,22,28,.88) 0%,rgba(20,22,28,.55) 45%,rgba(20,22,28,0) 100%)}

/* ─── transport ──────────────────────────────────────────────────── */
#transport{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--top);
  padding:0 .875rem;padding-top:env(safe-area-inset-top,0px);
  display:flex;flex-direction:column;
  border-bottom:1px solid rgba(230,227,220,.09);background:rgba(20,22,28,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.tp-row{height:var(--bar);display:flex;align-items:center;gap:.875rem}

/* second row: prev · next · time · seek · time · shuffle */
.tp-deck{height:var(--deck);display:flex;align-items:center;gap:.5rem;padding-bottom:.25rem}
.tp-mini{flex:0 0 auto;width:1.85rem;height:1.85rem;display:grid;place-items:center;
  background:none;border:0;border-radius:50%;color:var(--muted);cursor:pointer;
  transition:color 140ms ease}
.tp-mini:hover{color:var(--paper)}
.tp-mini:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.tp-mini:disabled{opacity:.35;cursor:default}
.tp-mini svg{width:13px;height:13px;fill:currentColor}
.tp-mini[aria-pressed="true"]{color:var(--amber)}
.tp-time{flex:0 0 auto;min-width:2.4rem;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.tp-seek{flex:1 1 auto;min-width:0;height:1.5rem;margin:0;background:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;--p:0%}
.tp-seek:disabled{cursor:default;opacity:.5}
.tp-seek::-webkit-slider-runnable-track{height:2px;border-radius:1px;
  background:linear-gradient(to right,var(--amber) var(--p),var(--line) var(--p))}
.tp-seek::-moz-range-track{height:2px;border-radius:1px;background:var(--line)}
.tp-seek::-moz-range-progress{height:2px;background:var(--amber)}
.tp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;
  border-radius:50%;background:var(--paper);border:0}
.tp-seek::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--paper);border:0}
.tp-seek:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.tp-btn{flex:0 0 auto;width:2.25rem;height:2.25rem;display:grid;place-items:center;
  background:none;border:1px solid var(--line);border-radius:50%;color:var(--paper);
  cursor:pointer;transition:border-color 140ms ease,color 140ms ease}
.tp-btn:hover{border-color:var(--amber);color:var(--amber)}
.tp-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tp-btn:disabled{opacity:.4;cursor:default}
.tp-btn svg{width:14px;height:14px;fill:currentColor}
.tp-btn .icon-pause{display:none}
.tp-btn[aria-pressed="true"] .icon-play{display:none}
.tp-btn[aria-pressed="true"] .icon-pause{display:block}

.tp-now{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.5rem}
.tp-lamp{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--line);
  align-self:center;transition:background-color 300ms ease,box-shadow 300ms ease}
body.is-playing .tp-lamp{background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.18);
  animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,163,61,.06)}}

.tp-track{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 550;
  font-size:.875rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-artist{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
@media (max-width:26rem){.tp-artist{display:none}}

.tp-votes{flex:0 0 auto;display:flex;gap:.25rem}
.tp-vote{width:2rem;height:2rem;display:grid;place-items:center;background:none;border:0;
  border-radius:50%;color:var(--muted);cursor:pointer;transition:color 140ms ease,background-color 140ms ease}
.tp-vote svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.tp-vote.is-down svg{transform:scaleY(-1)}
.tp-vote:hover{color:var(--paper)}
.tp-vote:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.tp-vote:disabled{opacity:.3;cursor:default}
.tp-vote[aria-pressed="true"]{color:var(--amber)}
.tp-vote[aria-pressed="true"] svg{fill:currentColor}

.tp-posts{flex:0 0 auto;background:none;border:0;border-left:1px solid var(--line);
  padding:.5rem 0 .5rem .875rem;color:var(--muted);font-family:var(--mono);font-size:.625rem;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color 140ms ease}
.tp-posts:hover,body.drawer-open .tp-posts{color:var(--amber)}
.tp-posts:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ─── drawer ─────────────────────────────────────────────────────── */
#drawer{position:fixed;top:var(--top);left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;background:rgba(20,22,28,var(--drawer-veil));
  -webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15);
  border-top:1px solid rgba(230,227,220,.06);transform:translateY(100%);
  transition:transform 420ms cubic-bezier(.16,1,.3,1);will-change:transform}
body.drawer-open #drawer{transform:translateY(0)}
#drawer[inert]{pointer-events:none}
.dw-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-close{position:absolute;top:.5rem;right:.75rem;z-index:2;width:2rem;height:2rem;
  display:grid;place-items:center;background:rgba(20,22,28,.6);border:0;border-radius:50%;
  color:var(--muted);font-size:1rem;line-height:1;cursor:pointer}
.dw-close:hover{color:var(--amber)}
.dw-close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.dw-scroll[hidden]{display:none}

/* drawer tabs: Tracks · Visuals · Posts */
.dw-tabs{flex:0 0 auto;display:flex;gap:1.25rem;padding:.9rem 3.25rem 0 1.5rem;
  border-bottom:1px solid var(--line)}
.dw-tab{background:none;border:0;border-bottom:2px solid transparent;padding:.35rem 0 .65rem;
  margin-bottom:-1px;color:var(--muted);font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color 140ms,border-color 140ms}
.dw-tab:hover{color:var(--paper)}
.dw-tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.dw-tab:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:30rem){.dw-tabs{padding-left:1.125rem;gap:1rem}}

/* library panes (tracks + visuals share this) */
.lb{max-width:40rem;margin:0 auto;padding:1.25rem 1.5rem 4rem}
@media (max-width:30rem){.lb{padding:1rem 1.125rem 3rem}}
.lb-sec{margin-bottom:1.25rem}
.lb-label{display:block;font-family:var(--mono);font-size:.5625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.lb-row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{padding:.45rem .7rem;background:none;border:1px solid var(--line);border-radius:999px;
  color:var(--muted);font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;transition:border-color 140ms,color 140ms,background-color 140ms}
.chip:hover{color:var(--paper)}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.08)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip:disabled{opacity:.35;cursor:default}
.chip .n{opacity:.7;margin-left:.3em}
.lb-help{margin:.5rem 0 0;font-family:var(--mono);font-size:.625rem;line-height:1.6;color:var(--muted)}
.lb-search{width:100%;padding:.6rem .75rem;margin-top:.6rem;background:var(--panel);
  border:1px solid var(--line);border-radius:2px;color:var(--paper);font-family:var(--mono);
  font-size:.75rem;-webkit-user-select:text;user-select:text}
.lb-search:focus{outline:none;border-color:var(--amber)}
.lb-list{list-style:none;margin:.75rem 0 0;padding:0;border-top:1px solid var(--line)}
.lb-item{display:flex;align-items:center;gap:.25rem;border-bottom:1px solid rgba(42,46,57,.7)}
.lb-item.is-now{background:rgba(232,163,61,.07)}
.lb-play{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.6rem;padding:.7rem .25rem;
  background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.lb-play:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.lb-play:hover .lb-t{color:var(--amber)}
.lb-dot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:transparent;align-self:center}
.lb-item.is-now .lb-dot{background:var(--amber)}
.lb-txt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:.1rem}
.lb-t{font-family:var(--display);font-variation-settings:"wdth" 102,"wght" 540;font-size:.9375rem;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 140ms}
.lb-a{font-family:var(--mono);font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-dur{flex:0 0 auto;font-family:var(--mono);font-size:.625rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.lb-item .tp-vote{flex:0 0 auto}
.lb-empty{padding:1.5rem 0;font-family:var(--mono);font-size:.6875rem;color:var(--muted)}
.lb-tag{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--glass);margin-left:.35rem}
.lb-btn{padding:.6rem 1rem;background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;transition:border-color 140ms,color 140ms}
.lb-btn:hover{border-color:var(--amber);color:var(--amber)}
.lb-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.lb-btn:disabled{opacity:.4;cursor:default}
.lb-btn[data-armed]{border-color:#c4584a;color:#e08a7e}
.lb-btn--hi{border-color:var(--amber);color:var(--amber)}
.lb-foot{margin-top:2rem;padding-top:1.25rem;border-top:1px dashed var(--line)}

/* visualizer rating bar, bottom of the screen */
#viz-bar{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15;
  transform:translateX(-50%);display:flex;align-items:center;gap:.25rem;max-width:calc(100vw - 2rem);
  padding:.25rem .3rem .25rem .9rem;background:rgba(20,22,28,.62);border:1px solid rgba(230,227,220,.08);
  border-radius:999px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:opacity 500ms ease}
#viz-bar[hidden]{display:none}
#viz-bar.idle{opacity:0;pointer-events:none}
body.drawer-open #viz-bar{opacity:0;pointer-events:none}
.vb-name{min-width:0;max-width:52vw;font-family:var(--mono);font-size:.5625rem;letter-spacing:.08em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:.25rem}

@media (prefers-reduced-motion:reduce){
  #drawer{transition-duration:.01ms}
  body.is-playing .tp-lamp{animation:none}
}

/* ─── timeline ───────────────────────────────────────────────────── */
.nd-timeline{list-style:none;max-width:34rem;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nd-timeline__year{font-family:var(--mono);font-size:.625rem;letter-spacing:.22em;
  color:var(--muted);padding:2.25rem 0 .75rem 2.75rem}
.nd-timeline__year:first-child{padding-top:0}
.nd-entry{position:relative;display:grid;grid-template-columns:2.75rem 1fr;
  grid-template-areas:"rail date" "rail title" "rail blurb";gap:.2rem 0;
  padding:1rem 0 1.5rem;text-decoration:none;color:inherit;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;font:inherit}
.nd-entry:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.nd-entry__rail{grid-area:rail;position:relative}
.nd-entry__rail::before{content:"";position:absolute;left:3px;top:0;bottom:-1.5rem;
  width:1px;background:var(--line)}
.nd-entry__rail::after{content:"";position:absolute;left:0;top:.45rem;width:7px;height:7px;
  border:1.5px solid var(--muted);border-radius:50%;background:var(--ink);
  transition:background-color 140ms ease,border-color 140ms ease}
.nd-timeline__item:last-child .nd-entry__rail::before{bottom:auto;height:1.4rem}
.nd-entry:hover .nd-entry__rail::after{background:var(--amber);border-color:var(--amber)}
.nd-entry__date{grid-area:date;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nd-entry__title{grid-area:title;font-family:var(--display);
  font-variation-settings:"wdth" 108,"wght" 600;font-size:1.3125rem;line-height:1.15;
  letter-spacing:-.01em;margin-top:.15rem;transition:color 140ms ease}
.nd-entry:hover .nd-entry__title{color:var(--amber)}
.nd-entry__blurb{grid-area:blurb;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 72%,transparent);margin-top:.35rem;text-wrap:pretty}

/* ─── note view ──────────────────────────────────────────────────── */
.nd{max-width:34rem;margin:0 auto;padding:1rem 1.5rem 5rem;font-size:1.0625rem;line-height:1.65}
.nd-head{margin-bottom:2.5rem}
.nd-head__title{font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 620;
  font-size:clamp(1.875rem,7vw,2.75rem);line-height:1.03;letter-spacing:-.015em;
  margin:0 0 .75rem;text-wrap:balance}
.nd-head__stamp{font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;
  color:var(--muted);margin:0;padding-top:1rem;border-top:1px solid var(--line)}
.nd-body>*{margin-block:0 1.25rem}
.nd-body h2{font-family:var(--mono);font-size:.6875rem;font-weight:500;text-transform:uppercase;
  letter-spacing:.18em;color:var(--muted);margin-block:2.5rem 1rem}
.nd-body h3{font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 600;
  font-size:1.1875rem;margin-block:1.75rem .5rem}
.nd-body a{color:var(--paper);text-decoration-color:var(--amber);text-underline-offset:.2em}
.nd-body a:hover{color:var(--amber)}
.nd-body code{font-family:var(--mono);font-size:.8125em;background:var(--panel);
  padding:.1em .35em;border-radius:2px}
.nd-body pre{font-family:var(--mono);font-size:.8125rem;line-height:1.6;background:var(--panel);
  border-left:2px solid var(--line);padding:1rem 1.125rem;overflow-x:auto}
.nd-body pre code{background:none;padding:0}
.nd-body ul,.nd-body ol{padding-left:1.25rem}
.nd-body li{margin-bottom:.375rem}
.nd-body li::marker{color:var(--muted)}
.nd-body img{max-width:100%;height:auto;border-radius:2px}

/* callouts — written as > [!NOTE] / > [!TIP] so GitHub renders them too */
.nd-body blockquote.nd-note,.nd-body blockquote.nd-digest{
  position:relative;margin:2rem 0;padding:0 0 0 1.25rem;border:0}
.nd-body blockquote.nd-note::before,.nd-body blockquote.nd-digest::before{
  content:"";position:absolute;left:0;top:.4em;bottom:.2em;width:2px;border-radius:1px}
.nd-body blockquote.nd-note::after,.nd-body blockquote.nd-digest::after{
  font-family:var(--mono);font-size:.5625rem;text-transform:uppercase;letter-spacing:.2em;
  position:absolute;left:1.25rem;top:-1.35em}
.nd-body blockquote.nd-note::before{background:var(--amber)}
.nd-body blockquote.nd-note::after{content:"notes";color:var(--amber)}
.nd-body blockquote.nd-digest::before{background:var(--glass)}
.nd-body blockquote.nd-digest::after{content:"digest";color:var(--glass)}
.nd-body blockquote.nd-digest{font-size:.9875rem;line-height:1.6;
  color:color-mix(in srgb,var(--paper) 88%,transparent)}
.nd-body blockquote>*:last-child{margin-bottom:0}

.nd-discuss{display:inline-flex;align-items:center;gap:.5rem;margin-top:2.5rem;
  padding:.7rem 1rem;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;
  text-transform:uppercase;text-decoration:none;transition:border-color 140ms,color 140ms}
.nd-discuss:hover{border-color:var(--amber);color:var(--amber)}

.nd-back{display:block;width:100%;max-width:34rem;margin:0 auto;padding:1.25rem 1.5rem 0;
  background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.14em;text-transform:uppercase;text-align:left;cursor:pointer}
.nd-back:hover{color:var(--amber)}
.nd-back:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script type="module">
import butterchurn from 'https://unpkg.com/butterchurn@3.0.0-beta.5/dist/butterchurn.js';

/* ═══════════════════════════════════════════════════════════════════
   Config — the only block you should need to edit
   ═══════════════════════════════════════════════════════════════════ */

const CFG = {
  // audio: each library publishes a manifest.json of { id, url, title, artist }
  // (or plain URL strings). All of them are shuffled together into one station.
  libraries: [
    { name: 'lofi', manifest: 'https://szk5334.github.io/lofi-library/manifest.json' },
    { name: 'noir', manifest: 'https://szk5334.github.io/lofi-library-noir-jazz/manifest.json' },
  ],

  // notes: where the markdown lives
  owner: 'szk5334',
  repo:  'lofi-player',
  dir:   'posts',
  branch:'main',

  discussions: 'https://github.com/szk5334/lofi-player/discussions',

  presetHold: 22000,   // ms before drifting to the next preset
  blend: 5.5,          // seconds of crossfade between presets

  // How hard the audio drives the visuals. Milkdrop reactivity scales
  // with amplitude, and most white-outs are just too much signal.
  // 1 = raw. Lower is calmer. 0.3 suits lofi.
  drive: 0.3,

  // If a preset stays brighter than this, ban it for good.
  // 0 = black, 1 = white. Measured after the CSS filter is applied.
  maxBrightness: 0.55,
  settle: 1800,        // ms to ignore after a preset loads (the crossfade)
  checkEvery: 700      // ms between brightness samples
};

/* ═══════════════════════════════════════════════════════════════════
   Shared helpers
   ═══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Every track and every visual sits in exactly one of these.
const CATS = ['up', 'none', 'down'];
const catOf = v => v > 0 ? 'up' : v < 0 ? 'down' : 'none';
const LABEL = { all: 'All', up: 'Liked', none: 'Unrated', down: 'Disliked', bright: 'Too bright' };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const THUMB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5h3.5V20H3zM6.5 20h10.2a2 2 0 0 0 2-1.6l1.3-6.5a2 2 0 0 0-2-2.4H13l.8-3.8A1.7 1.7 0 0 0 12.1 3.6L6.5 10.5z"/></svg>';
const voteButtons = (v, attr, what) => `
  <button class="tp-vote" ${attr}="1" aria-pressed="${v > 0}" aria-label="Thumbs up ${esc(what)}">${THUMB}</button>
  <button class="tp-vote is-down" ${attr}="-1" aria-pressed="${v < 0}" aria-label="Thumbs down ${esc(what)}">${THUMB}</button>`;

function toast(msg) {
  let el = $('nd-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'nd-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function download(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// Two taps to do anything destructive.
function armed(btn, label, fn) {
  btn?.addEventListener('click', () => {
    if (!btn.hasAttribute('data-armed')) {
      btn.setAttribute('data-armed', '');
      btn.textContent = 'Tap again to confirm';
      setTimeout(() => { if (btn.isConnected) { btn.removeAttribute('data-armed'); btn.textContent = label; } }, 3000);
      return;
    }
    fn();
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Visualizer
   ═══════════════════════════════════════════════════════════════════ */

const canvas = $('viz');
const fb     = $('viz-fallback');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let audioCtx = null, viz = null, srcNode = null, tap = null, drive = null;
let rendering = false, cycle = null, fallbackRAF = null;
let current = '', hot = 0, settled = 0;

function webgl2() {
  try { return !!document.createElement('canvas').getContext('webgl2'); }
  catch { return false; }
}
const canViz = webgl2() && !reduce;

function presetPool() {
  const all = {};
  if (window.base?.default) Object.assign(all, window.base.default);
  if (window.extra?.default) Object.assign(all, window.extra.default);
  return all;
}
const presets = presetPool();
const presetKeys = Object.keys(presets).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

function vizSize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  return [Math.max(1, Math.round(canvas.clientWidth * dpr)),
          Math.max(1, Math.round(canvas.clientHeight * dpr))];
}

/* Butterchurn draws into its own off-screen WebGL canvas, then copies each
   frame onto #viz with a 2D drawImage at (0,0). So #viz has to be exactly
   the render size. Left at the browser default (300×150), you only ever see
   the top-left corner of the frame stretched across the screen, which is
   the "zoomed way in" look. */
function sizeRenderer() {
  if (!viz) return;
  const [w, h] = vizSize();
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  viz.setRendererSize(w, h);
}
addEventListener('resize', sizeRenderer);

/* ─── visual votes ────────────────────────────────────────────────
   Separate from track votes. Thumbs down keeps a visual out of rotation
   (unless you turn Disliked on in Visuals → Show from).
------------------------------------------------------------------ */
const vvotes  = store.get('nd.vizvotes', {});
const vfilter = Object.assign({ up: true, none: true, down: false }, store.get('nd.vfilter', {}));
let autoCycle = store.get('nd.vcycle', true);
const vVoteOf = k => vvotes[k]?.v || 0;

// Too-bright presets are dropped automatically, separately from your votes.
const BANS = 'nd.banned';
const banned = new Set(store.get(BANS, []));
const saveBans = () => store.set(BANS, [...banned]);

const vAllowed = k => vfilter[catOf(vVoteOf(k))] && !banned.has(k);

function pickPreset() {
  let live = presetKeys.filter(k => k !== current && vAllowed(k));
  if (!live.length) live = presetKeys.filter(vAllowed);
  if (!live.length) live = presetKeys.filter(k => !banned.has(k) && vVoteOf(k) >= 0);
  if (!live.length) live = presetKeys.filter(k => !banned.has(k));
  if (!live.length) { banned.clear(); saveBans(); live = presetKeys; }
  return live[Math.floor(Math.random() * live.length)];
}

function restartCycle() {
  clearInterval(cycle); cycle = null;
  if (viz && autoCycle) cycle = setInterval(() => roll(CFG.blend), CFG.presetHold);
}

function showPreset(k, blend = 2.5) {
  if (!k || !presets[k]) return;
  current = k;
  paintVizBar();
  markNowVisual();
  if (!viz) return;                 // remembered; loads once playback starts
  hot = 0;
  settled = performance.now() + CFG.settle;
  viz.loadPreset(presets[k], blend);
  restartCycle();
  wakeBar();
}
const roll = blend => showPreset(pickPreset(), blend);

function startVisualizer() {
  if (viz || !canViz || !presetKeys.length) return false;

  const [w, h] = vizSize();
  canvas.width = w; canvas.height = h;
  viz = butterchurn.createVisualizer(audioCtx, canvas, {
    width: w, height: h,
    pixelRatio: 1,      // dpr is already baked into width/height
    textureRatio: 1
  });

  // Butterchurn runs ~0.26s behind the audio it analyses, so delay the
  // audible path to match.
  tap = audioCtx.createDelay();
  tap.delayTime.value = 0.26;
  tap.connect(audioCtx.destination);

  // The visualizer hears a quieter copy: calmer visuals, same sound.
  drive = audioCtx.createGain();
  drive.gain.value = CFG.drive;
  tap.connect(drive);
  viz.connectAudio(drive);

  showPreset(current && presets[current] ? current : pickPreset(), 0);

  cancelAnimationFrame(fallbackRAF);
  fb.hidden = true;
  $('viz-bar').hidden = false;
  rendering = true;
  runLoop();
  return true;
}

/* ─── brightness governor ─────────────────────────────────────────
   Sample the frame down to 8×8; if a preset sits over the ceiling twice
   running, drop it for good. A visual you've liked is never dropped.
------------------------------------------------------------------ */
const probe = Object.assign(document.createElement('canvas'), { width: 8, height: 8 });
const pctx  = probe.getContext('2d', { willReadFrequently: true });

function brightness() {
  try {
    pctx.drawImage(canvas, 0, 0, 8, 8);
    const d = pctx.getImageData(0, 0, 8, 8).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4)
      sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    return sum / (d.length / 4) / 255;
  } catch { return 0; }
}

function runLoop() {
  let last = 0, checked = 0;
  (function loop(now) {
    if (!rendering) return;
    requestAnimationFrame(loop);

    // half rate while the drawer covers it
    const gap = document.body.classList.contains('drawer-open') ? 42 : 0;
    if (now - last < gap) return;
    last = now;

    viz.render();

    if (now < settled || now - checked < CFG.checkEvery) return;
    checked = now;

    if (brightness() * 0.72 > CFG.maxBrightness && vVoteOf(current) <= 0) {
      if (++hot >= 2) {
        banned.add(current); saveBans();
        console.info('nightdeck: too bright —', current);
        toast('Too bright · dropped');
        roll(2.5);
        refreshVisuals();
      }
    } else hot = 0;
  })(0);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { rendering = false; }
  else if (viz && !rendering) { rendering = true; runLoop(); }
});

/* ─── visual rating bar + gestures ────────────────────────────────
   Tap the visualizer to bring up its bar: name, 👍, 👎, next.
   Double-tap: next visual. Press and hold: thumbs down.
   Keyboard: → next visual, X thumbs down.
------------------------------------------------------------------ */
const vbar = $('viz-bar');
function paintVizBar() {
  $('vb-name').textContent = current || '';
  const v = vVoteOf(current);
  $('vviz-up').setAttribute('aria-pressed', String(v > 0));
  $('vviz-down').setAttribute('aria-pressed', String(v < 0));
}
function wakeBar() {
  if (vbar.hidden) return;
  vbar.classList.remove('idle');
  clearTimeout(wakeBar._t);
  wakeBar._t = setTimeout(() => vbar.classList.add('idle'), 4500);
}

function vizVote(k, v) {
  if (!k) return;
  if (vVoteOf(k) === v) { delete vvotes[k]; toast('Visual vote removed'); }
  else {
    vvotes[k] = { v, at: new Date().toISOString() };
    toast(v > 0 ? 'Visual · thumbs up' : 'Visual · thumbs down');
  }
  store.set('nd.vizvotes', vvotes);
  navigator.vibrate?.(12);
  paintVizBar();
  if (k === current && v < 0 && vVoteOf(k) < 0 && !vfilter.down) roll(2.5);
  refreshVisuals();
}

$('vviz-up').addEventListener('click', () => { vizVote(current, 1); wakeBar(); });
$('vviz-down').addEventListener('click', () => { vizVote(current, -1); wakeBar(); });
$('vviz-next').addEventListener('click', () => { roll(2.5); });

const onViz = e => !e.target.closest('#transport, #drawer, #viz-bar');
let held = null, lastTap = 0, lastX = 0, lastY = 0;

document.addEventListener('pointerdown', e => {
  if (!viz || !onViz(e)) return;
  wakeBar();
  const now = performance.now();
  const near = Math.hypot(e.clientX - lastX, e.clientY - lastY) < 32;
  if (now - lastTap < 320 && near) {
    if (held) { clearTimeout(held); held = null; }
    lastTap = 0;
    roll(2.5); toast('Next visual');
    return;
  }
  lastTap = now; lastX = e.clientX; lastY = e.clientY;
  held = setTimeout(() => { held = null; lastTap = 0; vizVote(current, -1); }, 650);
});
const release = () => { if (held) { clearTimeout(held); held = null; } };
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('pointermove', e => {
  if (viz && e.pointerType === 'mouse' && onViz(e)) wakeBar();
  if (held && Math.hypot(e.clientX - lastX, e.clientY - lastY) > 12) release();
});
document.addEventListener('contextmenu', e => { if (viz && onViz(e)) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); togglePlay(); }
  if (!viz) return;
  if (e.key === 'ArrowRight') { roll(2.5); toast('Next visual'); }
  if (e.key === 'x' || e.key === 'X') vizVote(current, -1);
});

/* Fallback: no WebGL2, or reduced motion. Soft drifting smoke on its own
   canvas (a canvas is bound to the first context type it's asked for). */
(function fallback() {
  if (viz) return;
  const ctx = fb.getContext('2d');
  if (!ctx) return;
  let W, H, dpr;
  const fit = () => { dpr = Math.min(devicePixelRatio||1,1.5);
    W = fb.clientWidth; H = fb.clientHeight;
    fb.width = W*dpr; fb.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  fit(); addEventListener('resize', fit);

  const TINTS = [[111,179,184],[232,163,61],[86,96,140],[198,120,150]];
  const puffs = Array.from({length:18},(_,i)=>({
    x:Math.random(), y:Math.random(), r:130+Math.random()*250,
    vx:(Math.random()-.5)*0.00016, vy:-0.00006-Math.random()*0.00012,
    t:TINTS[i%TINTS.length], a:.05+Math.random()*.07, ph:Math.random()*6.28 }));

  if (reduce) { ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H); return; }

  (function draw(now) {
    if (viz) return;
    fallbackRAF = requestAnimationFrame(draw);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#14161c'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of puffs) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -.3) { p.y = 1.3; p.x = Math.random(); }
      if (p.x < -.3) p.x = 1.3; if (p.x > 1.3) p.x = -.3;
      const r = p.r * (1 + Math.sin(now*0.00022 + p.ph)*0.14);
      const cx = p.x*W, cy = p.y*H;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      const [cr,cg,cb] = p.t;
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${p.a})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,6.284); ctx.fill();
    }
  })(0);
})();

/* ═══════════════════════════════════════════════════════════════════
   Audio
   ═══════════════════════════════════════════════════════════════════ */

const au       = $('au');
const playBtn  = $('play');
const trackEl  = $('track');
const artistEl = $('artist');
const voteUp   = $('vote-up');
const voteDn   = $('vote-down');
const prevBtn  = $('prev');
const nextBtn  = $('next');
const seek     = $('seek');
const shufBtn  = $('shuffle');

let allTracks = [], byId = new Map();
let queue = [], qi = 0, ready = false, nowT = null;
const hist = [];

/* ─── track votes + play filter ───────────────────────────────────
   Votes live in localStorage on this device. The play filter decides
   which groups the station draws from; tapping a track in a list plays
   it regardless, then the station carries on from the filter.
------------------------------------------------------------------ */
const votes   = store.get('nd.votes', {});
const tfilter = Object.assign({ up: true, none: true, down: false }, store.get('nd.filter', {}));
let shuffleOn = store.get('nd.shuffle', true);
const voteOf   = t => (t && votes[t.id]?.v) || 0;
const tAllowed = t => tfilter[catOf(voteOf(t))];

const shuffle = a => { for (let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const byName = (a, b) =>
  (a.artist || '').localeCompare(b.artist || '', undefined, { sensitivity: 'base' }) ||
  (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' });

function rebuildQueue(front) {
  const pool = allTracks.filter(tAllowed);
  if (shuffleOn) {
    queue = shuffle(pool.filter(t => t !== front));
    if (front) queue.unshift(front);
  } else {
    const sorted = pool.sort(byName);
    const i = front ? sorted.indexOf(front) : -1;
    queue = i >= 0 ? sorted.slice(i).concat(sorted.slice(0, i))
          : front ? [front, ...sorted] : sorted;
  }
  qi = 0;
}

// Track URLs in a manifest are relative to that manifest.
async function loadOne(lib) {
  const res = await fetch(lib.manifest, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${lib.name} library returned ${res.status}`);
  const raw = await res.json();
  const list = Array.isArray(raw) ? raw : (raw.tracks || []);
  return list.map(t => {
    if (typeof t === 'string') {
      const url = new URL(t, lib.manifest).href;
      const name = decodeURIComponent(t.split('/').pop().replace(/\.\w+$/, ''));
      return { id: url, url, title: name, artist: '', library: lib.name };
    }
    const url = new URL(t.url || t.src || t.file || t.path, lib.manifest).href;
    return { ...t, id: t.id || url, url, library: t.library || lib.name };
  });
}

async function loadLibrary() {
  try {
    const got = await Promise.allSettled(CFG.libraries.map(loadOne));
    allTracks = got.flatMap(r => r.status === 'fulfilled' ? r.value : []);
    if (!allTracks.length) {
      const why = got.find(r => r.status === 'rejected');
      throw new Error(why ? why.reason.message : 'the libraries have no tracks');
    }
    byId = new Map(allTracks.map(t => [t.id, t]));
    rebuildQueue();
    ready = true;
    prevBtn.disabled = nextBtn.disabled = false;
    trackEl.textContent = 'Ready';
    artistEl.textContent = `${queue.length} of ${allTracks.length} tracks`;
  } catch (e) {
    console.error('library:', e);
    trackEl.textContent = e.message;       // the console isn't reachable on a phone
    artistEl.textContent = 'library';
    playBtn.disabled = true;
  }
  renderTracks();
}

function paintVotes() {
  const v = voteOf(nowT);
  voteUp.disabled = voteDn.disabled = !nowT;
  voteUp.setAttribute('aria-pressed', String(v > 0));
  voteDn.setAttribute('aria-pressed', String(v < 0));
}

function show(t) {
  nowT = t;
  paintVotes();
  trackEl.textContent = t.title || 'Untitled';
  artistEl.textContent = t.artist || 'nightdeck';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || 'Untitled', artist: t.artist || 'NIGHTDECK', album: 'NIGHTDECK'
    });
  }
  markNowTrack();
}

// A second, silent element warms the next track into the HTTP cache.
const pre = new Audio();
pre.crossOrigin = 'anonymous';
pre.preload = 'auto';
pre.muted = true;

function cueTrack(t, record = true) {
  au.src = t.url;
  show(t);
  setTime(0, t.seconds || 0);
  seek.disabled = false;
  if (record && hist[hist.length - 1] !== t) { hist.push(t); if (hist.length > 200) hist.shift(); }
  const next = queue[qi + 1];
  if (next && next.url !== t.url) { pre.src = next.url; pre.load(); }
}

function ensureAudio() {
  if (audioCtx) return;
  // Must be created inside a tap; mobile browsers refuse otherwise.
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  srcNode = audioCtx.createMediaElementSource(au);
  if (startVisualizer()) srcNode.connect(tap);   // tap already goes to destination
  else srcNode.connect(audioCtx.destination);
}

async function playNow() {
  try {
    ensureAudio();
    await audioCtx.resume();
    await au.play();
  } catch (e) {
    console.error('playback:', e);
    trackEl.textContent = "That track wouldn't play";
  }
}

async function togglePlay() {
  if (!ready) return;
  if (!au.getAttribute('src')) {
    if (!queue.length) rebuildQueue();
    if (!queue.length) { toast('Nothing matches the play filter'); return; }
    qi = 0; cueTrack(queue[0]);
  }
  if (au.paused) await playNow(); else au.pause();
}
playBtn.addEventListener('click', togglePlay);

function nextTrack() {
  if (!ready) return;
  let guard = queue.length + 2;
  do {
    qi++;
    if (qi >= queue.length) {               // end of the run: reshuffle and go again
      const last = nowT;
      rebuildQueue();
      if (queue.length > 1 && queue[0] === last) qi = 1;
    }
  } while (queue.length && !tAllowed(queue[qi]) && --guard > 0);
  const t = queue[qi];
  if (!t || !tAllowed(t)) { toast('Nothing matches the play filter'); return; }
  cueTrack(t);
  if (audioCtx) playNow();
}

function prevTrack() {
  if (!ready) return;
  if (au.currentTime > 3 || hist.length < 2) { au.currentTime = 0; return; }
  hist.pop();
  const t = hist[hist.length - 1];
  const i = queue.indexOf(t);
  if (i >= 0) qi = i; else queue.splice(qi, 0, t);
  cueTrack(t, false);
  if (audioCtx) playNow();
}

// Play this track now, then carry on with the filter.
function playTrack(t) {
  if (!t) return;
  rebuildQueue(t);
  cueTrack(t);
  playNow();
}

nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);

function paintShuffle() {
  shufBtn.setAttribute('aria-pressed', String(shuffleOn));
  shufBtn.setAttribute('aria-label', shuffleOn ? 'Shuffle on' : 'Shuffle off (A to Z by artist)');
}
shufBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  store.set('nd.shuffle', shuffleOn);
  rebuildQueue(nowT);
  paintShuffle();
  toast(shuffleOn ? 'Shuffle on' : 'Shuffle off · A to Z by artist');
});
paintShuffle();

au.addEventListener('play',  () => {
  playBtn.setAttribute('aria-pressed','true');
  playBtn.setAttribute('aria-label','Pause');
  document.body.classList.add('is-playing');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
au.addEventListener('pause', () => {
  playBtn.setAttribute('aria-pressed','false');
  playBtn.setAttribute('aria-label','Play');
  document.body.classList.remove('is-playing');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});

let errors = 0;
au.addEventListener('ended', () => { errors = 0; nextTrack(); });
au.addEventListener('playing', () => { errors = 0; });
au.addEventListener('error', () => {
  if (!au.getAttribute('src')) return;
  if (++errors > 5) { trackEl.textContent = 'Tracks are failing to load'; return; }
  nextTrack();
});

/* ─── seek bar ───────────────────────────────────────────────────── */
const clock = s => {
  s = Math.max(0, Math.floor(s || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
let dragging = false;
function setTime(now, len) {
  $('t-now').textContent = clock(now);
  $('t-len').textContent = clock(len);
  const p = len ? Math.min(1, now / len) : 0;
  if (!dragging) seek.value = Math.round(p * 1000);
  seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
}
const duration = () => (isFinite(au.duration) && au.duration) || nowT?.seconds || 0;
au.addEventListener('timeupdate', () => {
  setTime(au.currentTime, duration());
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && duration()) {
    try { navigator.mediaSession.setPositionState({ duration: duration(), position: Math.min(au.currentTime, duration()), playbackRate: 1 }); } catch {}
  }
});
au.addEventListener('loadedmetadata', () => setTime(au.currentTime, duration()));
seek.addEventListener('input', () => {
  dragging = true;
  const len = duration();
  $('t-now').textContent = clock(seek.value / 1000 * len);
  seek.style.setProperty('--p', (seek.value / 10) + '%');
});
seek.addEventListener('change', () => {
  dragging = false;
  const len = duration();
  if (len) au.currentTime = seek.value / 1000 * len;
});

/* ─── lock screen / headset / media keys ─────────────────────────── */
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const on = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  on('play', () => togglePlay());
  on('pause', () => au.pause());
  on('nexttrack', nextTrack);
  on('previoustrack', prevTrack);
  on('seekto', d => { if (d.seekTime != null) au.currentTime = d.seekTime; });
  on('seekbackward', d => { au.currentTime = Math.max(0, au.currentTime - (d.seekOffset || 10)); });
  on('seekforward', d => { au.currentTime = Math.min(duration(), au.currentTime + (d.seekOffset || 10)); });
}

/* ─── voting ─────────────────────────────────────────────────────── */
function vote(t, v) {
  if (!t) return;
  if (voteOf(t) === v) {                  // the same thumb again takes it back
    delete votes[t.id];
    toast('Vote removed');
  } else {
    votes[t.id] = { v, title: t.title || '', artist: t.artist || '', library: t.library || '', at: new Date().toISOString() };
    const skip = v < 0 && t === nowT && !tfilter.down;
    toast(v > 0 ? 'Thumbs up · saved' : skip ? 'Thumbs down · skipping' : 'Thumbs down · saved');
  }
  store.set('nd.votes', votes);
  navigator.vibrate?.(12);
  if (t === nowT) paintVotes();
  refreshTracks();
  if (t === nowT && voteOf(t) < 0 && !tfilter.down && au.getAttribute('src')) nextTrack();
}
voteUp.addEventListener('click', () => vote(nowT, 1));
voteDn.addEventListener('click', () => vote(nowT, -1));

/* ═══════════════════════════════════════════════════════════════════
   Export: one file with every track and every visual, grouped
   up / down / unrated, for re-curation.
   ═══════════════════════════════════════════════════════════════════ */

function exportAll() {
  const T = { up: [], down: [], unrated: [] };
  for (const t of allTracks) {
    const v = voteOf(t);
    const e = { id: t.id, title: t.title || '', artist: t.artist || '', library: t.library || '',
                license: t.license || '', page: t.page || '', seconds: t.seconds ?? null };
    if (v) e.voted_at = votes[t.id].at;
    T[v > 0 ? 'up' : v < 0 ? 'down' : 'unrated'].push(e);
  }
  // votes for tracks that have since left the library
  for (const [id, x] of Object.entries(votes)) if (!byId.has(id))
    T[x.v > 0 ? 'up' : 'down'].push({ id, title: x.title, artist: x.artist, library: x.library, voted_at: x.at, in_library: false });

  const V = { up: [], down: [], unrated: [], too_bright: [...banned].sort() };
  for (const k of presetKeys) {
    const v = vVoteOf(k);
    if (v) V[v > 0 ? 'up' : 'down'].push({ preset: k, voted_at: vvotes[k].at });
    else V.unrated.push(k);
  }
  for (const [k, x] of Object.entries(vvotes)) if (!presets[k])
    V[x.v > 0 ? 'up' : 'down'].push({ preset: k, voted_at: x.at, in_pool: false });

  const name = c => c === 'none' ? 'unrated' : c;
  const exported_at = new Date().toISOString();
  const data = {
    app: 'nightdeck', kind: 'curation', version: 2, exported_at,
    tracks: { counts: { total: allTracks.length, up: T.up.length, down: T.down.length, unrated: T.unrated.length }, ...T },
    visuals: { counts: { total: presetKeys.length, up: V.up.length, down: V.down.length, unrated: V.unrated.length, too_bright: V.too_bright.length }, ...V },
    settings: {
      play_filter: CATS.filter(c => tfilter[c]).map(name),
      visual_filter: CATS.filter(c => vfilter[c]).map(name),
      shuffle: shuffleOn, auto_cycle: autoCycle
    }
  };
  download(`nightdeck-curation-${exported_at.slice(0, 10)}.json`, data);
  toast(`Exported ${plural(allTracks.length, 'track')} · ${plural(presetKeys.length, 'visual')}`);
}

/* ═══════════════════════════════════════════════════════════════════
   Menu panes: Tracks and Visuals
   ═══════════════════════════════════════════════════════════════════ */

const paneT = $('pane-tracks');
const paneV = $('pane-visuals');

function countBy(keys, voteFn) {
  const c = { all: keys.length, up: 0, none: 0, down: 0 };
  for (const k of keys) c[catOf(voteFn(k))]++;
  return c;
}
const chips = (keys, attr, isOn, c) => keys.map(k =>
  `<button class="chip" ${attr}="${k}" aria-pressed="${isOn(k)}">${LABEL[k]}<span class="n">${c[k] ?? ''}</span></button>`).join('');

// Re-render a pane without losing your place in it.
function keepScroll(pane, fn) {
  const y = pane.scrollTop;
  const focused = document.activeElement?.matches?.('[data-search]') && pane.contains(document.activeElement);
  fn();
  pane.scrollTop = y;
  if (focused) { const s = pane.querySelector('[data-search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ─── Tracks ─────────────────────────────────────────────────────── */
let tView = store.get('nd.tview', 'all'), tQuery = '';

function renderTracks() {
  if (!ready) {
    paneT.innerHTML = `<p class="nd-msg">${esc(trackEl.textContent === 'Nothing playing' ? 'Loading the library…' : trackEl.textContent)}</p>`;
    return;
  }
  const c = countBy(allTracks, voteOf);
  const playing = allTracks.filter(tAllowed).length;
  const listName = tView === 'all' ? 'everything' : LABEL[tView].toLowerCase();
  paneT.innerHTML = `<div class="lb">
    <div class="lb-sec">
      <span class="lb-label">Play from</span>
      <div class="lb-row">${chips(CATS, 'data-tf', k => tfilter[k], c)}</div>
      <p class="lb-help">The station plays ${plural(playing, 'track')} from the groups you turn on. Tap any track below to play it anyway.</p>
    </div>
    <div class="lb-sec">
      <span class="lb-label">Browse</span>
      <div class="lb-row">${chips(['all', ...CATS], 'data-tv', k => tView === k, c)}</div>
      <input class="lb-search" type="search" placeholder="Search title or artist" value="${esc(tQuery)}" data-search>
      <div class="lb-row" style="margin-top:.6rem">
        <button class="lb-btn" data-tplay ${c[tView] ? '' : 'disabled'}>Play ${tView === 'all' ? 'everything' : listName + ' only'}</button>
      </div>
      <ol class="lb-list" data-list></ol>
    </div>
    <div class="lb-foot">
      <span class="lb-label">Export</span>
      <p class="lb-help">One JSON file with every track and every visual, grouped liked / disliked / unrated. Upload it to Claude to re-curate the library.</p>
      <div class="lb-row" style="margin-top:.75rem">
        <button class="lb-btn lb-btn--hi" data-export>Export JSON</button>
        ${Object.keys(votes).length ? '<button class="lb-btn" data-clear>Clear track votes</button>' : ''}
      </div>
    </div>
  </div>`;
  fillTracks();
  armed(paneT.querySelector('[data-clear]'), 'Clear track votes', () => {
    for (const k of Object.keys(votes)) delete votes[k];
    store.set('nd.votes', votes); paintVotes(); toast('Track votes cleared'); refreshTracks();
  });
}

function fillTracks() {
  const ol = paneT.querySelector('[data-list]');
  if (!ol) return;
  const q = tQuery.trim().toLowerCase();
  const list = allTracks
    .filter(t => (tView === 'all' || catOf(voteOf(t)) === tView) &&
                 (!q || `${t.title} ${t.artist}`.toLowerCase().includes(q)))
    .sort(byName);
  ol.innerHTML = list.length ? list.map(t => `
    <li class="lb-item${t === nowT ? ' is-now' : ''}" data-id="${esc(t.id)}">
      <button class="lb-play" data-play>
        <span class="lb-dot" aria-hidden="true"></span>
        <span class="lb-txt"><span class="lb-t">${esc(t.title || 'Untitled')}</span>
          <span class="lb-a">${esc(t.artist || '')}<span class="lb-tag">${esc(t.library || '')}</span></span></span>
        <span class="lb-dur">${t.seconds ? clock(t.seconds) : ''}</span>
      </button>
      ${voteButtons(voteOf(t), 'data-tvote', t.title)}
    </li>`).join('')
    : `<li class="lb-empty">${q ? 'No matches.' : `No ${LABEL[tView].toLowerCase()} tracks yet.`}</li>`;
}

const refreshTracks = () => keepScroll(paneT, renderTracks);
function markNowTrack() {
  paneT.querySelectorAll('.lb-item.is-now').forEach(li => li.classList.remove('is-now'));
  if (nowT) paneT.querySelector(`.lb-item[data-id="${CSS.escape(nowT.id)}"]`)?.classList.add('is-now');
}

paneT.addEventListener('click', e => {
  const tf = e.target.closest('[data-tf]');
  if (tf) {
    const k = tf.dataset.tf;
    if (tfilter[k] && CATS.filter(c => tfilter[c]).length === 1) { toast('Keep at least one group on'); return; }
    tfilter[k] = !tfilter[k];
    store.set('nd.filter', tfilter);
    rebuildQueue(nowT);
    refreshTracks();
    return;
  }
  const tv = e.target.closest('[data-tv]');
  if (tv) { tView = tv.dataset.tv; store.set('nd.tview', tView); refreshTracks(); return; }
  if (e.target.closest('[data-tplay]')) {
    for (const c of CATS) tfilter[c] = tView === 'all' || c === tView;
    store.set('nd.filter', tfilter);
    rebuildQueue();
    if (!queue.length) return;
    qi = 0; cueTrack(queue[0]); playNow();
    refreshTracks();
    toast(tView === 'all' ? 'Playing everything' : `Playing ${LABEL[tView].toLowerCase()} only`);
    return;
  }
  if (e.target.closest('[data-export]')) { exportAll(); return; }
  const li = e.target.closest('.lb-item');
  if (!li) return;
  const t = byId.get(li.dataset.id);
  const vb = e.target.closest('[data-tvote]');
  if (vb) { vote(t, Number(vb.dataset.tvote)); return; }
  if (e.target.closest('[data-play]')) playTrack(t);
});
paneT.addEventListener('input', e => {
  if (e.target.matches('[data-search]')) { tQuery = e.target.value; fillTracks(); }
});

/* ─── Visuals ────────────────────────────────────────────────────── */
let vView = store.get('nd.vview', 'all'), vQuery = '';

      <p class="lb-help">Rotating through ${plural(showing, 'visual')}${autoCycle ? `, a new one every ${Math.round(CFG.presetHold / 1000)}s` : '. Auto-change is off, so the current one stays'}. Tap the visualizer for its rating bar; double-tap for the next one; press and hold for thumbs down.</p>
    </div>

        ${banned.size ? `<button class="lb-btn" data-unban>Restore ${plural(banned.size, 'too-bright visual')}</button>` : ''}
      </div>

}

          ${banned.has(k) ? '<span class="lb-a">dropped · too bright</span>' : ''}</span>
      </button>

}

const refreshVisuals = () => keepScroll(paneV, renderVisuals);
function markNowVisual() {
  paneV.querySelectorAll('.lb-item.is-now').forEach(li => li.classList.remove('is-now'));
  if (current) paneV.querySelector(`.lb-item[data-key="${CSS.escape(current)}"]`)?.classList.add('is-now');
}

paneV.addEventListener('click', e => {
  const vf = e.target.closest('[data-vf]');
  if (vf) {
    const k = vf.dataset.vf;
    if (vfilter[k] && CATS.filter(c => vfilter[c]).length === 1) { toast('Keep at least one group on'); return; }
    vfilter[k] = !vfilter[k];
    store.set('nd.vfilter', vfilter);
    if (current && !vAllowed(current) && viz) roll(2.5);
    refreshVisuals();
    return;
  }
  if (e.target.closest('[data-cycle]')) {
    autoCycle = !autoCycle; store.set('nd.vcycle', autoCycle);
    restartCycle(); refreshVisuals();
    toast(autoCycle ? 'Auto-change on' : 'Auto-change off · holding this visual');
    return;
  }
  const vv = e.target.closest('[data-vv]');
  if (vv) { vView = vv.dataset.vv; store.set('nd.vview', vView); refreshVisuals(); return; }
  if (e.target.closest('[data-export]')) { exportAll(); return; }
  if (e.target.closest('[data-unban]')) {
    const n = banned.size; banned.clear(); saveBans();
    toast(`Restored ${plural(n, 'visual')}`); if (vView === 'bright') vView = 'all';
    refreshVisuals(); return;
  }
  const li = e.target.closest('.lb-item');
  if (!li) return;
  const k = li.dataset.key;
  const vb = e.target.closest('[data-vvote]');
  if (vb) { vizVote(k, Number(vb.dataset.vvote)); return; }
  if (e.target.closest('[data-show]')) {
    if (banned.has(k)) { banned.delete(k); saveBans(); }
    showPreset(k, 2.5);
    toast(viz ? 'Showing it now' : 'Picked · shows when you press play');
    refreshVisuals();
  }
});
paneV.addEventListener('input', e => {
  if (e.target.matches('[data-search]')) { vQuery = e.target.value; fillVisuals(); }
});

// For fixing things from the console later.
window.NIGHTDECK = {
  get preset() { return current; },
  get tooBright() { return [...banned]; },
  get queue() { return queue.map(t => t.title); },
  show: showPreset, next: () => roll(2.5), export: exportAll,
  unbanAll() { banned.clear(); saveBans(); refreshVisuals(); toast('Too-bright list cleared'); }
};

/* ═══════════════════════════════════════════════════════════════════
   Notes
   ═══════════════════════════════════════════════════════════════════ */

const drawer  = document.getElementById('drawer');
const toggle  = document.getElementById('posts-toggle');
const host    = document.getElementById('drawer-content');
const closeBt = document.getElementById('drawer-close');

/* --- source ------------------------------------------------------
   Buildless: ask GitHub what's in the posts folder. Filenames carry
   the date and the slug, so one call renders the whole timeline.

   Jekyll instead? Replace listNotes with:
     const r = await fetch('/notes.json');
     return (await r.json()).notes;
   and drop the front-matter parsing below — Jekyll already did it.
------------------------------------------------------------------ */

const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.dir}?ref=${CFG.branch}`;
const RAW = n => `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dir}/${n}`;

let index = null;
const bodies = new Map();

async function listNotes() {
  if (index) return index;

  // Cache for an hour. Unauthenticated GitHub API is 60 requests/hour
  // per IP, and a returning listener shouldn't spend one.
  try {
    const hit = JSON.parse(localStorage.getItem('nd.index') || 'null');
    if (hit && Date.now() - hit.at < 3600e3) return (index = hit.notes);
  } catch {}

  const res = await fetch(API, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);

  index = (await res.json())
    .filter(f => f.type === 'file' && f.name.endsWith('.md') && !f.name.startsWith('_'))
    .map(f => {
      const m = f.name.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
      return {
        file: f.name,
        date: m ? m[1] : '1970-01-01',
        slug: m ? m[2] : f.name.replace(/\.md$/, ''),
        title: (m ? m[2] : f.name).replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())
      };
    })
    .sort((a, b) => b.date.localeCompare(a.date));

  try { localStorage.setItem('nd.index', JSON.stringify({ at: Date.now(), notes: index })); } catch {}
  return index;
}

/* --- markdown ---------------------------------------------------- */

function splitFrontMatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
  if (!m) return { meta: {}, body: md };
  const meta = {};
  for (const line of m[1].split(/\r?\n/)) {
    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, '');
  }
  return { meta, body: md.slice(m[0].length) };
}

/* GitHub alert syntax doubles as our callouts:
     > [!NOTE]  → digest      > [!TIP]  → your commentary
   Written this way the raw .md renders properly on github.com too. */
function styleCallouts(root) {
  root.querySelectorAll('blockquote').forEach(bq => {
    const first = bq.querySelector('p');
    if (!first) return;
    const tag = first.textContent.match(/^\[!(NOTE|TIP)\]\s*/i);
    if (!tag) return;
    bq.classList.add(tag[1].toUpperCase() === 'NOTE' ? 'nd-digest' : 'nd-note');
    first.innerHTML = first.innerHTML.replace(/^\[!(NOTE|TIP)\]\s*(<br\s*\/?>)?/i, '');
    if (!first.textContent.trim() && !first.querySelector('img')) first.remove();
  });
}

const fmt = iso => new Date(iso + 'T00:00:00')
  .toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toLowerCase();

/* --- views -------------------------------------------------------- */

function message(html) { host.innerHTML = `<p class="nd-msg">${html}</p>`; }

async function showTimeline() {
  message('Reading the log…');
  try {
    const notes = await listNotes();

    let out = [];
    if (!notes.length) {
      out.push('<p class="nd-msg">Nothing posted yet. The first note lands here.</p>');
    } else {
      let year = null;
      out.push('<ol class="nd-timeline">');
      for (const n of notes) {
        const y = n.date.slice(0, 4);
        if (y !== year) { year = y; out.push(`<li class="nd-timeline__year" aria-hidden="true">${y}</li>`); }
        out.push(`<li class="nd-timeline__item">
          <button class="nd-entry" data-file="${n.file}">
            <span class="nd-entry__rail" aria-hidden="true"></span>
            <span class="nd-entry__date">${fmt(n.date)}</span>
            <span class="nd-entry__title">${n.title}</span>
            <span class="nd-entry__blurb" data-blurb></span>
          </button></li>`);
      }
      out.push('</ol>');
    }

    host.innerHTML = out.join('');
    host.scrollTop = 0;
    location.hash = '';
  } catch (e) {
    console.error('timeline:', e);
    message("The log didn't load. <button data-retry>Try again</button>");
    host.querySelector('[data-retry]')?.addEventListener('click', () => {
      index = null; try { localStorage.removeItem('nd.index'); } catch {}; showTimeline();
    });
  }
}

async function openNote(file) {
  message('Loading…');
  try {
    let html = bodies.get(file);
    let meta = {};
    if (!html) {
      const res = await fetch(RAW(file), { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const parsed = splitFrontMatter(await res.text());
      meta = parsed.meta;
      html = marked.parse(parsed.body);
      bodies.set(file, html);
      bodies.set(file + ':meta', meta);
    } else {
      meta = bodies.get(file + ':meta') || {};
    }

    const entry = (index || []).find(n => n.file === file) || {};
    const slug  = meta.slug || entry.slug || file;

    host.innerHTML = `
      <button class="nd-back"><span aria-hidden="true">←</span> All posts</button>
      <article class="nd">
        <header class="nd-head">
          <h1 class="nd-head__title">${meta.title || entry.title || 'Untitled'}</h1>
          <p class="nd-head__stamp">${fmt(meta.date || entry.date)}</p>
        </header>
        <div class="nd-body"></div>
        <a class="nd-discuss" target="_blank" rel="noopener"
           href="${CFG.discussions}?discussions_q=${encodeURIComponent(slug)}">
          Reply on GitHub
        </a>
      </article>`;

    const body = host.querySelector('.nd-body');
    body.innerHTML = html;
    styleCallouts(body);

    host.querySelector('.nd-back').addEventListener('click', showTimeline);
    host.scrollTop = 0;
    location.hash = slug;
  } catch (e) {
    console.error('note:', e);
    message("That note didn't load. <button data-back>Back to the log</button>");
    host.querySelector('[data-back]')?.addEventListener('click', showTimeline);
  }
}

host.addEventListener('click', e => {
  const btn = e.target.closest('[data-file]');
  if (btn) openNote(btn.dataset.file);
});

/* --- drawer ------------------------------------------------------- */

const tabs = [...document.querySelectorAll('.dw-tab')];
function setTab(name) {
  if (!tabs.some(b => b.dataset.tab === name)) name = 'tracks';
  store.set('nd.tab', name);
  for (const b of tabs) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  for (const p of drawer.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== name;
}
tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
setTab(store.get('nd.tab', 'tracks'));

function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  open ? drawer.removeAttribute('inert') : drawer.setAttribute('inert','');
  if (open) { markNowTrack(); markNowVisual(); drawer.querySelector('.dw-tab[aria-selected="true"]')?.focus({ preventScroll:true }); }
  else toggle.focus({ preventScroll:true });
}

toggle.addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer-open')));
closeBt.addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) setDrawer(false);
});

/* --- boot --------------------------------------------------------- */

(async function boot() {
  // Escape hatch: szk5334.github.io/lofi-player/?unban
  if (/[?&]unban\b/.test(location.search)) {
    const n = banned.size;
    banned.clear(); saveBans();
    history.replaceState(null, '', location.pathname);
    setTimeout(() => toast(`Restored ${plural(n, 'visual')}`), 400);
  }
  if (!current && presetKeys.length) current = pickPreset();
  paintVizBar();
  renderVisuals();
  renderTracks();
  loadLibrary();
  await showTimeline();
  const want = decodeURIComponent(location.hash.slice(1));
  if (want) {
    const n = (index || []).find(x => x.slug === want);
    if (n) { setTab('posts'); setDrawer(true); openNote(n.file); }
  }
})();
</script>
