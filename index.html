<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>NIGHTDECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════
   NIGHTDECK

     0   #viz        Butterchurn, full bleed
     20  #drawer     slides up from under the transport
     30  #transport  always on top
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --ink:#14161c; --panel:#1b1e26; --line:#2a2e39;
  --paper:#e6e3dc; --muted:#8a8f9c; --amber:#e8a33d; --glass:#6fb3b8;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --bar:3.5rem;
  --deck:2.25rem;
  --top:calc(var(--bar) + var(--deck) + env(safe-area-inset-top, 0px));
  --drawer-veil:0.93;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;
  /* kills double-tap-to-zoom; pinch and pan still work */
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
/* text in the drawer stays selectable */
#drawer{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ─── visualizer ─────────────────────────────────────────────────── */
/* The CSS filter is the hard ceiling: no preset can blow past it,
   because it's applied at composite time, after Butterchurn draws. */
#viz,#viz-fallback{position:fixed;inset:0;width:100%;height:100dvh;z-index:0;display:block;
  filter:brightness(.72) saturate(.82) contrast(1.06)}
#viz[hidden],#viz-fallback[hidden]{display:none}
.nd-viz-footer{max-width:34rem;margin:0 auto;padding:1.5rem 1.5rem 3rem;
  border-top:1px solid var(--line)}
.nd-viz-footer__label{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.nd-viz-footer__count{margin:.75rem 0 .35rem;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 78%,transparent)}
.nd-viz-footer__help{margin:0;font-family:var(--mono);font-size:.6875rem;line-height:1.6;
  color:var(--muted)}
.nd-viz-footer__clear{margin-top:1rem;padding:.6rem 1rem;background:none;
  border:1px solid var(--line);border-radius:2px;color:var(--muted);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:border-color 140ms,color 140ms}
.nd-viz-footer__clear:hover{border-color:var(--amber);color:var(--amber)}
.nd-viz-footer__clear:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:30rem){.nd-viz-footer{padding:1.5rem 1.125rem 2.5rem}}
.nd-votes-footer{padding-bottom:1.5rem}
.nd-votes-footer + .nd-viz-footer{border-top-style:dashed}
.nd-viz-footer__row{display:flex;flex-wrap:wrap;gap:.5rem}
.nd-viz-footer__clear[data-armed]{border-color:#c4584a;color:#e08a7e}

#nd-toast{position:fixed;left:50%;bottom:calc(2rem + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,.5rem);z-index:40;padding:.6rem 1rem;
  background:rgba(20,22,28,.9);border:1px solid #2a2e39;border-radius:2px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);pointer-events:none;opacity:0;
  transition:opacity 200ms ease,transform 200ms ease}
#nd-toast.show{opacity:1;transform:translate(-50%,0)}

#viz-tone{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:rgba(20,22,28,.26)}
/* Floral visuals carry their own vignette and tone ceiling, so ease the
   house dimming while one is up; otherwise the papers go muddy. */
#viz,#viz-tone{transition:filter 2.5s ease,background-color 2.5s ease}
body.viz-floral #viz{filter:brightness(.9) saturate(.96) contrast(1.04)}
body.viz-floral #viz-tone{background:rgba(20,22,28,.1)}
/* Kaleido visuals are neon glass; let them through almost untouched. */
body.viz-kaleido #viz{filter:brightness(.97) saturate(1.04) contrast(1.03)}
body.viz-kaleido #viz-tone{background:rgba(20,22,28,.04)}
#viz-shade{position:fixed;inset:0 0 auto 0;height:calc(var(--top)*2.2);z-index:1;
  pointer-events:none;background:linear-gradient(to bottom,
    rgba(20,22,28,.88) 0%,rgba(20,22,28,.55) 45%,rgba(20,22,28,0) 100%)}

/* ─── transport ──────────────────────────────────────────────────── */
#transport{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--top);
  padding:0 .875rem;padding-top:env(safe-area-inset-top,0px);
  display:flex;flex-direction:column;
  border-bottom:1px solid rgba(230,227,220,.09);background:rgba(20,22,28,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.tp-row{height:var(--bar);display:flex;align-items:center;gap:.875rem}

/* second row: prev · next · time · seek · time · shuffle */
.tp-deck{height:var(--deck);display:flex;align-items:center;gap:.5rem;padding-bottom:.25rem}
.tp-mini{flex:0 0 auto;width:1.85rem;height:1.85rem;display:grid;place-items:center;
  background:none;border:0;border-radius:50%;color:var(--muted);cursor:pointer;
  transition:color 140ms ease}
.tp-mini:hover{color:var(--paper)}
.tp-mini:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.tp-mini:disabled{opacity:.35;cursor:default}
.tp-mini svg{width:13px;height:13px;fill:currentColor}
.tp-mini[aria-pressed="true"]{color:var(--amber)}
.tp-time{flex:0 0 auto;min-width:2.4rem;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.tp-seek{flex:1 1 auto;min-width:0;height:1.5rem;margin:0;background:none;cursor:pointer;
  -webkit-appearance:none;appearance:none;--p:0%}
.tp-seek:disabled{cursor:default;opacity:.5}
.tp-seek::-webkit-slider-runnable-track{height:2px;border-radius:1px;
  background:linear-gradient(to right,var(--amber) var(--p),var(--line) var(--p))}
.tp-seek::-moz-range-track{height:2px;border-radius:1px;background:var(--line)}
.tp-seek::-moz-range-progress{height:2px;background:var(--amber)}
.tp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;
  border-radius:50%;background:var(--paper);border:0}
.tp-seek::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--paper);border:0}
.tp-seek:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.tp-btn{flex:0 0 auto;width:2.25rem;height:2.25rem;display:grid;place-items:center;
  background:none;border:1px solid var(--line);border-radius:50%;color:var(--paper);
  cursor:pointer;transition:border-color 140ms ease,color 140ms ease}
.tp-btn:hover{border-color:var(--amber);color:var(--amber)}
.tp-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tp-btn:disabled{opacity:.4;cursor:default}
.tp-btn svg{width:14px;height:14px;fill:currentColor}
.tp-btn .icon-pause{display:none}
.tp-btn[aria-pressed="true"] .icon-play{display:none}
.tp-btn[aria-pressed="true"] .icon-pause{display:block}

.tp-now{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.5rem}
.tp-lamp{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--line);
  align-self:center;transition:background-color 300ms ease,box-shadow 300ms ease}
body.is-playing .tp-lamp{background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.18);
  animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,163,61,.06)}}

.tp-track{font-family:var(--display);font-variation-settings:"wdth" 104,"wght" 550;
  font-size:.875rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-artist{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
@media (max-width:26rem){.tp-artist{display:none}}

.tp-votes{flex:0 0 auto;display:flex;gap:.25rem}
.tp-vote{width:2rem;height:2rem;display:grid;place-items:center;background:none;border:0;
  border-radius:50%;color:var(--muted);cursor:pointer;transition:color 140ms ease,background-color 140ms ease}
.tp-vote svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.tp-vote.is-down svg{transform:scaleY(-1)}
.tp-vote:hover{color:var(--paper)}
.tp-vote:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.tp-vote:disabled{opacity:.3;cursor:default}
.tp-vote[aria-pressed="true"]{color:var(--amber)}
.tp-vote[aria-pressed="true"] svg{fill:currentColor}

.tp-posts{flex:0 0 auto;background:none;border:0;border-left:1px solid var(--line);
  padding:.5rem 0 .5rem .875rem;color:var(--muted);font-family:var(--mono);font-size:.625rem;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color 140ms ease}
.tp-posts:hover,body.drawer-open .tp-posts{color:var(--amber)}
.tp-posts:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ─── drawer ─────────────────────────────────────────────────────── */
#drawer{position:fixed;top:var(--top);left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;background:rgba(20,22,28,var(--drawer-veil));
  -webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15);
  border-top:1px solid rgba(230,227,220,.06);transform:translateY(100%);
  transition:transform 420ms cubic-bezier(.16,1,.3,1);will-change:transform}
body.drawer-open #drawer{transform:translateY(0)}
#drawer[inert]{pointer-events:none}
.dw-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-close{position:absolute;top:.5rem;right:.75rem;z-index:2;width:2rem;height:2rem;
  display:grid;place-items:center;background:rgba(20,22,28,.6);border:0;border-radius:50%;
  color:var(--muted);font-size:1rem;line-height:1;cursor:pointer}
.dw-close:hover{color:var(--amber)}
.dw-close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.dw-scroll[hidden]{display:none}

/* drawer tabs: Tracks · Visuals · Posts */
.dw-tabs{flex:0 0 auto;display:flex;gap:1.25rem;padding:.9rem 3.25rem 0 1.5rem;
  border-bottom:1px solid var(--line)}
.dw-tab{background:none;border:0;border-bottom:2px solid transparent;padding:.35rem 0 .65rem;
  margin-bottom:-1px;color:var(--muted);font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color 140ms,border-color 140ms}
.dw-tab:hover{color:var(--paper)}
.dw-tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
.dw-tab:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:30rem){.dw-tabs{padding-left:1.125rem;gap:1rem}}

/* library panes (tracks + visuals share this) */
.lb{max-width:40rem;margin:0 auto;padding:1.25rem 1.5rem 4rem}
@media (max-width:30rem){.lb{padding:1rem 1.125rem 3rem}}
.lb-sec{margin-bottom:1.25rem}
.lb-label{display:block;font-family:var(--mono);font-size:.5625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.lb-row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{padding:.45rem .7rem;background:none;border:1px solid var(--line);border-radius:999px;
  color:var(--muted);font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;transition:border-color 140ms,color 140ms,background-color 140ms}
.chip:hover{color:var(--paper)}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.08)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip:disabled{opacity:.35;cursor:default}
.chip .n{opacity:.7;margin-left:.3em}
.lb-help{margin:.5rem 0 0;font-family:var(--mono);font-size:.625rem;line-height:1.6;color:var(--muted)}
.lb-search{width:100%;padding:.6rem .75rem;margin-top:.6rem;background:var(--panel);
  border:1px solid var(--line);border-radius:2px;color:var(--paper);font-family:var(--mono);
  font-size:.75rem;-webkit-user-select:text;user-select:text}
.lb-search:focus{outline:none;border-color:var(--amber)}
.lb-list{list-style:none;margin:.75rem 0 0;padding:0;border-top:1px solid var(--line)}
.lb-item{display:flex;align-items:center;gap:.25rem;border-bottom:1px solid rgba(42,46,57,.7)}
.lb-item.is-now{background:rgba(232,163,61,.07)}
.lb-play{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:.6rem;padding:.7rem .25rem;
  background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.lb-play:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.lb-play:hover .lb-t{color:var(--amber)}
.lb-dot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:transparent;align-self:center}
.lb-item.is-now .lb-dot{background:var(--amber)}
.lb-txt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:.1rem}
.lb-t{font-family:var(--display);font-variation-settings:"wdth" 102,"wght" 540;font-size:.9375rem;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 140ms}
.lb-a{font-family:var(--mono);font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-dur{flex:0 0 auto;font-family:var(--mono);font-size:.625rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.lb-item .tp-vote{flex:0 0 auto}
.lb-empty{padding:1.5rem 0;font-family:var(--mono);font-size:.6875rem;color:var(--muted)}
.lb-tag{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--glass);margin-left:.35rem}
.lb-btn{padding:.6rem 1rem;background:none;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;transition:border-color 140ms,color 140ms}
.lb-btn:hover{border-color:var(--amber);color:var(--amber)}
.lb-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.lb-btn:disabled{opacity:.4;cursor:default}
.lb-btn[data-armed]{border-color:#c4584a;color:#e08a7e}
.lb-btn--hi{border-color:var(--amber);color:var(--amber)}
.lb-foot{margin-top:2rem;padding-top:1.25rem;border-top:1px dashed var(--line)}

/* visualizer rating bar, bottom of the screen */
#viz-bar{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15;
  transform:translateX(-50%);display:flex;flex-direction:column;gap:.1rem;max-width:calc(100vw - 2rem);
  padding:.25rem .3rem .25rem .9rem;background:rgba(20,22,28,.62);border:1px solid rgba(230,227,220,.08);
  border-radius:1.2rem;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:opacity 500ms ease}
#viz-bar[hidden]{display:none}
#viz-bar.idle{opacity:0;pointer-events:none}
body.drawer-open #viz-bar{opacity:0;pointer-events:none}
.vb-row{display:flex;align-items:center;gap:.25rem;min-width:0}
.vb-row[hidden]{display:none}
.vb-row + .vb-row{border-top:1px solid rgba(230,227,220,.07);padding-top:.1rem}
.vb-thumb{flex:0 0 auto;width:1.25rem;height:1.75rem;object-fit:cover;border-radius:2px;margin-right:.35rem;opacity:.85}
.lb-thumb{flex:0 0 auto;width:2.1rem;height:2.95rem;object-fit:cover;border-radius:2px;align-self:center;
  background:var(--panel)}
.vb-name{min-width:0;max-width:52vw;font-family:var(--mono);font-size:.5625rem;letter-spacing:.08em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:.25rem}

@media (prefers-reduced-motion:reduce){
  #drawer{transition-duration:.01ms}
  body.is-playing .tp-lamp{animation:none}
}

/* ─── timeline ───────────────────────────────────────────────────── */
.nd-timeline{list-style:none;max-width:34rem;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.nd-timeline__year{font-family:var(--mono);font-size:.625rem;letter-spacing:.22em;
  color:var(--muted);padding:2.25rem 0 .75rem 2.75rem}
.nd-timeline__year:first-child{padding-top:0}
.nd-entry{position:relative;display:grid;grid-template-columns:2.75rem 1fr;
  grid-template-areas:"rail date" "rail title" "rail blurb";gap:.2rem 0;
  padding:1rem 0 1.5rem;text-decoration:none;color:inherit;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;font:inherit}
.nd-entry:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.nd-entry__rail{grid-area:rail;position:relative}
.nd-entry__rail::before{content:"";position:absolute;left:3px;top:0;bottom:-1.5rem;
  width:1px;background:var(--line)}
.nd-entry__rail::after{content:"";position:absolute;left:0;top:.45rem;width:7px;height:7px;
  border:1.5px solid var(--muted);border-radius:50%;background:var(--ink);
  transition:background-color 140ms ease,border-color 140ms ease}
.nd-timeline__item:last-child .nd-entry__rail::before{bottom:auto;height:1.4rem}
.nd-entry:hover .nd-entry__rail::after{background:var(--amber);border-color:var(--amber)}
.nd-entry__date{grid-area:date;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nd-entry__title{grid-area:title;font-family:var(--display);
  font-variation-settings:"wdth" 108,"wght" 600;font-size:1.3125rem;line-height:1.15;
  letter-spacing:-.01em;margin-top:.15rem;transition:color 140ms ease}
.nd-entry:hover .nd-entry__title{color:var(--amber)}
.nd-entry__blurb{grid-area:blurb;font-size:.9375rem;line-height:1.5;
  color:color-mix(in srgb,var(--paper) 72%,transparent);margin-top:.35rem;text-wrap:pretty}

/* ─── note view ──────────────────────────────────────────────────── */
.nd{max-width:34rem;margin:0 auto;padding:1rem 1.5rem 5rem;font-size:1.0625rem;line-height:1.65}
.nd-head{margin-bottom:2.5rem}
.nd-head__title{font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 620;
  font-size:clamp(1.875rem,7vw,2.75rem);line-height:1.03;letter-spacing:-.015em;
  margin:0 0 .75rem;text-wrap:balance}
.nd-head__stamp{font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;
  color:var(--muted);margin:0;padding-top:1rem;border-top:1px solid var(--line)}
.nd-body>*{margin-block:0 1.25rem}
.nd-body h2{font-family:var(--mono);font-size:.6875rem;font-weight:500;text-transform:uppercase;
  letter-spacing:.18em;color:var(--muted);margin-block:2.5rem 1rem}
.nd-body h3{font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 600;
  font-size:1.1875rem;margin-block:1.75rem .5rem}
.nd-body a{color:var(--paper);text-decoration-color:var(--amber);text-underline-offset:.2em}
.nd-body a:hover{color:var(--amber)}
.nd-body code{font-family:var(--mono);font-size:.8125em;background:var(--panel);
  padding:.1em .35em;border-radius:2px}
.nd-body pre{font-family:var(--mono);font-size:.8125rem;line-height:1.6;background:var(--panel);
  border-left:2px solid var(--line);padding:1rem 1.125rem;overflow-x:auto}
.nd-body pre code{background:none;padding:0}
.nd-body ul,.nd-body ol{padding-left:1.25rem}
.nd-body li{margin-bottom:.375rem}
.nd-body li::marker{color:var(--muted)}
.nd-body img{max-width:100%;height:auto;border-radius:2px}

/* callouts — written as > [!NOTE] / > [!TIP] so GitHub renders them too */
.nd-body blockquote.nd-note,.nd-body blockquote.nd-digest{
  position:relative;margin:2rem 0;padding:0 0 0 1.25rem;border:0}
.nd-body blockquote.nd-note::before,.nd-body blockquote.nd-digest::before{
  content:"";position:absolute;left:0;top:.4em;bottom:.2em;width:2px;border-radius:1px}
.nd-body blockquote.nd-note::after,.nd-body blockquote.nd-digest::after{
  font-family:var(--mono);font-size:.5625rem;text-transform:uppercase;letter-spacing:.2em;
  position:absolute;left:1.25rem;top:-1.35em}
.nd-body blockquote.nd-note::before{background:var(--amber)}
.nd-body blockquote.nd-note::after{content:"notes";color:var(--amber)}
.nd-body blockquote.nd-digest::before{background:var(--glass)}
.nd-body blockquote.nd-digest::after{content:"digest";color:var(--glass)}
.nd-body blockquote.nd-digest{font-size:.9875rem;line-height:1.6;
  color:color-mix(in srgb,var(--paper) 88%,transparent)}
.nd-body blockquote>*:last-child{margin-bottom:0}

.nd-discuss{display:inline-flex;align-items:center;gap:.5rem;margin-top:2.5rem;
  padding:.7rem 1rem;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;
  text-transform:uppercase;text-decoration:none;transition:border-color 140ms,color 140ms}
.nd-discuss:hover{border-color:var(--amber);color:var(--amber)}

.nd-back{display:block;width:100%;max-width:34rem;margin:0 auto;padding:1.25rem 1.5rem 0;
  background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.14em;text-transform:uppercase;text-align:left;cursor:pointer}
.nd-back:hover{color:var(--amber)}
.nd-back:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.nd-msg{max-width:34rem;margin:0 auto;padding:3rem 1.5rem;font-family:var(--mono);
  font-size:.75rem;line-height:1.7;color:var(--muted)}
.nd-msg button{background:none;border:0;border-bottom:1px solid var(--amber);
  color:var(--amber);font:inherit;padding:0;cursor:pointer}

@media (max-width:30rem){
  .nd-timeline{padding:2rem 1.125rem 3rem}
  .nd{padding:1rem 1.125rem 4rem;font-size:1rem}
  .nd-entry{grid-template-columns:2.25rem 1fr}
  .nd-entry__title{font-size:1.1875rem}
}

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script type="module">
import butterchurn from 'https://unpkg.com/butterchurn@3.0.0-beta.5/dist/butterchurn.js';

/* ═══════════════════════════════════════════════════════════════════
   Config — the only block you should need to edit
   ═══════════════════════════════════════════════════════════════════ */

const CFG = {
  // audio: each library publishes a manifest.json of { id, url, title, artist }
  // (or plain URL strings). All of them are shuffled together into one station.
  libraries: [
    { name: 'lofi', manifest: 'https://szk5334.github.io/lofi-library/manifest.json' },
    { name: 'noir', manifest: 'https://szk5334.github.io/lofi-library-noir-jazz/manifest.json' },
  ],

  // notes: where the markdown lives
  owner: 'szk5334',
  repo:  'lofi-player',
  dir:   'posts',
  branch:'main',

  discussions: 'https://github.com/szk5334/lofi-player/discussions',

  // Floral Deck papers, melted into the Floral visuals (in this repo, floral/)
  pictures: 'floral/floral.json',
  picHold: 40000,      // ms before the next picture, while a Floral visual is up

  presetHold: 22000,   // ms before drifting to the next preset
  blend: 5.5,          // seconds of crossfade between presets

  // How hard the audio drives the visuals. Milkdrop reactivity scales
  // with amplitude, and most white-outs are just too much signal.
  // 1 = raw. Lower is calmer. 0.3 suits lofi.
  drive: 0.3,

  // If a preset stays brighter than this, ban it for good.
  // 0 = black, 1 = white. Measured after the CSS filter is applied.
  maxBrightness: 0.55,
  settle: 1800,        // ms to ignore after a preset loads (the crossfade)
  checkEvery: 700      // ms between brightness samples
};

/* ═══════════════════════════════════════════════════════════════════
   Floral visuals: Milkdrop presets that melt a Floral Deck paper into
   the feedback loop.

   How it works: every frame the warp shader takes last frame (already
   pushed around by zoom / rotation / warp) and mixes a little of the
   picture back in at its true position. q1 is how much. Motion smears
   the picture, the re-mix keeps it from washing away, and the music
   drives both. The picture lives in the texture named "flora".
   ═══════════════════════════════════════════════════════════════════ */

// Bloom Chintz melts to the next paper on this cycle; the player keeps time with it.
const DUO_PERIOD = 30;
const DUO_PRESET = 'Floral · Bloom Chintz';

const FLORAL_PRESETS = (() => {
  const off = () => Array.from({ length: 4 }, () => ({ baseVals: { enabled: 0 }, init_eqs_eel: '', frame_eqs_eel: '' }));
  const offW = () => Array.from({ length: 4 }, () => ({ baseVals: { enabled: 0 }, init_eqs_eel: '', frame_eqs_eel: '', point_eqs_eel: '' }));

  // The picture, right way up, at the pixel's real position.
  const PIC = 'vec2 pu = vec2(uv_orig.x, 1.0 - uv_orig.y);';

  // Shared finish: soft glow on the bass, a vignette, and a ceiling so
  // cream grounds stay smoky instead of glaring.
  const finish = (glow = 0.28) => `
  vec3 bl = texture(sampler_blur1, uv).xyz * scale1 + bias1;
  c += ${glow.toFixed(2)} * bl * clamp(bass_att - 0.6, 0.0, 1.6);
  vec2 d = (uv - 0.5) * vec2(1.0, 1.15);
  c *= mix(0.5, 1.0, smoothstep(0.78, 0.18, length(d)));
  c = c / (1.0 + 0.35 * c);
  ret = c * 0.96;`;

  // Shared beat tracker: q2 = smoothed energy (about 1), q3 = beat pulse 0..1.
  const BEAT = `
  e = (bass_att + mid_att) * 0.5;
  avg = avg * 0.985 + e * 0.015;
  hit = above(bass, avg * 1.32 + 0.12) * above(time, last + 0.28);
  last = if(hit, time, last);
  pulse = max(pulse * 0.92, hit);
  q2 = min(max(e, 0.2), 2.5);
  q3 = pulse;`;

  const make = (o) => ({
    version: 2,
    baseVals: Object.assign({
      rating: 5, gammaadj: 1, decay: 1, wave_a: 0, wave_scale: 0.1, modwavealphastart: 0, modwavealphaend: 0,
      ob_size: 0, ob_a: 0, ib_size: 0, ib_a: 0, mv_a: 0, mv_l: 0,
      zoom: 1, rot: 0, warp: 0, warpscale: 1, warpanimspeed: 1, wrap: 1, darken_center: 0
    }, o.base || {}),
    shapes: off(), waves: offW(),
    init_eqs_eel: o.init || 'avg = 1; last = 0; pulse = 0;',
    frame_eqs_eel: BEAT + '\n' + (o.frame || ''),
    pixel_eqs_eel: o.pixel || '',
    warp: `uniform sampler2D sampler_flora;\n${o.head || ''}\n shader_body {\n  ${PIC}\n${o.warp}\n }`,
    comp: ` shader_body {\n${o.comp || '  vec3 c = texture(sampler_main, uv).xyz;'}\n${finish(o.glow)}\n }`
  });

  return {
    // Petals push outward from the middle and leave trails, harder on the bass.
    'Floral · Bloom': make({
      base: { zoom: 1.006, warp: 0.06 },
      frame: `zoom = 1.004 + 0.014 * min(max(bass_att - 0.9, 0), 1.2);
  rot = 0.0025 * sin(time * 0.11);
  q1 = 0.045 + 0.05 * q3;`,
      pixel: 'zoom = zoom + 0.006 * rad * q3;',
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.997, pic, q1);`
    }),

    // Bloom's outward petal trails over Liquid Chintz's marbled flow. Every
    // DUO_PERIOD seconds the paper in one slot melts, in patches, into the
    // paper in the other slot (the player keeps the hidden slot loaded with
    // the next one), then the flow eases off and the new paper comes clear.
    'Floral · Bloom Chintz': make({
      base: { zoom: 1.006, warp: 0.05 },
      init: 'avg = 1; last = 0; pulse = 0;',
      frame: `per = ${DUO_PERIOD};
  cyc = floor(time / per);
  phs = time / per - cyc;
  mt = min(max((phs - 0.62) / 0.38, 0), 1);
  mt = mt * mt * (3 - 2 * mt);
  melt = 4 * mt * (1 - mt);
  q9 = mt;
  q10 = cyc % 2;
  q8 = 0.35 + 2.4 * melt;
  zoom = 1.004 + 0.014 * min(max(bass_att - 0.9, 0), 1.2);
  rot = 0.0025 * sin(time * 0.11);
  q1 = 0.08 - 0.055 * melt + 0.045 * q3;`,
      pixel: 'zoom = zoom + 0.006 * rad * q3;',
      head: 'uniform sampler2D sampler_flora2;',
      warp: `  vec2 n = texture(sampler_noise_lq, uv * 0.07 + vec2(time * 0.011, time * 0.007)).xy - 0.5;
  vec2 m2 = texture(sampler_noise_lq, uv * 0.19 - vec2(time * 0.017, 0.0)).xy - 0.5;
  vec2 flow = (n * 0.008 + m2 * 0.004) * q8;
  vec3 fb = texture(sampler_main, uv + flow).xyz;
  // patchy dissolve from the showing paper into the next one
  float nz = texture(sampler_noise_lq, uv_orig * 0.045 + vec2(0.37, time * 0.004)).x;
  float wt = smoothstep(nz * 0.6, nz * 0.6 + 0.4, q9);
  vec2 pw = pu + flow * 2.5;
  vec3 A = texture(sampler_flora, pw).xyz;
  vec3 B = texture(sampler_flora2, pw).xyz;
  vec3 pic = mix(A, B, q10 < 0.5 ? wt : 1.0 - wt);
  ret = mix(fb * 0.997, pic, q1);`,
      comp: `  vec3 c = texture(sampler_main, uv).xyz;
  vec3 b2 = texture(sampler_blur2, uv).xyz * scale2 + bias2;
  c += 0.16 * b2 * (0.6 + 0.4 * q2);`,
      glow: 0.4
    }),

    // The paper is pulled into a slow spiral that tightens toward the centre.
    'Floral · Whirlpool': make({
      base: { zoom: 0.997 },
      frame: `q1 = 0.04 + 0.03 * q3;
  spin = spin * 0.97 + 0.03 * (0.6 + 0.6 * q2);
  q4 = spin;`,
      init: 'avg = 1; last = 0; pulse = 0; spin = 1;',
      pixel: 'rot = 0.028 * q4 * pow(max(1 - rad * 1.6, 0), 2); zoom = 0.997 - 0.004 * (1 - rad);',
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.998, pic, q1);`
    }),

    // Milkdrop's turbulence warp lets the print run like wet ink.
    'Floral · Ink Bleed': make({
      base: { warp: 0.9, warpscale: 2.2, warpanimspeed: 0.5, zoom: 1.0 },
      frame: `warp = 0.7 + 0.6 * q2;
  q1 = 0.022 + 0.03 * q3;`,
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.999, pic, q1);`,
      comp: `  vec3 c = texture(sampler_main, uv).xyz;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(l) * vec3(0.92, 0.9, 1.0), c, 0.75);`,
      glow: 0.2
    }),

    // Seen through a rained-on window: the paper refracts and streaks downward.
    'Floral · Rain on Glass': make({
      base: { dy: 0.0015, zoom: 1.0 },
      frame: `dy = 0.001 + 0.002 * q2;
  q1 = 0.06;`,
      warp: `  vec2 n = texture(sampler_noise_lq, uv * vec2(0.12, 0.05) + vec2(0.0, time * 0.012)).xy - 0.5;
  vec2 m = texture(sampler_noise_lq, uv * vec2(0.5, 0.18) + vec2(0.31, time * 0.03)).xy - 0.5;
  vec2 off = (n * 0.03 + m * 0.008) * (0.6 + 0.5 * q2);
  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu + off).xyz;
  ret = mix(fb * 0.993, pic, q1);`,
      comp: `  vec3 c = texture(sampler_main, uv).xyz;
  vec3 b2 = texture(sampler_blur2, uv).xyz * scale2 + bias2;
  c = mix(c, b2, 0.25);`
    }),

    // Eight-way mirror of the melting paper, turning slowly.
    'Floral · Kaleidoscope': make({
      base: { zoom: 1.004, rot: 0.003 },
      frame: `zoom = 1.002 + 0.01 * q3;
  rot = 0.002 + 0.004 * (q2 - 1);
  q1 = 0.05;`,
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.997, pic, q1);`,
      comp: `  vec2 p = (uv - 0.5) * aspect.xy;
  float a = atan(p.y, p.x) + time * 0.025;
  float r = length(p);
  float seg = 6.2831853 / 8.0;
  a = mod(a, seg);
  a = abs(a - seg * 0.5);
  vec2 k = vec2(cos(a), sin(a)) * r * (0.9 + 0.05 * q3);
  vec2 q = k * aspect.zw * 1.6 + 0.5;
  q = 1.0 - abs(1.0 - mod(q, 2.0));          // mirror-tile so it fills the screen
  vec3 c = texture(sampler_main, q).xyz;`
    }),

    // The calm one: the paper stays mostly whole and breathes with the music.
    'Floral · Breathing': make({
      base: { zoom: 1.0 },
      frame: `zoom = 1.0 + 0.003 * sin(time * 0.45) + 0.006 * q3;
  q1 = 0.14;`,
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.995, pic, q1);`,
      glow: 0.45
    }),

    // Marbled, flowing like chintz in water.
    'Floral · Liquid Chintz': make({
      base: { zoom: 1.0 },
      frame: 'q1 = 0.035 + 0.025 * q3;',
      warp: `  vec2 n = texture(sampler_noise_lq, uv * 0.07 + vec2(time * 0.011, time * 0.007)).xy - 0.5;
  vec2 m = texture(sampler_noise_lq, uv * 0.19 - vec2(time * 0.017, 0.0)).xy - 0.5;
  vec2 flow = (n * 0.008 + m * 0.004) * (0.5 + q2);
  vec3 fb = texture(sampler_main, uv + flow).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.998, pic, q1);`
    }),

    // A mirrored echo of the paper, folding over itself.
    'Floral · Echo': make({
      base: { zoom: 1.003, echo_zoom: 1.0, echo_alpha: 0.45, echo_orient: 1 },
      frame: `zoom = 1.002 + 0.008 * q3;
  rot = 0.0015 * sin(time * 0.07);
  q1 = 0.05;`,
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.997, pic, q1);`
    }),

    // Each beat stamps the paper fresh; between beats it scatters and spins.
    'Floral · Petal Storm': make({
      base: { zoom: 1.0, warp: 0.25 },
      frame: `dir = if(hit, -dir, dir);
  zoom = 1.0 + 0.02 * q3;
  rot = dir * 0.012 * (0.4 + q3);
  warp = 0.2 + 0.5 * q3;
  q1 = 0.012 + 0.22 * hit;`,
      init: 'avg = 1; last = 0; pulse = 0; dir = 1;',
      pixel: 'rot = rot * (0.4 + rad);',
      warp: `  vec3 fb = texture(sampler_main, uv).xyz;
  vec3 pic = texture(sampler_flora, pu).xyz;
  ret = mix(fb * 0.996, pic, q1);`
    })
  };
})();
const isFloral = k => k.startsWith('Floral · ');
/* ═══════════════════════════════════════════════════════════════════
   Kaleido visuals: procedural dichroic-glass mandalas, no pictures.

   Every layer is drawn in mirror-folded polar space, so the whole
   thing is N-fold symmetric:
     core    a geodesic glass sphere (triangle lattice on a sphere)
     rays    needle-thin spokes
     rings   bead rings in log-polar space, streaming outward (q4)
     shards  two triangle lattices of glass panes, thin-film colours
     stars   four-point sparkles in red / gold / green / magenta
   The warp shader keeps the brightest of (new pattern, last frame
   zoomed out), which streaks light outward; the comp shader adds
   bloom and a little chromatic dispersion, like cut glass.
   ═══════════════════════════════════════════════════════════════════ */

const KALEIDO_PRESETS = (() => {

// Every track and every visual sits in exactly one of these.

const THUMB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5h3.5V20H3zM6.5 20h10.2a2 2 0 0 0 2-1.6l1.3-6.5a2 2 0 0 0-2-2.4H13l.8-3.8A1.7 1.7 0 0 0 12.1 3.6L6.5 10.5z"/></svg>';

function toast(msg) {
  let el = $('nd-toast');

    el = document.createElement('div');
    el.id = 'nd-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');

function download(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// Two taps to do anything destructive.
function armed(btn, label, fn) {
  btn?.addEventListener('click', () => {
    if (!btn.hasAttribute('data-armed')) {
      btn.setAttribute('data-armed', '');
      btn.textContent = 'Tap again to confirm';
      setTimeout(() => { if (btn.isConnected) { btn.removeAttribute('data-armed'); btn.textContent = label; } }, 3000);
      return;
    }
    fn();
  });

function webgl2() {
  try { return !!document.createElement('canvas').getContext('webgl2'); }
  catch { return false; }
}
const canViz = webgl2() && !reduce;

function presetPool() {
  const all = {};
  if (window.base?.default) Object.assign(all, window.base.default);
  if (window.extra?.default) Object.assign(all, window.extra.default);
  return all;
}
const presets = Object.assign(presetPool(), FLORAL_PRESETS, KALEIDO_PRESETS, KALEIDO2_PRESETS, COSMOS_PRESETS);
const kindRank = k => isFloral(k) ? 0 : isKaleido(k) ? 1 : isCosmos(k) ? 2 : 3;
const presetKeys = Object.keys(presets).sort((a, b) =>
  (kindRank(a) - kindRank(b)) || a.localeCompare(b, undefined, { sensitivity: 'base' }));

function vizSize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  return [Math.max(1, Math.round(canvas.clientWidth * dpr)),
          Math.max(1, Math.round(canvas.clientHeight * dpr))];
}

/* Butterchurn draws into its own off-screen WebGL canvas, then copies each
   frame onto #viz with a 2D drawImage at (0,0). So #viz has to be exactly
   the render size. Left at the browser default (300×150), you only ever see
   the top-left corner of the frame stretched across the screen, which is
   the "zoomed way in" look. */
function sizeRenderer() {
  if (!viz) return;
  const [w, h] = vizSize();
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  viz.setRendererSize(w, h);
  clearTimeout(sizeRenderer._t);
  sizeRenderer._t = setTimeout(() => { if (cropPic()) uploadPic(); }, 250);
}
addEventListener('resize', sizeRenderer);

/* ─── visual votes ────────────────────────────────────────────────
   Separate from track votes. Thumbs down keeps a visual out of rotation
   (unless you turn Disliked on in Visuals → Show from).
------------------------------------------------------------------ */
const vvotes  = store.get('nd.vizvotes', {});
const vfilter = Object.assign({ up: true, none: true, down: false }, store.get('nd.vfilter', {}));
let autoCycle = store.get('nd.vcycle', true);
const vVoteOf = k => vvotes[k]?.v || 0;

// Too-bright presets are dropped automatically, separately from your votes.
const BANS = 'nd.banned';
const banned = new Set(store.get(BANS, []));
const saveBans = () => store.set(BANS, [...banned]);

const VKINDS = ['floral', 'kaleido', 'cosmos', 'classic'];
const VKIND_LABEL = { floral: 'Floral', kaleido: 'Kaleido', cosmos: 'Cosmos', classic: 'Classic' };
const vtype = Object.assign({ floral: true, kaleido: true, cosmos: true, classic: true }, store.get('nd.vtype', {}));
const typeOf = k => isFloral(k) ? 'floral' : isKaleido(k) ? 'kaleido' : isCosmos(k) ? 'cosmos' : 'classic';
// Florals need the pictures; without them they'd only show the stock cloud texture.
const vAllowed = k => vtype[typeOf(k)] && (!isFloral(k) || pics.length > 0) &&
                      vfilter[catOf(vVoteOf(k))] && !banned.has(k);

function pickPreset() {
  let live = presetKeys.filter(k => k !== current && vAllowed(k));
  if (!live.length) live = presetKeys.filter(vAllowed);
  // Each kind that's on gets an equal share, so 9 florals and 3 kaleidos
  // aren't buried under 107 classics.
  // (a kind with only one or two visuals gets a smaller share, so it doesn't repeat constantly)
  const kinds = VKINDS.map(t => live.filter(k => typeOf(k) === t)).filter(g => g.length);
  if (kinds.length > 1) {
    const w = kinds.map(g => Math.min(g.length, 3) / 3);
    let x = Math.random() * w.reduce((a, b) => a + b, 0);
    live = kinds.find((g, i) => (x -= w[i]) < 0) || kinds[kinds.length - 1];
  }
  if (!live.length) live = presetKeys.filter(k => !banned.has(k) && vVoteOf(k) >= 0);
  if (!live.length) live = presetKeys.filter(k => !banned.has(k));
  if (!live.length) { banned.clear(); saveBans(); live = presetKeys; }
  return live[Math.floor(Math.random() * live.length)];
}

function restartCycle() {
  clearInterval(cycle); cycle = null;
  // Bloom Chintz stays for two and a half of its melt cycles, so you see it melt twice.
  const hold = current === DUO_PRESET ? DUO_PERIOD * 2500 : CFG.presetHold;
  if (viz && autoCycle) cycle = setInterval(() => roll(CFG.blend), hold);
}

function showPreset(k, blend = 2.5) {
