<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIGHTDECK</title>
<meta name="theme-color" content="#0A0910">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=Newsreader:ital,wght@1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0910;
    --deck:#14121C;
    --haze:#2A2438;
    --dust:#9A93A8;
    --lamp:#FF6F91;
    --glow:#7FD1C9;
    --edge:rgba(154,147,168,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:#EDE9F2;
    font-family:"Space Mono",ui-monospace,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .deck{width:100%; max-width:640px}

  .top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
  .mark{
    font-family:"Big Shoulders Display",sans-serif; font-weight:700;
    font-size:clamp(26px,7vw,38px); letter-spacing:.22em; line-height:1;
    margin:0; text-transform:uppercase; color:#EDE9F2;
  }
  .mark b{color:var(--lamp); font-weight:700}
  .status{font-size:10px; letter-spacing:.18em; color:var(--dust); text-transform:uppercase; white-space:nowrap}
  .status .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--haze); margin-right:6px; vertical-align:middle;
  }
  .status.live .dot{background:var(--lamp); box-shadow:0 0 8px var(--lamp); animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .window{
    position:relative; aspect-ratio:16/10; border-radius:3px; overflow:hidden;
    background:var(--deck); border:1px solid var(--edge);
    box-shadow:inset 0 0 60px rgba(0,0,0,.75);
  }
  .window canvas{position:absolute; inset:0; width:100%; height:100%; display:block}

  .gate{
    position:absolute; inset:0; display:grid; place-items:center;
    background:rgba(10,9,16,.82); backdrop-filter:blur(2px);
    transition:opacity .5s ease; z-index:3;
  }
  .gate[hidden]{display:none}
  .gate.out{opacity:0; pointer-events:none}
  .tune{
    font-family:"Big Shoulders Display",sans-serif; font-weight:500;
    font-size:20px; letter-spacing:.28em; text-transform:uppercase;
    background:none; border:1px solid var(--lamp); color:var(--lamp);
    padding:12px 26px; border-radius:2px; cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .tune:hover,.tune:focus-visible{background:var(--lamp); color:var(--ink)}
  .tune[disabled]{border-color:var(--haze); color:var(--dust); cursor:default}
  .gate small{
    display:block; margin-top:14px; text-align:center; font-size:10px;
    letter-spacing:.14em; color:var(--dust); text-transform:uppercase; max-width:34ch;
  }

  .strip{
    position:relative; height:22px; margin-top:8px;
    border-left:1px solid var(--edge); border-right:1px solid var(--edge);
  }
  .ticks{position:absolute; inset:0; opacity:.5}
  .ticks i{position:absolute; top:11px; bottom:0; width:1px; background:var(--haze)}
  .ticks i.q{top:5px; background:var(--dust); opacity:.6}
  .needle{
    position:absolute; top:0; bottom:0; width:1px; background:var(--lamp);
    box-shadow:0 0 7px var(--lamp); transform:translateX(-.5px);
    transition:left .9s linear;
  }
  .needle::before{
    content:""; position:absolute; top:0; left:-2px; width:5px; height:5px;
    background:var(--lamp); border-radius:50%;
  }

  .now{margin-top:18px; min-height:74px}
  .title{
    font-family:"Newsreader",Georgia,serif; font-style:italic; font-weight:400;
    font-size:clamp(21px,5.2vw,30px); line-height:1.2; margin:0 0 6px;
    overflow-wrap:anywhere; transition:opacity .45s ease;
  }
  .title.blend{opacity:.55}
  .line{font-size:11px; letter-spacing:.13em; color:var(--dust); text-transform:uppercase}
  .line span{color:var(--haze); margin:0 8px}
  .line em.mixing{font-style:normal; color:var(--glow)}

  .bar{display:flex; align-items:center; gap:16px; margin-top:20px; padding-top:16px; border-top:1px solid var(--edge)}
  .play{
    flex:none; width:46px; height:46px; border-radius:50%;
    border:1px solid var(--edge); background:var(--deck); color:#EDE9F2;
    cursor:pointer; display:grid; place-items:center; transition:border-color .2s}
  .play:hover,.play:focus-visible{border-color:var(--lamp)}
  .play svg{width:15px; height:15px; fill:currentColor}
  .vol{flex:1; display:flex; align-items:center; gap:10px; max-width:190px}
  .vol label{font-size:10px; letter-spacing:.16em; color:var(--dust)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:1px;
    background:var(--haze); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--glow); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; border:0; border-radius:50%; background:var(--glow); cursor:pointer;
  }
  .up{margin-left:auto; text-align:right; font-size:10px; letter-spacing:.13em; color:var(--dust); text-transform:uppercase; min-width:0}
  .up b{display:block; font-weight:400; color:var(--haze); font-size:9px; margin-bottom:3px}
  .up u{display:block; text-decoration:none; color:var(--dust); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:22ch}

  :focus-visible{outline:1px solid var(--glow); outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="deck">

  <div class="top">
    <h1 class="mark">Night<b>deck</b></h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Warming up</span></div>
  </div>

  <div class="window">
    <canvas id="cv"></canvas>
    <div class="gate" id="gate">
      <div>
        <button class="tune" id="tune" disabled>Tune in</button>
        <small id="gateNote">Reading the library</small>
      </div>
    </div>
  </div>

  <div class="strip">
    <div class="ticks" id="ticks"></div>
    <div class="needle" id="needle" style="left:0"></div>
  </div>

  <div class="now">
    <h2 class="title" id="title">&mdash;</h2>
    <div class="line">
      <span id="artist">&nbsp;</span>
    </div>
    <div class="line" style="margin-top:4px">
      <em id="clock" style="font-style:normal">0:00</em><span>/</span><em id="dur" style="font-style:normal">0:00</em>
      <em id="mixing" class="mixing" style="display:none; margin-left:10px">mixing</em>
    </div>
  </div>

  <div class="bar">
    <button class="play" id="play" aria-label="Play">
      <svg id="icon" viewBox="0 0 12 14"><path d="M0 0l12 7-12 7z"/></svg>
    </button>
    <div class="vol">
      <label for="vol">VOL</label>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.75" aria-label="Volume">
    </div>
    <div class="up">
      <b>Up next</b>
      <u id="next">&mdash;</u>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * CONFIG
 *
 * FADE — crossfade length in seconds. This is load-bearing for the
 *   sync: with an overlap, each track only advances the station by
 *   (duration - FADE), so the schedule is walked over those effective
 *   durations. Changing FADE changes the block length and therefore
 *   reshuffles the schedule for everyone. Pick a number and leave it.
 *
 * EPOCH — station sign-on. Same warning, more so.
 * ------------------------------------------------------------------ */
var CONFIG = {
  BASE:  "https://szk5334.github.io/lofi-library/",
  EPOCH: Date.UTC(2026, 0, 1, 0, 0, 0),
  FADE:  5
};

var $ = function(id){ return document.getElementById(id); };
var noop = function(){};
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- state ---------- */
var tracks = [], order = [], idx = 0, block = 0, total = 0;
var synced = false, started = false, misses = 0;
var active = 0, fading = false, armed = null;

/* ---------- deterministic shuffle ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, seed){
  var a = arr.slice(), rnd = mulberry32((seed * 2654435761) >>> 0);
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* How much of the station's clock one track consumes. Overlap means
   less than its full length. */
function slot(t){
  return Math.max((t.dur || 0) - CONFIG.FADE, 1);
}

function scheduleAt(when){
  var elapsed = Math.max(0, (when - CONFIG.EPOCH) / 1000);
  var b   = Math.floor(elapsed / total);
  var off = elapsed - b * total;
  var ord = shuffle(tracks, b);
  for (var i = 0; i < ord.length; i++){
    var s = slot(ord[i]);
    if (off < s) return { order: ord, index: i, offset: off, block: b };
    off -= s;
  }
  return { order: ord, index: 0, offset: 0, block: b };
}

/* ---------- playlist ---------- */
function url(t){
  return CONFIG.BASE + t.file.split("/").map(encodeURIComponent).join("/");
}
function prettify(file){
  return file.split("/").pop().replace(/\.mp3$/i, "")
             .replace(/[_+]+/g, " ").replace(/\s+/g, " ").trim();
}
function fmt(s){
  if (!isFinite(s) || s < 0) s = 0;
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function label(t){ return t ? (t.title || prettify(t.file)) : "\u2014"; }

function load(){
  return fetch(CONFIG.BASE + "playlist.json", { cache: "no-cache" })
    .then(function(r){
      if (!r.ok) throw new Error("playlist " + r.status);
      return r.json();
    })
    .then(function(raw){
      var list = Array.isArray(raw) ? raw : (raw && raw.tracks) || [];
      return list.map(function(t){
        if (typeof t === "string") return { file: t, dur: 0, title: null, artist: null };
        return {
          file:   t.file,
          dur:    typeof t.dur === "number" ? t.dur : 0,
          title:  t.title  || null,
          artist: t.artist || null
        };
      }).filter(function(t){ return t.file; });
    });
}

/* ------------------------------------------------------------------ *
 * AUDIO
 *
 * Two decks, like a real one. Each <audio> gets its own source node
 * (createMediaElementSource can only be called once per element), its
 * own gain for the fade, and both feed a shared mix bus.
 *
 *   deck A -> gainA -\
 *                     >-- mix --+--> analyser        (visualiser tap)
 *   deck B -> gainB -/          \--> master -> out   (volume)
 *
 * The analyser hangs off mix rather than master so the smoke keeps
 * moving when you pull the volume down.
 * ------------------------------------------------------------------ */
var decks = [
  { el: new Audio(), gain: null, src: null },
  { el: new Audio(), gain: null, src: null }
];
decks.forEach(function(d){ d.el.preload = "auto"; });

var actx = null, analyser = null, freq = null, mix = null, master = null;
var vol = 0.75;

function graph(){
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();

  mix    = actx.createGain();
  master = actx.createGain();
  master.gain.value = vol;

  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.84;
  freq = new Uint8Array(analyser.frequencyBinCount);

  mix.connect(analyser);
  mix.connect(master);
  master.connect(actx.destination);

  decks.forEach(function(d){
    d.node = actx.createMediaElementSource(d.el);
    d.gain = actx.createGain();
    d.gain.gain.value = 0;
    d.node.connect(d.gain);
    d.gain.connect(mix);
  });
}

/* Equal-power curves. A linear crossfade dips in the middle, because
   two uncorrelated signals at 0.5 sum to less than one at 1.0 — you
   hear it as a small hole. sin/cos keeps the power constant. */
function curve(rising){
  var n = 64, c = new Float32Array(n);
  for (var i = 0; i < n; i++){
    var t = (i / (n - 1)) * Math.PI / 2;
    c[i] = rising ? Math.sin(t) : Math.cos(t);
  }
  return c;
}
var UP = curve(true), DOWN = curve(false);

function applyFade(param, rising, secs){
  var t0 = actx.currentTime;
  try {
    param.cancelScheduledValues(t0);
    param.setValueCurveAtTime(rising ? UP : DOWN, t0, secs);
  } catch(e){
    /* older Safari throws on overlapping curves */
    param.cancelScheduledValues(t0);
    param.setValueAtTime(param.value, t0);
    param.linearRampToValueAtTime(rising ? 1 : 0, t0 + secs);
  }
}

/* iOS won't let an <audio> element play programmatically unless it has
   been played once from a real user gesture. Deck B never gets one, so
   we spend the tune-in tap on both. */
function unlock(){
  decks.forEach(function(d){
    var p = d.el.play();
    if (p && p.then) p.then(function(){ d.el.pause(); }).catch(noop);
    else { try { d.el.pause(); } catch(e){} }
  });
}

function setSrc(d, t){
  var u = url(t);
  if (d.src === u) return;
  d.el.src = u;
  d.src = u;
  d.el.load();
}

/* Hard start — tune-in, and gross-drift correction. No overlap here. */
function cue(i, offset){
  idx = i;
  armed = null;
  fading = false;
  var a = decks[active], b = decks[1 - active];

  b.el.pause();
  b.gain.gain.cancelScheduledValues(actx.currentTime);
  b.gain.gain.value = 0;

  setSrc(a, order[idx]);
  var seek = function(){
    if (offset > 1 && offset < (a.el.duration || Infinity) - 2){
      try { a.el.currentTime = offset; } catch(e){}
    }
    a.el.removeEventListener("loadedmetadata", seek);
  };
  if (a.el.readyState >= 1) seek();
  else a.el.addEventListener("loadedmetadata", seek);

  a.gain.gain.cancelScheduledValues(actx.currentTime);
  a.gain.gain.value = 0;
  applyFade(a.gain.gain, true, 0.6);
  a.el.play().catch(noop);

  paintMeta();
}

/* What plays after the current track, taken from the clock so the
   station self-corrects instead of accumulating drift. */
function nextSlot(){
  if (!synced) return { index: (idx + 1) % order.length, track: order[(idx + 1) % order.length] };
  var a = decks[active].el;
  var s = slot(order[idx]);
  var remain = Math.max(0, s - (a.currentTime || 0));
  var sc = scheduleAt(Date.now() + (remain + 0.5) * 1000);
  return { index: sc.index, track: sc.order[sc.index], order: sc.order, block: sc.block };
}

function armNext(){
  armed = nextSlot();
  if (armed && armed.track) setSrc(decks[1 - active], armed.track);
}

function startCrossfade(){
  if (fading) return;
  if (!armed) armNext();
  if (!armed || !armed.track) return;

  var from = active, to = 1 - active;
  var b = decks[to];

  try { b.el.currentTime = 0; } catch(e){}
  b.el.play().catch(noop);

  applyFade(decks[from].gain.gain, false, CONFIG.FADE);
  applyFade(b.gain.gain, true, CONFIG.FADE);

  active = to;
  idx = armed.index;
  if (armed.order){ order = armed.order; block = armed.block; }
  armed = null;
  fading = true;
  $("mixing").style.display = "";
  $("title").classList.add("blend");

  setTimeout(function(){
    decks[from].el.pause();
    decks[from].gain.gain.cancelScheduledValues(actx.currentTime);
    decks[from].gain.gain.value = 0;
    fading = false;
    $("mixing").style.display = "none";
    $("title").classList.remove("blend");
  }, (CONFIG.FADE + 0.3) * 1000);

  paintMeta();
}

/* Driver. Uses the file's real duration where the browser knows it,
   so a wrong number in playlist.json can't cut a track short. */
function tick(){
  if (!started || !actx) return;
  var a = decks[active].el;
  if (a.paused || !isFinite(a.duration) || !a.duration) return;

  var end = Math.max(a.duration - CONFIG.FADE, 1);
  var remain = end - a.currentTime;

  if (!armed && !fading && remain < 30) armNext();
  if (!fading && remain <= 0.15) startCrossfade();

  $("clock").textContent = fmt(a.currentTime);
  $("dur").textContent   = fmt(a.duration);
}
setInterval(tick, 200);

/* Fallback: if a track runs out before the fade fired, move on. */
decks.forEach(function(d, i){
  d.el.addEventListener("ended", function(){
    if (i === active && !fading) startCrossfade();
  });
  d.el.addEventListener("error", function(){
    if (i !== active) { armed = null; return; }   // bad preload, just re-arm
    if (++misses > 8){ fail("Too many tracks failed to load. Check the library URLs."); return; }
    startCrossfade();
  });
  d.el.addEventListener("loadedmetadata", function(){ if (i === active) misses = 0; });
});

/* Gross-drift guard: sleeping tabs, block rollovers. */
setInterval(function(){
  if (!started || !synced || fading || decks[active].el.paused) return;
  var s = scheduleAt(Date.now());
  if (s.block !== block || s.index !== idx || Math.abs(s.offset - decks[active].el.currentTime) > 25){
    order = s.order; block = s.block;
    cue(s.index, s.offset);
  }
}, 20000);

/* ---------- painting ---------- */
function paintMeta(){
  var t = order[idx];
  if (!t) return;
  $("title").textContent  = label(t);
  $("artist").textContent = t.artist || "Unknown artist";
  var n = nextSlot();
  $("next").textContent = n ? label(n.track) : "\u2014";
  needle();
}

function renderTicks(){
  var box = $("ticks");
  box.innerHTML = "";
  var n = order.length;
  if (!n) return;
  var step = n > 90 ? Math.ceil(n / 90) : 1;
  for (var i = 0; i < n; i += step){
    var el = document.createElement("i");
    el.style.left = (i / n * 100) + "%";
    if (i % (step * 10) === 0) el.className = "q";
    box.appendChild(el);
  }
}

function needle(){
  var frac;
  if (synced && total){
    frac = (Math.max(0, (Date.now() - CONFIG.EPOCH) / 1000) % total) / total;
  } else {
    frac = order.length ? idx / order.length : 0;
  }
  $("needle").style.left = (frac * 100) + "%";
}
setInterval(needle, 1000);

function status(text, live){
  $("statusText").textContent = text;
  $("status").classList.toggle("live", !!live);
}
function fail(msg){
  status("Off air", false);
  $("gate").classList.remove("out");
  $("gate").hidden = false;
  $("tune").disabled = true;
  $("tune").textContent = "Off air";
  $("gateNote").textContent = msg;
}

/* ---------- the smoke ---------- */
var cv = $("cv"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
var FW = 220, FH = 138;
var buf = [document.createElement("canvas"), document.createElement("canvas")];
var bx = buf.map(function(c){ c.width = FW; c.height = FH; return c.getContext("2d"); });
var cur = 0, BANDS = 6, level = new Float32Array(BANDS);

var grain = (function(){
  var g = document.createElement("canvas"); g.width = g.height = 96;
  var gc = g.getContext("2d"), im = gc.createImageData(96, 96), d = im.data;
  for (var i = 0; i < d.length; i += 4){
    var v = 118 + Math.random() * 68;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  gc.putImageData(im, 0, 0);
  return g;
})();

function resize(){
  var r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width * DPR));
  H = Math.max(1, Math.round(r.height * DPR));
  cv.width = W; cv.height = H;
}
addEventListener("resize", resize);

function mixc(a, b, t){
  return "rgba(" + Math.round(a[0]+(b[0]-a[0])*t) + "," +
                   Math.round(a[1]+(b[1]-a[1])*t) + "," +
                   Math.round(a[2]+(b[2]-a[2])*t) + ",";
}
var LAMP = [255,111,145], GLOW = [127,209,201];

function frame(t){
  requestAnimationFrame(frame);
  if (!W) resize();

  if (analyser && !decks[active].el.paused){
    analyser.getByteFrequencyData(freq);
    var bins = freq.length;
    for (var b = 0; b < BANDS; b++){
      var lo = Math.floor(Math.pow(bins, b / BANDS));
      var hi = Math.floor(Math.pow(bins, (b + 1) / BANDS));
      var sum = 0, n = 0;
      for (var k = lo; k < hi && k < bins; k++){ sum += freq[k]; n++; }
      var v = n ? (sum / n) / 255 : 0;
      level[b] += (v - level[b]) * 0.18;
    }
  } else {
    for (var b2 = 0; b2 < BANDS; b2++) level[b2] += (0.05 - level[b2]) * 0.05;
  }

  var dst = bx[1 - cur], dstC = buf[1 - cur], srcC = buf[cur];
  var time = t / 1000;

  dst.setTransform(1, 0, 0, 1, 0, 0);
  dst.clearRect(0, 0, FW, FH);
  dst.globalAlpha = reduce ? 0.86 : 0.951;
  var s = reduce ? 1.004 : 1.016;
  var sway = reduce ? 0 : Math.sin(time * 0.21) * 1.1;
  dst.setTransform(s, 0, 0, s, (FW * (1 - s)) / 2 + sway, (FH * (1 - s)) / 2 - (reduce ? 0.2 : 1.15));
  dst.drawImage(srcC, 0, 0);
  dst.setTransform(1, 0, 0, 1, 0, 0);
  dst.globalAlpha = 1;

  dst.globalCompositeOperation = "lighter";
  for (var i = 0; i < BANDS; i++){
    var e = level[i];
    if (e < 0.02) continue;
    var px = FW * (0.12 + 0.76 * (i / (BANDS - 1)))
           + Math.sin(time * (0.29 + i * 0.11) + i * 2.1) * FW * 0.075;
    var py = FH * 0.9 - Math.cos(time * (0.19 + i * 0.07) + i) * FH * 0.05 - e * FH * 0.1;
    var rad = FH * (0.09 + e * 0.4);
    var tint = mixc(LAMP, GLOW, i / (BANDS - 1));
    var g = dst.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0,   tint + (0.42 * e).toFixed(3) + ")");
    g.addColorStop(0.5, tint + (0.13 * e).toFixed(3) + ")");
    g.addColorStop(1,   tint + "0)");
    dst.fillStyle = g;
    dst.beginPath();
    dst.arc(px, py, rad, 0, 6.2832);
    dst.fill();
  }
  dst.globalCompositeOperation = "source-over";
  cur = 1 - cur;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#0A0910";
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(dstC, 0, 0, W, H);

  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.045;
  for (var gx = 0; gx < W; gx += 96)
    for (var gy = 0; gy < H; gy += 96)
      ctx.drawImage(grain, gx, gy);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.24, W/2, H/2, Math.max(W,H)*0.72);
  vg.addColorStop(0, "rgba(10,9,16,0)");
  vg.addColorStop(1, "rgba(10,9,16,0.82)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}
requestAnimationFrame(frame);

/* ---------- controls ---------- */
var PLAY  = "M0 0l12 7-12 7z";
var PAUSE = "M0 0h4v14H0zM8 0h4v14H8z";
function setIcon(){
  var p = !started || decks[active].el.paused;
  $("icon").firstElementChild.setAttribute("d", p ? PLAY : PAUSE);
  $("play").setAttribute("aria-label", p ? "Play" : "Pause");
}
decks.forEach(function(d){
  d.el.addEventListener("play", setIcon);
  d.el.addEventListener("pause", setIcon);
});

$("play").addEventListener("click", function(){
  if (!started) return tuneIn();
  if (decks[active].el.paused){
    if (actx.state === "suspended") actx.resume();
    if (synced) rejoin(); else decks[active].el.play().catch(noop);
  } else {
    decks.forEach(function(d){ d.el.pause(); });
  }
  setIcon();
});

function rejoin(){
  var s = scheduleAt(Date.now());
  order = s.order; block = s.block;
  cue(s.index, s.offset);
}

$("vol").addEventListener("input", function(){
  vol = +this.value;
  if (master) master.gain.value = vol;
});

addEventListener("keydown", function(e){
  if (e.code === "Space" && !/INPUT|BUTTON/.test(e.target.tagName)){
    e.preventDefault();
    $("play").click();
  }
});

function tuneIn(){
  if (started) return;
  started = true;
  graph();
  if (actx.state === "suspended") actx.resume();
  unlock();

  if (synced) rejoin();
  else { order = shuffle(tracks, Math.floor(Date.now() / 864e5)); cue(0, 0); }

  var gate = $("gate");
  gate.classList.add("out");
  setTimeout(function(){ gate.hidden = true; }, 520);
  status(synced ? "On air \u00b7 synced" : "On air \u00b7 shuffle", true);
}
$("tune").addEventListener("click", tuneIn);

/* ---------- boot ---------- */
resize();
load().then(function(list){
  if (!list.length){ fail("The library is empty. Push some MP3s and rerun the playlist workflow."); return; }
  tracks = list;
  synced = tracks.every(function(t){ return t.dur > 0; });
  total  = tracks.reduce(function(a, t){ return a + slot(t); }, 0);

  if (synced){
    var s = scheduleAt(Date.now());
    order = s.order; block = s.block; idx = s.index;
  } else {
    order = shuffle(tracks, Math.floor(Date.now() / 864e5));
    idx = 0;
  }
  renderTicks();
  $("title").textContent  = label(order[idx]);
  $("artist").textContent = (order[idx] && order[idx].artist) || "Unknown artist";
  needle();
  $("tune").disabled = false;
  $("gateNote").textContent = tracks.length + " tracks \u00b7 " +
    (total ? (total / 3600).toFixed(1) + " hours" : "durations unknown");
  status("Standing by");
}).catch(function(e){
  console.error(e);
  fail("Can\u2019t reach the library. Check that Pages is enabled on lofi-library.");
});

})();
</script>
</body>
